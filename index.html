记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "元丹丘": "\n# 元丹丘\n\n元丹丘，唐代道教交游人物，生卒年及完整家世不详，是[[李白]]的重要朋友。李白诗中“丹丘生”及对其山居、求道生活的吟咏，提供了直接的交往证据。\n\n[[将进酒（李白）]]点名“岑夫子，丹丘生”，前者通行解作[[岑勋]]。宴饮地点常系嵩山颍阳一带元丹丘山居，系年有736、752等说，不能把某一年与某一处现代遗址说成全无争议。\n\n他所代表的交游，不仅是饮酒，也包含山居、道教兴趣与引荐网络。涉及通过玉真公主推荐李白的具体链条，须另核材料，不能从相识关系自动推出推荐事实。\n\n## 来源与核查\n\n- [《将进酒》原文](https://zh.wikisource.org/wiki/將進酒_(李白))\n- [《全唐诗》李白赠元丹丘等篇](https://zh.wikisource.org/wiki/全唐詩/卷178)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "白雪歌送武判官归京": "\n\n## 完整原文\n\n北风卷地白草折，胡天八月即飞雪。\n忽如一夜春风来，千树万树梨花开。\n散入珠帘湿罗幕，狐裘不暖锦衾薄。\n将军角弓不得控，都护铁衣冷难著。\n瀚海阑干百丈冰，愁云惨淡万里凝。\n中军置酒饮归客，胡琴琵琶与羌笛。\n纷纷暮雪下辕门，风掣红旗冻不翻。\n轮台东门送君去，去时雪满天山路。\n山回路转不见君，雪上空留马行处。\n\n## 网页补充说明\n\n本段为地图网页补充的完整古诗，采用通行正文、简体字与现代标点；作品异文与创作背景请结合下方原笔记。\n\n[原文与异文来源](https://zh.wikisource.org/wiki/白雪歌送武判官歸京)\n\n## 原笔记与创作背景\n# 白雪歌送武判官归京\n\n作者岑参，七言歌行兼送别诗。通常置于[[岑参第二次出塞]]的北庭生活背景。送别对象见[[武判官]]。\n\n## 两处关键句\n\n> 忽如一夜春风来，千树万树梨花开。\n\n> 山回路转不见君，雪上空留马行处。\n\n## 怎样读（整理者解读）\n\n开头的雪景通过春花的比喻产生惊奇，随后触及衣被、兵器和军帐，寒冷由视觉变成身体感受。宴饮把归客带入画面，末尾又将人的离去交给山路与马迹。\n\n可以顺着“雪景—军中—宴别—远去”的过程读。写景与送别并不是各占一半的机械拼接，雪贯穿了整场离别。\n\n## 史料边界\n\n具体作年有系年说，本页不固定为某年某日。诗中的夸张和比喻不能当气象测量。教育资料与古籍文字有异文，引用时注明版本。\n\n关联：[[封常清]]（军幕背景）、[[岑参的行旅地点]]、[[岑参·人生故事]]。\n\n## 来源与核查\n\n- [《白雪歌》原文及异文](https://zh.wikisource.org/wiki/白雪歌送武判官歸京)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "李白当涂晚年与诗集编纂": "\n# 李白当涂晚年与诗集编纂\n\n## 762年：病中托稿\n\n[[李白]]晚年往依任当涂令的[[李阳冰]]，通行卒年762。《草堂集序》署宝应元年十一月，记病亟、枕上授简并托序。此近人记录是理解晚年与文集形成的重要材料，支持病中处境；不能把序的署日直接当作李白确定卒日。\n\n## 诗集是后人阅读的中介\n\n李阳冰编《草堂集》十卷，魏颢等此前也参与过诗文搜集，后代继续补辑、校勘。今日《李太白文集》、清代集注与现代校注经过多层传承，不是李白自己一次排定的终稿。\n\n序中的佚失概数带有感叹色彩。古诗异文如[[将进酒（李白）]]的“天生我材／天生吾徒”不能简单按耳熟程度判断真假。对读[[岑嘉州集的编纂与流传]]，可见诗人生前境遇与作品身后命运是两条相关而不同的线。\n\n## 捞月故事的界限\n\n捞月溺死见后世传说，不能用来覆盖病中托稿材料。墓葬、后来改葬的叙述还涉及范传正碑文，不把采石、当涂、青山不同地理节点混成同一地点。\n\n## 来源与核查\n\n- [李阳冰《草堂集序》](https://www.xuges.com/mj/l/libai/072.htm)\n- [《新唐书》李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [宋蜀刻本及传承](https://www.shuge.org/view/li_tai_bai_wen_ji/)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "唐代皇帝主线·人物事件与诗歌知识地图": "\n# 唐代皇帝主线·人物事件与诗歌知识地图\n\n以皇帝在位时期作为时间轴，沿事件进入人物，再进入完整诗篇及其创作处境。本专题集中在既有唐诗人物经历最相关的玄宗、肃宗、代宗三朝，不冒充全唐皇帝百科。\n\n## 主线与阅读顺序\n\n| 皇帝 | 在位 | 时期问题 | 人物与作品入口 |\n|---|---|---|---|\n| [[唐玄宗李隆基]] | 712—756 | 开元治理、文人求仕、天宝开边、安史乱起 | [[李白]]、[[高适]]、[[杜甫]]、[[岑参·人生故事]] |\n| [[唐肃宗李亨]] | 756—762 | 战时继位、收复两京、宗室冲突、征役 | [[郭子仪]]、[[永王李璘]]、[[春望]]、[[石壕吏]] |\n| [[唐代宗李豫]] | 762—779 | 结束叛乱、吐蕃入京、地方军政与诗人晚年 | [[严武]]、[[杜鸿渐]]、[[闻官军收河南河北]]、[[登高（杜甫）]] |\n\n1. 先读[[唐代三朝·继承与时代时间线]]，辨明在位、上皇与年号。\n2. 进入皇帝页面，看“事件—人物—作品”的不同关系。\n3. 用[[唐代三朝·作品与创作环境索引]]阅读完整原文，保留原作品页中的系年争议。\n4. 用[[唐代皇帝主线·史料与关系规则]]区分亲见、任职、政治背景、文学追忆。\n\n## 李白的人生在主线中\n\n[[李白出蜀漫游与安陆生活]] → [[李白翰林供奉与赐金放还]] → [[梁宋交游与李杜高同游]]，主要处于玄宗朝。\n\n[[永王事件与高适李白分途]] → [[李白流夜郎与遇赦东还]]，置于肃宗朝的宗室与战争环境中。\n\n[[李白当涂晚年与诗集编纂]]涉及762年前后的生命终点与作品传承；年代跨肃宗、代宗，不能只凭年份断定他已经受代宗任用。\n\n## 使用关系图\n\n打开本页局部关系图，可看三位皇帝与人物、事件；再点入作品页查看原文和背景。关系图上的相邻仅表示笔记关联，正文才说明是否见过面、任职或仅共享时代。\n\n已有专题：[[李白孟浩然与盛唐诗友·知识地图]]、[[高适与杜甫·作品与时代知识地图]]、[[岑参·人生故事与知识导航]]。\n\n## 来源\n\n- [《旧唐书》卷8](https://zh.wikisource.org/wiki/舊唐書/卷8)\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n- [《旧唐书》卷11](https://zh.wikisource.org/wiki/舊唐書/卷11)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "高适·年表与争议": "\n# 高适·年表与争议\n\n本表把诗序明记、史传记载、通行编年分开。高适的具体生年仍保留异说；不以诗中“三十春”之类概数倒算出生年。\n\n| 时间 | 地点、身份与处境 | 作品或事件入口 | 依据及争议 |\n|---|---|---|---|\n| 生年未定，卒765 | 渤海家世，长期梁宋漂泊 | [[高适]] | 701、704、706等说见不同年谱与研究；本轮不择一为定论 |\n| 730年代 | 东北游历、梁宋求仕 | [[开元东北边事与燕歌行]] | 行旅细节不能等同逐战亲历 |\n| 738 | 未任封丘尉 | [[燕歌行]] | 序明记开元二十六年；本事与讽刺对象另有争议 |\n| 744前后 | 与李白、杜甫梁宋交游 | [[梁宋交游与李杜高同游]] | 具体同行范围须逐诗核对 |\n| 通行747冬 | 睢阳，布衣送友 | [[别董大二首]]、[[董庭兰]] | 后人系年，无诗题年款 |\n| 749—752前后 | 封丘尉，基层公务困境 | [[封丘作]] | 任内区间较稳，作诗单年本轮不锁定 |\n| 750说未定 | 羁旅除夕 | [[除夜作（高适）]] | 年谱推测的二手转述；地点官职随假说变化 |\n| 通行752秋 | 长安登塔 | [[同诸公登慈恩寺浮图（高适）]] | 同题与诗题可证活动，具体年属编年 |\n| 约752—753起 | 哥舒翰幕掌书记 | [[高适封丘任职与入哥舒翰幕府]] | 入幕单年存在编排差异 |\n| 755—756 | 佐守潼关，败后赴玄宗行在 | [[潼关失守与玄宗入蜀]] | 《旧唐书》记进谏、转官；不能与738诗前移混同 |\n| 756—757 | 淮南军政部署 | [[永王事件与高适李白分途]] | 参与部署不等于亲自擒永王 |\n| 乱后至761前后 | 彭、蜀两州刺史等 | [[人日寄杜二拾遗]] | 地方任职顺序：史传与现代编年有差别；原赠通行761，追酬序有约数不合 |\n| 762起 | 剑南西川节度使 | [[徐知道之乱与杜甫流寓梓阆]] | 需区分地方动乱与全国叛乱 |\n| 764—765 | 入朝，刑部侍郎、散骑常侍等，卒 | [[追酬故高蜀州人日见寄]] | 常侍称号不能前移到布衣时期 |\n\n## 史传的阅读边界\n\n《旧唐书》称高适“五十”后始留意诗什，与738年诗序及早年诗作难以直接协调，不能照抄成“五十岁之前从未作诗”。彭州、蜀州迁任顺序在《旧唐书》及后世系年之间也需互校。《旧唐书》还将高适代崔光远的叙事接在段子璋乱后，现代通行编年则区分761年严武接任与762年高适接任，任命顺序不能仅据该段一气串下。此表有意不把未完成的年谱考证说成已定结论。\n\n进一步校注书目可检索刘开扬《高适诗集编年笺注》、孙钦善《高适集校注》；本轮未声称阅读其全文。\n\n## 来源与核查\n\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [高适生年异说索引（用于发现文献）](https://zh.wikipedia.org/wiki/高適)\n- [诗序与官称](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [杜甫追酬序](https://zh.wikisource.org/wiki/歲時雜詠_(四庫全書本)/卷05)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "杨国忠": "\n# 杨国忠\n\n玄宗朝天宝后期宰相，处于财政、任官、宫廷与边镇政治网络中。史传保存其上升、政务和与安禄山的冲突，也带有明确贬评。\n\n## 皇帝与事件\n\n[[唐玄宗李隆基]]是其君主；[[安禄山]]叛乱以讨杨国忠为名义之一，这并不说明叛乱只因个人冲突。756年玄宗入蜀途中，杨国忠在马嵬被杀，见[[潼关失守与玄宗入蜀]]。\n\n## 诗人背景\n\n[[天宝开边与兵车行系年]]连接扩边、征役和杜甫作品；具体诗作是否针对某项决策，需逐篇讨论。[[李白翰林供奉与赐金放还]]是更早的朝廷经历，不应把后来的任相时段前移来解释离京全部原因。\n\n关联：[[唐代三朝·继承与时代时间线]]。\n\n## 来源\n\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷106](https://zh.wikisource.org/wiki/舊唐書/卷106)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "逢入京使": "\n\n## 完整原文\n\n故园东望路漫漫，双袖龙钟泪不干。\n马上相逢无纸笔，凭君传语报平安。\n\n## 网页补充说明\n\n本段为地图网页补充的完整古诗，采用通行正文、简体字与现代标点；作品异文与创作背景请结合下方原笔记。\n\n[原文与异文来源](https://zh.wikisource.org/wiki/全唐詩/卷201)\n\n## 原笔记与创作背景\n# 逢入京使\n\n岑参的七言绝句，常放在西行出塞背景中理解，具体作年要依编年研究，不能由诗题独立确定。\n\n> 故园东望路漫漫，双袖龙钟泪不干。\n> 马上相逢无纸笔，凭君传语报平安。\n\n## 阅读线索（整理者解读）\n\n诗从遥远的家转到路上偶遇。没有纸笔的限制，让“报平安”成为最简短、也最急切的要求。“龙钟”在这里指流泪沾湿的样子，不能按现代常用义误解为老态。\n\n## 与人生的联系\n\n[[岑参第一次出塞]]说明远行的职业背景；[[岑参的行旅地点]]说明空间距离。乡愁与求取功业可以在同一个人身上并存。\n\n## 未知对象\n\n入京使者的完整身份、本次传话是否实际送达，诗中没有提供。不要把诗中的“君”补为某位已有名字的朋友。\n\n关联：[[岑参·人生故事]]、[[白雪歌送武判官归京]]。\n\n## 来源与核查\n\n- [《全唐诗》卷201](https://zh.wikisource.org/wiki/全唐詩/卷201)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "董庭兰": "\n# 董庭兰\n\n又见“董廷兰”，唐代琴师，生卒不详。本专题用董庭兰为主名；《旧唐书》房琯传作董廷兰。高适[[别董大二首]]的“董大”通常指他，不能因为只有排行就自行添加可靠度更高的身份证明。\n\n## 与高适、房琯的两条时间线\n\n通行将高适送别系747年冬，说明诗人和音乐家在声名与生计之间的处境。757年前后，[[房琯]]身边的董廷兰又被史传记为恃宠、招纳货贿，牵涉政治风波。两件事相隔多年，不能把后者写成前者的直接原因。\n\n## 如何理解证据\n\n董大、董庭兰的对应属于通行注释；房琯传是另一种政治叙述，不能从一首赠诗推定高适赞同董庭兰后来全部行为。相关：[[杜甫谏救房琯与华州任职]]、[[高适]]。\n\n## 来源与核查\n\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《别董大》](https://zh.wikisource.org/wiki/別董大)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "杜甫·年表与争议": "\t\n# 杜甫·年表与争议\n\n通常采用712—770年作为生卒坐标；每首作品页另列作年证据与未定之处，不能把通行系年等同作者亲笔年款。\n\n| 时间 | 地点、官职与生活 | 完整作品／事件 | 确定程度与说明 |\n|---|---|---|---|\n| 730年代，约736 | 未仕，齐赵壮游 | [[望岳（岱宗夫如何）]] | 年份后人系定，末联写将来登顶愿望 |\n| 744—745前后 | 洛阳、梁宋、齐鲁交游 | [[梁宋交游与李杜高同游]] | 不将每处都写为李杜高三人同行 |\n| 746—747前后 | 渭北／长安求仕 | [[春日忆李白]] | 常见746、747系年，地点不锁定 |\n| 746—755 | 困居长安，求仕献赋，后授右卫率府胄曹参军 | [[兵车行]]、[[同诸公登慈恩寺塔（杜甫）]] | 兵车行751、752异说；登塔通行752 |\n| 756秋 | 被俘后困居长安，妻儿在鄜州 | [[月夜（杜甫）]] | 非拾遗任内出差 |\n| 757春 | 长安困居后脱身赴凤翔 | [[春望]] | 作诗时尚未受左拾遗 |\n| 757—758 | 左拾遗，谏救房琯，后外任华州司功参军 | [[杜甫谏救房琯与华州任职]]、[[寄左省杜拾遗]] | 两《唐书》“右拾遗”须与元稹墓铭互校 |\n| 759春 | 洛阳回华州途程 | [[邺城之败与三吏三别]] | 六首的叙事不可等同逐日逐字实录 |\n| 759秋冬 | 离华州，经秦州、同谷至成都 | [[杜甫成都草堂与严武幕府]] | 通行弃官说，离职性质仍有研究讨论 |\n| 760春 | 营建草堂，未入严武幕 | [[蜀相]] | 作品通行系年 |\n| 761春、秋 | 成都草堂，无现任实职 | [[春夜喜雨]]、[[茅屋为秋风所破歌]] | 后者原诗仅明记八月；不是工部员外郎任内 |\n| 762—763 | 送严武后流寓梓州、阆州 | [[徐知道之乱与杜甫流寓梓阆]]、[[闻官军收河南河北]] | 闻捷通行763春、梓州 |\n| 764—765 | 返成都；节度参谋、检校工部员外郎；后离幕 | [[严武]]、[[杜甫成都草堂与严武幕府]] | 严武两次镇蜀应分开 |\n| 765 | 离成都舟行东下 | [[旅夜书怀]] | 通行765；准确泊舟地点未定 |\n| 766—767 | 夔州客居，多病 | [[秋兴八首]]、[[登高（杜甫）]] | 通行分别766、767；登高是否重阳非题明记 |\n| 768 | 出峡，经江陵等到岳阳 | [[登岳阳楼]] | 通行冬季系年 |\n| 770正月二十一 | 湖南舟居，翻检旧诗 | [[追酬故高蜀州人日见寄]] | 序明记日期；追述高适原赠的约数另辨 |\n| 770 | 湖湘间卒，终年通常计59（虚岁） | [[杜甫出蜀与夔州江湘漂泊]] | 《旧唐书》卒年和死因叙述不能照单全收 |\n\n## 使用方法\n\n“杜拾遗”“杜工部”可成为沿用称呼，不能用诗题官称直接给所有作品定年。“春”“秋”“八月”属于诗内季节线索，仍须和行旅、官职及事件相互校验。[[追酬故高蜀州人日见寄]]序中的约数与高适通行年表不完全一致，本专题保留冲突。\n\n进一步可查仇兆鳌《杜诗详注》、萧涤非主编《杜甫全集校注》；本轮未逐页阅读现代全集或古籍影印本。\n\n## 来源与核查\n\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [原文集入口](https://zh.wikisource.org/wiki/全唐詩)\n- [追酬序](https://zh.wikisource.org/wiki/歲時雜詠_(四庫全書本)/卷05)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n校勘依据：[元稹《唐故工部员外郎杜君墓系铭》](https://zh.wikisource.org/wiki/唐故工部員外郎杜君墓系銘)，明确记“拜左拾遗”。\n", "垂老别": "\n# 垂老别\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n四郊未宁静，垂老不得安。\n子孙阵亡尽，焉用身独完！\n投杖出门去，同行为辛酸。\n幸有牙齿存，所悲骨髓干。\n男儿既介胄，长揖别上官。\n老妻卧路啼，岁暮衣裳单。\n孰知是死别，且复伤其寒。\n此去必不归，还闻劝加餐。\n土门壁甚坚，杏园度亦难。\n势异邺城下，纵死时犹宽。\n人生有离合，岂择衰盛端！\n忆昔少壮日，迟回竟长叹。\n万国尽征戍，烽火被冈峦。\n积尸草木腥，流血川原丹。\n何乡为乐土？安敢尚盘桓！\n弃绝蓬室居，塌然摧肺肝。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系759年（乾元二年）春，洛阳返回华州途中及相关创作；诗中细节的完成时间不能逐首精确到某日。 |\n| 地点 | 拟写乱中老者出征；土门、杏园是防线参照，不能直接当作者逐站行程。 |\n| 当时官职 | 华州司功参军，负责相关州务，不是现场主持抓丁的县吏。 |\n| 生活处境 | 朝廷任职受挫后在华州任官，往返河南与关中，目睹战争和征役压力。 |\n| 交游与写作对象 | 老者、老妻与同行者未具名。 |\n| 历史事件 | [[邺城之败与三吏三别]]；[[杜甫谏救房琯与华州任职]]。 |\n\n## 结合处境读诗（整理者解读）\n\n“投杖”与“骨髓干”把体力不胜和不得不从军并置。老妻明知可能死别仍劝加餐，是最日常的关爱面对最不可挽回的分离。对防线较坚的自我安慰，随即被“何乡为乐土”击穿。\n\n“岁暮”可从人的晚年理解，不能据此推翻组诗通常的春季系年。末尾身体崩摧的语言也提醒读者：出征的慷慨不是未经痛苦的豪情。\n\n## 版本与辨析\n\n三吏三别是后人并称，不是六篇逐日实录；诗中叙述与人物言语经过文学组织。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/垂老别)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "石壕吏": "\n# 石壕吏\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n暮投石壕村，有吏夜捉人。\n老翁逾墙走，老妇出门看。\n吏呼一何怒，妇啼一何苦。\n听妇前致词：三男邺城戍，\n一男附书至，二男新战死。\n存者且偷生，死者长已矣。\n室中更无人，惟有乳下孙。\n有孙母未去，出入无完裙。\n老妪力虽衰，请从吏夜归。\n急应河阳役，犹得备晨炊。\n夜久语声绝，如闻泣幽咽。\n天明登前途，独与老翁别。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系759年（乾元二年）春，洛阳返回华州途中及相关创作；诗中细节的完成时间不能逐首精确到某日。 |\n| 地点 | 石壕村，通行定位于陕州附近、今河南三门峡一带。 |\n| 当时官职 | 华州司功参军，负责相关州务，不是现场主持抓丁的县吏。 |\n| 生活处境 | 朝廷任职受挫后在华州任官，往返河南与关中，目睹战争和征役压力。 |\n| 交游与写作对象 | 村吏、老翁、老妇、儿媳与乳孙均未具名。 |\n| 历史事件 | [[邺城之败与三吏三别]]；[[杜甫谏救房琯与华州任职]]。 |\n\n## 结合处境读诗（整理者解读）\n\n“夜捉人”把征役写为侵入家庭的强制行动。老妇的话逐层交代男丁死亡、乳孙和无完裙的儿媳，读者看到一家已经付出惨重代价。“请从”出现在吏怒、老翁逃走之后，不能当作不受压力的自愿报名。\n\n杜甫不详写吏的每次发问，而让老妇答话暴露被逼迫的过程。“独与老翁别”以一个“独”留下被带走者的空缺；结尾没有老妇最终死亡或刑罚的记载，不追加悲惨结局。\n\n## 版本与辨析\n\n三吏三别是后人并称，不是六篇逐日实录；诗中叙述与人物言语经过文学组织。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/石壕吏)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "岑参第二次出塞": "\n# 岑参第二次出塞\n\n## 事件概要\n\n754年前后，岑参入[[封常清]]幕，以判官等职在安西、北庭军政环境中工作。这一阶段与许多著名边塞诗相联系，至安史之乱期间其人生走向改变。\n\n## 可串联的作品与人物\n\n[[走马川行奉送封大夫出师西征]]连接主帅与出征主题；[[白雪歌送武判官归京]]连接[[武判官]]与送别主题。两类作品分别偏重行动张力和离别情境。\n\n## 工作与生活\n\n判官属于军幕行政体系，不能据职位认定诗人长期直接带兵作战。诗中的风雪、军帐和行旅可作为经验线索，具体战事和诗作年份仍需逐篇考订。\n\n## 后续\n\n[[安史之乱与岑参东归]]改变中枢与边地的联系。地方定位见[[岑参的行旅地点]]，不要把诗中轮台简单对应为今天的同名县。\n\n## 来源与核查\n\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《走马川行》原文](https://zh.wikisource.org/wiki/走馬川行奉送封大夫出師西征)\n- [《白雪歌》原文及异文](https://zh.wikisource.org/wiki/白雪歌送武判官歸京)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "新安吏": "\n# 新安吏\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n客行新安道，喧呼闻点兵。\n借问新安吏，县小更无丁。\n府帖昨夜下，次选中男行。\n中男绝短小，何以守王城？\n肥男有母送，瘦男独伶俜。\n白水暮东流，青山犹哭声。\n莫自使眼枯，收汝泪纵横。\n眼枯即见骨，天地终无情。\n我军取相州，日夕望其平。\n岂意贼难料，归军星散营。\n就粮近故垒，练卒依旧京。\n掘壕不到水，牧马役亦轻。\n况乃王师顺，抚养甚分明。\n送行勿泣血，仆射如父兄。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系759年（乾元二年）春，洛阳返回华州途中及相关创作；诗中细节的完成时间不能逐首精确到某日。 |\n| 地点 | 新安道，今河南新安一带。 |\n| 当时官职 | 华州司功参军，负责相关州务，不是现场主持抓丁的县吏。 |\n| 生活处境 | 朝廷任职受挫后在华州任官，往返河南与关中，目睹战争和征役压力。 |\n| 交游与写作对象 | 县吏、被点选的中男与送行家属；“仆射”通常联系[[郭子仪]]。 |\n| 历史事件 | [[邺城之败与三吏三别]]；[[杜甫谏救房琯与华州任职]]。 |\n\n## 结合处境读诗（整理者解读）\n\n由“更无丁”到选取短小中男，征役向原本不应承担同等负担的人群扩张。暮水、青山与哭声，使行政命令的后果落到家属身上。后半段又以王师正当性与将帅抚养来劝慰，形成同情人民与支持平叛之间的真实张力。\n\n不能把安慰句简单当为官府背书，也不宜反过来认定每句都是反讽。“中男”是唐代年龄与户籍分类，具体年龄规定随时段变化，不套用今天的未成年人法定界线。\n\n## 版本与辨析\n\n三吏三别是后人并称，不是六篇逐日实录；诗中叙述与人物言语经过文学组织。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/新安吏)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "贺知章归乡与李白追忆": "\n# 贺知章归乡与李白追忆\n\n## 奏请、送行与归乡\n\n[[贺知章]]晚年病后请为道士、还乡，通行系归乡于744年。《旧唐书》玄宗纪载天宝二年十二月奏请，三载初有群臣祖送；这是跨年过程，而非所有事项同在744某一天。\n\n归乡获朝廷礼遇，不是贬逐。[[回乡偶书二首]]把孩子不识、故旧变化与镜湖旧波并置，说明仕途荣光不能消除时间在人和乡里留下的距离。\n\n## 李白亡友追忆\n\n[[对酒忆贺监二首]]和序由[[李白]]回忆紫极宫相见、谪仙称许、金龟换酒，以及归乡后故宅荷花。其写作通行系746年前后，精确年月仍不作确定值。诗中的悼亡主体与诗序的本人回忆比后代饮酒传奇更直接，但诗序也不承担现代逐字实录的功能。\n\n这条线可接入[[春日忆李白]]与[[追酬故高蜀州人日见寄]]：同是诗友记忆，有生前离别、亡后追怀不同时间层次。\n\n## 来源与核查\n\n- [《新唐书》贺知章传](https://zh.wikisource.org/wiki/新唐書/卷196)\n- [《旧唐书》玄宗纪](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [李白追忆诗](https://zh.wikisource.org/wiki/對酒憶賀監_(狂客歸四明))\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "郭子仪": "\n# 郭子仪\n\n唐代将领（697—781），参与收复两京与平定安史之乱，后来仍在边防和中央军政中发挥作用。本页只整理与杜诗的相关部分。\n\n## 在三吏三别中的位置\n\n[[新安吏]]末句“仆射如父兄”通常联系郭子仪：在批评征役伤害之后，又寄望将帅善待士卒。759年相州围城失败涉及多个节度使及统一指挥缺失，不能把全部责任简单归于郭子仪一个人。\n\n## 读诗的作用\n\n这条关系能解释杜甫为什么既痛惜百姓，又支持王师平叛；不能把一句安慰等同于对所有军事措施的认可。\n\n关联：[[邺城之败与三吏三别]]、[[安史之乱平定与杜甫闻捷]]、[[杜甫]]。\n\n## 来源与核查\n\n- [《旧唐书》卷120·郭子仪](https://zh.wikisource.org/wiki/舊唐書/卷120)\n- [《新安吏》](https://zh.wikisource.org/wiki/新安吏)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 李白交游故事的证据边界\n\n《新唐书》李白传载李白先救郭子仪、郭后解官以赎李的报恩故事，具体年代与仕历仍需互校。本轮在[[李白事迹中的史料与传说]]标注其争议，不把它当作已经补齐的真实求救闭环。\n\n史传入口：[《新唐书》卷202李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)。\n", "长安陷落与杜甫困居": "\n# 长安陷落与杜甫困居\n\n## 756—757年的处境\n\n叛军攻入长安后，杜甫将妻儿安置鄜州，赴肃宗行在途中被俘，陷于长安。诗作提供困居和思家的直接证据；其拘押方式、每次出行是否自由不能用现代监狱想象补齐。\n\n## 从两首诗读时间与空间\n\n[[月夜（杜甫）]]通常系756年秋，从长安遥想鄜州妻儿。[[春望]]通常系757年春，写城市破败与家书难通。两诗均在赴凤翔受左拾遗之命以前，不能用后来的谏官身份解释创作场景。\n\n## 脱身以后的政治处境\n\n757年春脱身赴凤翔，受左拾遗，随后因[[房琯]]问题进谏受问，见[[杜甫谏救房琯与华州任职]]。凤翔行在、沦陷长安与鄜州家庭，是不同地点与功能。\n\n关联：[[杨氏（杜甫妻）]]、[[潼关失守与玄宗入蜀]]、[[安史之乱与岑参东归]]。\n\n## 来源与核查\n\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [《月夜》](https://zh.wikisource.org/wiki/月夜_(杜甫))\n- [《春望》](https://zh.wikisource.org/wiki/春望)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "薛据": "\n# 薛据\n\n盛唐诗人。《唐才子传》称其荆南人，记载其仕宦、山林生活与诗文风格。该书为后世编纂，具体科举年份须配合校注使用，本页不据此排完整年谱。\n\n## 与岑参的直接联系\n\n岑参登慈恩寺浮图的诗题列有[[高适]]和薛据，因而他在本专题中是有作品证据的同游者。详见[[慈恩寺登塔唱和]]。\n\n## 如何认识他\n\n现有传记强调其性格与诗文的气魄，以及对仕途迟达的感受。这是传记作者的概括，不能不加区分地当心理事实。可从《唐才子传》本传进一步查其存诗。\n\n关联：[[岑参·人物事件关系图]]、[[岑参·史料来源与阅读方法]]。\n\n## 来源与核查\n\n- [《唐才子传》卷2·薛据](https://zh.wikisource.org/wiki/唐才子傳/卷2)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n", "岑参·史料来源与阅读方法": "\n# 岑参·史料来源与阅读方法\n\n## 三层材料\n\n1. **诗歌与唐代集序**：作品证明题目、表达与交游线索；杜确序是重要生平材料，但含褒扬性语言，也不是完整年谱。\n2. **后世史传**：《旧唐书》用来理解主帅与友人的经历；元代《唐才子传》保留诗人传记，但有年代、官职或人名需要校勘的地方。\n3. **现代整理**：香港教育局教学材料帮助入门，搜韵所引辞典便于发现编年异说。二者均不能替代全部学术校注。\n\n## 读诗时的四个问题\n\n- 诗题中的人是谁？姓名未知就保留未知。\n- 写的是实际事件、典故，还是作者预想？出征诗的胜利期待不能直接当战报。\n- 年份由原文标明，还是后人系年？\n- 诗中“汉”“匈奴”“楼兰”等历史语汇是否借指当时边地？不能把典故名称逐一对应到现实民族。\n\n## 本轮核查范围\n\n已阅读线上古籍与诗歌选段，建立专题知识网络；没有逐页校勘古籍影印本，也未取得所有现代年谱论文全文。[[岑参·年表与争议]]记录未定事项。\n\n进一步可查陈铁民、侯忠义《岑参集校注》与刘开扬《岑参诗集编年笺注》；书名来自辞典索引，本轮未声称读过其全文。\n\n## 避免误读\n\n不把[[岑参第一次出塞]]等同于参加怛罗斯战役；不把[[武判官]]补成未经证实的全名；不把[[高适]]与岑参并称“高岑”理解为所有行旅都相同；不据后出传记的一句话编造临终场景。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《唐才子传》卷3·岑参](https://zh.wikisource.org/wiki/唐才子傳/卷3)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n- [《全唐诗》卷201](https://zh.wikisource.org/wiki/全唐詩/卷201)\n- [《旧唐书》卷104·高仙芝、封常清](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [《旧唐书》卷111·高适](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《旧唐书》卷190下·杜甫](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《旧唐书》卷108·杜鸿渐](https://zh.wikisource.org/wiki/舊唐書/卷108)\n- [《旧唐书》卷70·岑文本](https://zh.wikisource.org/wiki/舊唐書/卷70)\n- [《唐才子传》卷2·薛据](https://zh.wikisource.org/wiki/唐才子傳/卷2)\n- [《白雪歌》原文及异文](https://zh.wikisource.org/wiki/白雪歌送武判官歸京)\n- [《走马川行》原文](https://zh.wikisource.org/wiki/走馬川行奉送封大夫出師西征)\n- [《寄左省杜拾遗》原文](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n\n\n## 高适、杜甫扩展核查说明（2026-10-01）\n\n新增作品以公开古籍录文为正文核对入口，结合《旧唐书》《新唐书》及编年材料分层解释。作品页全部标出当时官职、地点、生活处境、交游、事件，未能确定的地点与作年明确保留未知。总目录：[[高适与杜甫·作品与时代知识地图]]。\n\n- 完整组诗不以名句替代：《别董大》二首、“三吏三别”六篇、《秋兴》八首；杜甫追酬高适的作品保留序。\n- 《旧唐书》杜甫传的拾遗官职、严武荐官时间和卒年存在错乱，不能因是正史就不再校验。高适“五十后始学诗”亦与早年诗作难以直接协调。\n- 作年争议汇总于[[高适·年表与争议]]、[[杜甫·年表与争议]]；《除夜作》不锁定地点，《兵车行》保留751／752说，高适原赠人日诗与杜甫追酬序约数的冲突不抹平。\n- 《燕歌行》本事参考黄清发2026年论文摘要，只声称读过摘要及检索可见材料，不声称完成墓志和全文校勘。现代校注书列作进一步阅读，未声称逐页阅读其全文。\n- 诗中的未具名村民不杜撰姓名；典故古人可以建知识节点，但关系注明“追怀”，不冒充现实友人。作品悬想的妻子视角不当作实际观察。\n\n可复核的古籍和研究入口：\n\n- [高适《全唐诗》卷213](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [《高常侍集》四部丛刊本卷八](https://zh.wikisource.org/wiki/高常侍集_(四部叢刊本)/卷第八)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [《旧唐书》卷117·严武](https://zh.wikisource.org/wiki/舊唐書/卷117)\n- [《文献》2026年第1期：黄清发论文摘要](https://www.nlc.cn/pcab/zx/xw/20260119_2650720.shtml)\n\n本轮未逐页校勘古籍影印本。线上录文的异体字、缺字和异文，按每篇“版本与辨析”提示回查。\n\n\n## 李白、孟浩然事迹的核查补充\n\n[[李白事迹中的史料与传说]]说明金龟换酒、高力士脱靴、郭子仪报恩、铁杵磨针、捞月故事的不同材料层级。[[孟浩然长安求仕与荆州幕府]]把史传所载御前故事和应举、辟署事实分开。\n\n史传卷号：李白、王维见《新唐书》卷202；孟浩然、王昌龄见卷203；贺知章见卷196；张九龄见卷126。诗序可以证明作者如何回忆，不一定证明后代笔记补写的全部对话；不同编年不能靠重复引用同一逸事互相印证。\n\n本轮古诗采用通行文本，注明重要异文，并校对《全唐诗》等录文：例如[[赠孟浩然]]末句为“挹清芬”；凝碧池诗按卷128采用“百僚何日更朝天”。\n", "房琯": "\n# 房琯\n\n唐代宰相（697—763，通行纪年），在玄宗、肃宗两朝的政局转换中有重要位置，与[[杜甫]]有交谊。\n\n## 败军、罢相与杜甫谏救\n\n756年陈陶斜（诗题与地名也见陈陶等写法）兵败，757年罢相；史传并涉及门客[[董庭兰]]的货贿与房琯用人问题。杜甫上疏认为房琯有才，不宜仅因一次挫败弃置，触怒肃宗，经救解免罪。应区别军事失败、门客问题与派系政治，不能都缩成“好人被奸臣陷害”。\n\n## 解释边界\n\n杜甫替友人进言，既是谏官职责，也可能包含个人判断；他不是对所有军政错误毫无异议。757年受问与758年外任华州也不是同一天即时处分，见[[杜甫谏救房琯与华州任职]]。\n\n关联：[[唐代幕府与谏官]]、[[杜甫·年表与争议]]、[[同诸公登慈恩寺塔（杜甫）]]。\n\n## 来源与核查\n\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "旅夜书怀": "\n# 旅夜书怀\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n细草微风岸，危樯独夜舟。\n星垂平野阔，月涌大江流。\n名岂文章著，官应老病休。\n飘飘何所似，天地一沙鸥。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系765年（永泰元年）出蜀舟行；具体泊舟位置有不同定位，本页不定某一夜或港口。 |\n| 地点 | 岷江、长江东下行程，常联系渝州至忠州一带；准确地点未定。 |\n| 当时官职 | 已离严武幕，曾任节度参谋、检校工部员外郎；“官应”不能当作正式辞职原因的文书。 |\n| 生活处境 | 严武去世前后依靠减弱，携家再度漂泊。 |\n| 交游与写作对象 | 无具名赠答对象；与[[严武]]的离任、去世背景有关。 |\n| 历史事件 | [[杜甫出蜀与夔州江湘漂泊]]。 |\n\n## 结合处境读诗（整理者解读）\n\n细草与独舟很小，星空、平野和大江很大，空间反差使人的无依更显眼。“危樯”是高桅，不是指船必将遇险。\n\n“名岂文章著”常解为反语：不甘只以文章闻名，政治抱负却无从施展。“官应老病休”也可含自嘲、怨叹，不能硬译成作者认为停职唯一原因就是生病。末句沙鸥自比把社会失落化成漂泊形象；“独”是处境表达，并不证明妻儿未随舟。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/旅夜書懷)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [通行系年研究：王霞，保定学院学报2023年第1期](https://m.fx361.com/news/2023/0407/20626723.html)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "岑勋": "\n# 岑勋\n\n岑勋，唐代文士，生卒年不详，李白[[将进酒（李白）]]中的“岑夫子”通行指他，另有《酬岑勋见寻就元丹丘对酒相待以诗见招》等诗题支持交往。\n\n他与[[元丹丘]]共同构成李白宴饮诗中的真实诗友节点。不能因为姓岑便把他写成[[岑参·人生故事]]的主人公，也不凭同姓补出具体宗族关系。\n\n《将进酒》中的饮宴人数、座次、酒的产地、人物对话以及即兴成诗全过程，诗文并未逐项记载。影视场景不能直接转成他的生平事迹。\n\n## 来源与核查\n\n- [《将进酒》原文](https://zh.wikisource.org/wiki/將進酒_(李白))\n- [《全唐诗》酬岑勋诗](https://zh.wikisource.org/wiki/全唐詩/卷178)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "邺城之败与三吏三别": "\n# 邺城之败与三吏三别\n\n## 背景\n\n758—759年唐军围攻相州邺城，759年春战局崩溃，部队溃散，关中与河南防线再受威胁。多个节度使参与而指挥协调不足等问题，应由史传综合考察，不把战争结果归结为一句诗。\n\n## 六首完整作品\n\n- [[新安吏]]：中男被征，家属哭送，同时寄望王师善待。\n- [[潼关吏]]：修关备敌，追戒756年出关失败。\n- [[石壕吏]]：夜间征人，一家丧子后老妇仍被带走。\n- [[新婚别]]：婚姻尚未安稳就面临分离。\n- [[垂老别]]：子孙已亡，老者继续从军。\n- [[无家别]]：败兵归乡无家，又被征役。\n\n## 作者位置与文体\n\n通常系759年杜甫由洛阳返回华州前后，任华州司功参军。三吏保留行路见闻、问答与场景，三别更多采用人物独白；都经过文学选择与组织，不作为逐字访谈或家庭户籍。杜甫同情征役之苦，也支持平叛，不能用“纯反战”或“只宣传忠君”任一标签抹平张力。\n\n关联：[[郭子仪]]、[[杜甫谏救房琯与华州任职]]、[[天宝开边与兵车行系年]]。\n\n## 来源与核查\n\n- [《资治通鉴》卷221](https://zh.wikisource.org/wiki/資治通鑑/卷221)\n- [《新安吏》](https://zh.wikisource.org/wiki/新安吏)\n- [《石壕吏》](https://zh.wikisource.org/wiki/石壕吏)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "回乡偶书二首": "\n# 回乡偶书二首\n\n作者：[[贺知章]]。\n\n## 完整原文\n\n### 其一\n\n少小离家老大回，乡音无改鬓毛衰。\n儿童相见不相识，笑问客从何处来。\n\n### 其二\n\n离别家乡岁月多，近来人事半销磨。\n惟有门前镜湖水，春风不改旧时波。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 通行系744归乡，不能定到某一天 |\n| 地点 | 越州山阴、镜湖一带的故乡空间 |\n| 官职 | 太子宾客、秘书监等晚年身份，获准归乡为道士；非被贬 |\n| 生活处境 | 多年在朝后荣归，面对迟暮与人事变化 |\n| 交游 | 儿童、乡里故旧；不补当天与李白同在场 |\n| 历史事件 | [[贺知章归乡与李白追忆]] |\n\n## 结合处境解读\n\n第一首在笑问中写故乡对归人的陌生：乡音还在，容貌和地方记忆已变。第二首不再靠戏剧性相逢，而将故旧消磨与镜湖旧波对照。\n\n礼遇归乡和个人的衰老可以并存。“少小”“岁月多”属回望，不足把每一次离乡返乡精确排年。与[[对酒忆贺监二首]]合读，可见本人归乡与友人亡后追忆的不同视角。\n\n## 系年、异文与证据边界\n\n“无改／难改”“鬓／面”“销磨／消磨”“惟／唯”有版本字样。本页两首全录；归乡年采用通行744，不将天宝二年末奏请也写成744年同日。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/全唐詩/卷112)\n- [人物史传互校](https://zh.wikisource.org/wiki/新唐書/卷196)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "早发白帝城": "\n# 早发白帝城\n\n作者：[[李白]]。\n\n## 完整原文\n\n朝辞白帝彩云间，千里江陵一日还。\n两岸猿声啼不住，轻舟已过万重山。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 通行系759遇赦；亦有早年出蜀作说 |\n| 地点 | 白帝至江陵的东下航程 |\n| 官职 | 流放获赦后的布衣处境，通行解释 |\n| 生活处境 | 从受限制到获得归途希望 |\n| 交游 | 无明示同舟诗友，不补孟浩然参与 |\n| 历史事件 | [[李白流夜郎与遇赦东还]] |\n\n## 结合处境解读\n\n彩云、高城、猿声与轻舟形成迅速脱离重山的感受。若采用759系年，速度还可承载遇赦后的精神解脱；这一解释依赖编年，并非诗中直接写出“赦令”。\n\n“还”不是说江陵必为出生地。“千里”“一日”“万重”也不承担精确里程、航时与山峰数量记录。\n\n## 系年、异文与证据边界\n\n原题又作《下江陵》；“啼不住”另作“啼不尽”，本页用通行“住”。759说通行但非诗序自证；不把唐代夜郎径直等同整个古夜郎国或某一现代县。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/早發白帝城)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "唐玄宗李隆基": "\n# 唐玄宗李隆基\n\n## 身份与人生转折\n\n李隆基（685—762），唐玄宗，712—756年在位，主要年号有先天、开元、天宝。756年以后为上皇，活到762年，因此“玄宗仍在世”不等于“仍在位”。\n\n他由宗室政治中的参与者成为皇帝，开元时期整顿政务并形成繁荣的政治文化环境；后期中枢用人、边镇权力和军事扩张发生变化。不能把开元与天宝写成完全无矛盾的盛世，也不宜用单一宫廷爱情解释叛乱。\n\n## 政治人物\n\n[[张九龄]]与[[李林甫]]的不同政治位置，可由[[开元政局与文人求仕]]进入。[[杨国忠]]任相与[[安禄山]]叛乱处于天宝后期的政治网络；两者关系复杂，叛乱不能归结为一项私怨。\n\n## 与诗人的关系\n\n- [[李白]]：奉召文学供奉与离京，见[[李白翰林供奉与赐金放还]]；文学知遇不等于取得宰辅职权。\n- [[杜甫]]：长安求仕和低级官职，见[[兵车行]]及[[天宝开边与兵车行系年]]。诗中的征役批评不自动证明作者已获面谏机会。\n- [[高适]]、岑参：地方、军幕与边塞行旅，见[[高适封丘任职与入哥舒翰幕府]]、[[岑参第二次出塞]]。\n\n## 重大危机\n\n[[潼关失守与玄宗入蜀]]承接755年乱起与756年京师危机；[[灵武即位与两京收复]]解释[[唐肃宗李亨]]如何成为在位皇帝。玄宗对[[永王李璘]]的战时授权与肃宗后来整合权力相互交织。\n\n## 作品对读\n\n[[行路难三首（李白）]]呈现离京后的求用与退隐张力；[[燕歌行]]、[[兵车行]]呈现不同战争书写。作品作年和讽刺对象的争议保留在各页。\n\n## 来源\n\n- [《旧唐书》卷8](https://zh.wikisource.org/wiki/舊唐書/卷8)\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷106](https://zh.wikisource.org/wiki/舊唐書/卷106)\n- [《旧唐书》卷107](https://zh.wikisource.org/wiki/舊唐書/卷107)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "茅屋为秋风所破歌": "\n# 茅屋为秋风所破歌\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n八月秋高风怒号，卷我屋上三重茅。\n茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。\n南村群童欺我老无力，忍能对面为盗贼。\n公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。\n俄顷风定云墨色，秋天漠漠向昏黑。\n布衾多年冷似铁，娇儿恶卧踏里裂。\n床头屋漏无干处，雨脚如麻未断绝。\n自经丧乱少睡眠，长夜沾湿何由彻！\n安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山！\n呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系761年农历八月；原文只明记“八月”，年份属草堂编年。 |\n| 地点 | 成都浣花溪草堂。 |\n| 当时官职 | 无现任朝职，不能写成工部员外郎任内。 |\n| 生活处境 | 草屋破损，衣被陈旧，儿女同受风雨；避乱后安居仍脆弱。 |\n| 交游与写作对象 | 家属、邻村群童；具体姓名无证，不虚构冲突后续。 |\n| 历史事件 | [[杜甫成都草堂与严武幕府]]；“丧乱”联系安史之乱造成的长期身心创伤。 |\n\n## 结合处境读诗（整理者解读）\n\n屋顶、群童、破被、床头漏雨层层缩小空间，直到诗人连一处干燥栖身地都没有。“少睡眠”又把一夜雨苦接到多年战争，房屋损坏不是孤立的天气事件。\n\n结尾突然扩成“千万间”，不是跳过个人困境，而是从自身无法避雨推想到天下同样缺少庇护的人。群童被诗中说成“盗贼”，属于受损者当下的愤激表达，不据此给村中儿童建立犯罪人物档案。\n\n## 版本与辨析\n\n“渡江”古籍常写“度江”；“洒江郊”一作“满江郊”，“沉塘坳”亦有异文。本页用常见选本读法，并完整保留末段愿望与自我承担。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/茅屋為秋風所破歌)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "岑参的行旅地点": "\n# 岑参的行旅地点\n\n这是一份区域阅读索引，不是已经核定每一站的旅行路线。\n\n| 地点 | 阅读作用 | 关联 |\n|---|---|---|\n| 南阳、江陵 | 家世郡望与居地问题；不要混为唯一出生地 | [[岑文本]]、[[岑参·年表与争议]] |\n| 长安与终南山一带 | 求仕、草堂、诗友活动与朝廷生活 | [[慈恩寺登塔唱和]]、[[寄左省杜拾遗]] |\n| 河西、武威 | 中原通往西域的重要行旅空间 | [[岑参第一次出塞]] |\n| 安西 | 军政系统及西域活动背景，常涉及龟兹等地 | [[高仙芝]]、[[封常清]] |\n| 北庭 | 今新疆吉木萨尔一带的历史区域背景 | [[岑参第二次出塞]] |\n| 诗中的轮台 | 北庭诗歌中的地名，需要与汉代及现代同名地辨析 | [[白雪歌送武判官归京]] |\n| 嘉州 | 今四川乐山一带，“岑嘉州”称呼来源 | [[岑参入蜀与嘉州岁月]] |\n| 成都及蜀地 | 晚年幕府与寓居、卒地讨论 | [[杜鸿渐]] |\n\n## 使用方法\n\n先用区域关系理解远行，再查历史地理定位。古今同名不保证同址，诗中的“万里”也不宜直接换算成精确公里数。\n\n## 来源与核查\n\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n- [《全唐诗》卷201](https://zh.wikisource.org/wiki/全唐詩/卷201)\n", "张九龄": "\n# 张九龄\n\n张九龄（678—740，通行纪年），字子寿，韶州曲江人，唐玄宗朝宰相，也是诗人。不要与[[张守珪]]混同；二者一为朝廷宰相，一为东北军镇将帅。\n\n## 宰相与文士引荐\n\n733年前后入相，后与李林甫等的用人及政见分歧加深，736年罢知政事，737年因举荐周子谅获谴而贬荆州长史。他曾提拔[[王维]]为右拾遗，贬荆州后又辟[[孟浩然]]为从事，形成连接朝廷和诗人求仕的重要节点。\n\n[[望洞庭湖赠张丞相]]通行把受赠者理解为他，但也有赠张说及较早系年之说。不能先把“张丞相”固定为张九龄，再拿同一诗反过来证明交游年月。\n\n## 张守珪、安禄山与事后判断\n\n《新唐书》记张守珪将败军事的安禄山送京，张九龄主张依法处理，而玄宗未杀。这个事件可与[[开元东北边事与燕歌行]]相接，但不能由后来安史之乱反推出某个人已经预知全部历史，或把一次未杀说成叛乱唯一原因。\n\n作为幕主，他在737年后的职位是荆州长史，“张丞相”有可能是沿用旧尊称。与[[高适封丘任职与入哥舒翰幕府]]对读，可见地方幕府并不只有战场一种形态。\n\n## 来源与核查\n\n- [《新唐书》张九龄传](https://zh.wikisource.org/wiki/新唐書/卷126)\n- [《旧唐书》孟浩然传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "李白": "\n# 李白\n\n唐代诗人（701—762，通行纪年），字太白。此页以和[[高适]]、[[杜甫]]的交游及乱中分途为范围，不冒充完整李白年谱。\n\n## 梁宋交游\n\n744年前后李白与杜甫相识，高适参与梁宋一带的游历；具体三人同行到哪些地方、持续多久需要逐诗考订，不能把744—745年全部路线都写成三人共游。[[春日忆李白]]是离别后的直接怀念作品，末联所盼“细论文”说明诗歌交流的重要性。\n\n## 永王事件\n\n756—757年李白入永王李璘幕，高适则受肃宗命参与针对永王的军事部署。李白此后被治罪、流夜郎，遇赦；两人身处不同政治位置是史传所见，但高适有没有接获求救、为什么未救等不能只靠后世故事下定论。\n\n关联：[[梁宋交游与李杜高同游]]、[[永王事件与高适李白分途]]。\n\n## 来源与核查\n\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [《春日忆李白》](https://zh.wikisource.org/wiki/春日憶李白)\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 扩展：从蜀中成长到当涂晚年\n\n本轮在原有高适、杜甫交游范围外补充生平。总入口为[[李白孟浩然与盛唐诗友·知识地图]]，时间坐标见[[李白·年表与争议]]。\n\n[[李白出蜀漫游与安陆生活]]写家庭依托、求荐与山水漫游；[[李白翰林供奉与赐金放还]]写742—744通行朝廷经历；[[李白流夜郎与遇赦东还]]、[[李白当涂晚年与诗集编纂]]承接乱中与晚年。供奉翰林不等于已获经世宰辅职位，也不能从布衣漫游推成从无家庭和生活支持。\n\n新诗友与相关人：[[孟浩然]]、[[贺知章]]、[[王昌龄]]、[[元丹丘]]、[[岑勋]]、[[李阳冰]]。孟李交往见[[李白孟浩然交游与江汉送别]]，贺李交往见[[贺知章归乡与李白追忆]]。\n\n完整作品：[[蜀道难（李白）]]、[[将进酒（李白）]]、[[行路难三首（李白）]]、[[黄鹤楼送孟浩然之广陵]]、[[赠孟浩然]]、[[早发白帝城]]、[[对酒忆贺监二首]]、[[闻王昌龄左迁龙标遥有此寄]]。作品有争议的作年与异文均在各页单列。\n\n史料补正：本页原来源所列《新唐书》卷201并非李白传所在卷；李白、王维传在[卷202](https://zh.wikisource.org/zh-hant/新唐書/卷202)。原有链接保留在前，补入正确卷号供后续引用。其他逸事的材料层级见[[李白事迹中的史料与传说]]。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "潼关吏": "\n# 潼关吏\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n士卒何草草，筑城潼关道。\n大城铁不如，小城万丈余。\n借问潼关吏：修关还备胡？\n要我下马行，为我指山隅：\n连云列战格，飞鸟不能逾。\n胡来但自守，岂复忧西都。\n丈人视要处，窄狭容单车。\n艰难奋长戟，万古用一夫。\n哀哉桃林战，百万化为鱼。\n请嘱防关将，慎勿学哥舒！\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系759年（乾元二年）春，洛阳返回华州途中及相关创作；诗中细节的完成时间不能逐首精确到某日。 |\n| 地点 | 潼关，连接关中与河南的要冲。 |\n| 当时官职 | 华州司功参军，负责相关州务，不是现场主持抓丁的县吏。 |\n| 生活处境 | 朝廷任职受挫后在华州任官，往返河南与关中，目睹战争和征役压力。 |\n| 交游与写作对象 | 关吏与士卒；末句追论[[哥舒翰]]。 |\n| 历史事件 | [[邺城之败与三吏三别]]；[[杜甫谏救房琯与华州任职]]。 |\n\n## 结合处境读诗（整理者解读）\n\n前半篇由关吏展示地势与战格，说明防守依托险要有其合理性。杜甫并不反对保卫长安，却在结尾提醒不可重演756年仓促出关失败。地势与人事并读，才明白“慎勿学哥舒”是对守关战略的警告。\n\n“百万化为鱼”是悲剧性的夸张，不可作军队伤亡的统计。此诗回顾[[潼关失守与玄宗入蜀]]，连接高适当年的军幕经历；[[高仙芝]]、[[封常清]]先被处死，与哥舒翰后来失守是两个阶段。\n\n## 版本与辨析\n\n三吏三别是后人并称，不是六篇逐日实录；诗中叙述与人物言语经过文学组织。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/潼关吏)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "宿建德江": "\n# 宿建德江\n\n作者：[[孟浩然]]。\n\n## 完整原文\n\n移舟泊烟渚，日暮客愁新。\n野旷天低树，江清月近人。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 常系730年前后吴越漫游，精确年未确证 |\n| 地点 | 建德江，今浙江建德一带新安江水域 |\n| 官职 | 漫游者，无该诗对应实任官职证据 |\n| 生活处境 | 客船暮泊，旧愁在入夜时更新 |\n| 交游 | 没有点名同舟者 |\n| 历史事件 | 吴越行旅；不套用杜甫乱中江湘漂泊 |\n\n## 结合处境解读\n\n首联先交代泊舟与客愁，次联在旷野低天和清江近月之间变换距离。外部世界很辽阔，月在视觉上却近人，孤独与慰藉由景物关系产生。\n\n这份客愁不必只有落第一个原因。与[[旅夜书怀]]对读时，可比较行旅、天地尺度与孤身感，但两人的历史处境不同。\n\n## 系年、异文与证据边界\n\n“宿”即停宿。诗没有自记730；建德江与襄阳汉江、杜甫晚年洞庭水域不可混同。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/宿建德江)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "登岳阳楼": "\n# 登岳阳楼\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n昔闻洞庭水，今上岳阳楼。\n吴楚东南坼，乾坤日夜浮。\n亲朋无一字，老病有孤舟。\n戎马关山北，凭轩涕泗流。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系768年冬（大历三年），出峡后抵岳阳。 |\n| 地点 | 岳阳楼与洞庭湖。 |\n| 当时官职 | 无现任实职。 |\n| 生活处境 | 老病舟居，与亲友通信断绝；不能把“无一字”解释为所有亲友都已死亡。 |\n| 交游与写作对象 | 未具名的亲朋，联系晚年旧友凋零。 |\n| 历史事件 | [[杜甫出蜀与夔州江湘漂泊]]；“关山北”仍有军情，不限于已结束的安史之乱。 |\n\n## 结合处境读诗（整理者解读）\n\n“昔闻”与“今上”以迟来的到达开启全诗，洞庭的广大一度吞吐天地。第三联忽然退回孤舟与断信，把壮阔景色中的具体困境呈现出来。\n\n末联又从自己的孤立转向北方战事，说明私人的悲哀与国事并不分离。诗没有给出某一天北方哪场战斗的细节，背景可联系乱后边患，但不虚构精确战报。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/登岳陽樓_(杜甫))\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "安史之乱平定与杜甫闻捷": "\n# 安史之乱平定与杜甫闻捷\n\n## 763年的消息\n\n史朝义败亡，叛乱的主要军事进程通常以763年为结束坐标。唐朝此前已经收复两京，但叛乱、藩镇势力与边防问题并未因此同步消失。\n\n## 为什么触发《闻官军收河南河北》\n\n杜甫寄居梓州，在长期离乡和地方兵乱中盼望恢复归路。[[闻官军收河南河北]]的“初闻”“即从”“便下”是从消息走向想象旅程的情绪结构，不是实际已回洛阳的证据。\n\n## 和后期诗互读\n\n[[秋兴八首]]、[[登高（杜甫）]]、[[登岳阳楼]]写于平叛以后，仍有政治与漂泊之忧。这并不与763年喜悦矛盾，战争主进程结束和个人重建生活是两个层次。\n\n关联：[[郭子仪]]、[[徐知道之乱与杜甫流寓梓阆]]、[[安史之乱与岑参东归]]。\n\n## 来源与核查\n\n- [《资治通鉴》卷222](https://zh.wikisource.org/wiki/資治通鑑/卷222)\n- [《闻官军收河南河北》](https://zh.wikisource.org/wiki/聞官軍收河南河北)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "闻王昌龄左迁龙标遥有此寄": "\n# 闻王昌龄左迁龙标遥有此寄\n\n作者：[[李白]]。\n\n## 完整原文\n\n杨花落尽子规啼，闻道龙标过五溪。\n我寄愁心与明月，随君直到夜郎西。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 有748、749、753等系年，未定 |\n| 地点 | 李白所在位置未据诗确证；龙标、五溪是友人远谪方向 |\n| 官职 | 李白已离翰林的漫游阶段，通行解释；王昌龄贬龙标尉 |\n| 生活处境 | 听闻诗友贬谪，无法亲送而寄托关怀 |\n| 交游 | [[王昌龄]] |\n| 历史事件 | 贬谪与诗友通信，不是李白本人流夜郎 |\n\n## 结合处境解读\n\n“闻道”“遥有此寄”说明这是距离中的关怀，杨花、子规又使季节与声音带上漂泊、思归意味。明月成为不能随行的朋友之替身。\n\n诗里的“夜郎”地名应在五溪、龙标语境辨认，不能当作李白758年判流夜郎的预告，更不能把两次人物行程合成一次。\n\n## 系年、异文与证据边界\n\n末句有“随君／随风”等异文。本页用通行“随君”。“左迁”是贬降，与杜甫任左拾遗的“左”意义不同；作年有异说。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/聞王昌齡左遷龍標遙有此寄)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n系年对读：[南通大学相关鉴赏采用749](https://sxss.ntu.edu.cn/2018/0301/c6266a165804/page.htm)、[现代校注整理列749与753说](https://www.gushiwen.cn/shiwenv_62280919c9c5.aspx)。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "望洞庭湖赠张丞相": "\n# 望洞庭湖赠张丞相\n\n作者：[[孟浩然]]。\n\n## 完整原文\n\n八月湖水平，涵虚混太清。\n气蒸云梦泽，波撼岳阳城。\n欲济无舟楫，端居耻圣明。\n坐观垂钓者，徒有羡鱼情。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 通行系733，赠张九龄；另有赠张说及较早系年等说 |\n| 地点 | 洞庭湖、岳阳意象；实际投赠地点须与编年区别 |\n| 官职 | 未获显达，向居相位者求引荐 |\n| 生活处境 | 以山水起兴，委婉表达参与公共事务的愿望 |\n| 交游 | [[张九龄]]为通行受赠对象，身份仍有争论 |\n| 历史事件 | 乱前干谒与荐举文化；非安史平定后的闻捷 |\n\n## 结合处境解读\n\n湖水的开阔、力量与“无舟楫”的无助形成对照：面对可渡的世界，诗人需要现实引荐。末联羡鱼典故让愿望既含蓄又清楚。\n\n这首诗直接提醒读者，孟浩然的山水并非只为逃避政治；山水也能承载求仕。与[[登岳阳楼]]对读，同是洞庭，杜甫768年的病老战乱与本诗的求荐处境不同。\n\n## 系年、异文与证据边界\n\n题又作《临洞庭》等。“波撼／波动”“坐观／徒怜”有异文。张说说与张九龄说会改变作年，不将733及张九龄两项当成诗内年款。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/望洞庭湖贈張丞相)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n争议对读：[《书屋》2020年第3期相关讨论](https://img.rednet.cn/attachment/2020/11-27/cc4111e2-1403-402b-b5f1-b2ac2ab49c8f.pdf)；本页不据单篇讨论裁定唯一受赠者。\n", "杜鸿渐": "\n# 杜鸿渐\n\n唐代官员，曾任宰相，安史之乱期间参与肃宗朝的军政组织，后来奉命处理蜀地局势。《旧唐书》本传提供其任职与四川事务的背景。\n\n## 与岑参的关系\n\n766年前后岑参入蜀，参与其幕府工作；集序记有杜鸿渐表授岑参幕职。晚年官职先后，详见[[岑参·年表与争议]]。\n\n## 事件背景\n\n蜀地并非天然安稳的避难地，地方军事冲突使中央任命、军队实力和官员去留交织在一起。[[岑参入蜀与嘉州岁月]]因此需要放入具体政治环境，而不只是描写山水。\n\n## 阅读注意\n\n史传对其军政处置与宗教取向带有鲜明评判，整理时区分所记行动与史家的性格判断。他与[[杜甫]]同姓，不据此推定近亲关系。\n\n关联：[[岑参·人生故事]]、[[唐代幕府与谏官]]。\n\n## 来源与核查\n\n- [《旧唐书》卷108·杜鸿渐](https://zh.wikisource.org/wiki/舊唐書/卷108)\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n", "李白出蜀漫游与安陆生活": "\n# 李白出蜀漫游与安陆生活\n\n## 由蜀地走向江汉\n\n[[李白]]主要在蜀中成长，约724或725年出蜀东游。沿江进入荆楚，不只是观景，还试图通过名士和地方官员推荐获得政治机会。727前后在安陆一带与许氏结婚，许家背景、居处和诗友关系成为其长期生活的依托；婚姻不能只写成旅游途中的浪漫插曲。\n\n## 干谒、隐居、求道可以同时存在\n\n李白的自荐文章和求荐行动说明，他的任侠、道教兴趣与政治抱负并不互斥。没有常规科举入仕记录，不等于厌弃全部公共事务。诗中的蔑视权贵，是文学姿态的一部分，也须与现实求荐行为对读。\n\n## 连接孟浩然\n\n襄阳、安陆、江夏共同构成江汉交游环境，[[孟浩然]]是比他年长的诗友。具体初识年争议见[[李白孟浩然交游与江汉送别]]。人物出生地点另有争论，本事件只采用蜀中成长这一相对稳妥的坐标，不把碎叶说写成无争议结论。\n\n## 来源与核查\n\n- [《新唐书》李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [李白《上安州裴长史书》](https://zh.wikisource.org/wiki/上安州裴長史書)\n- [年谱对读](https://ctext.org/wiki.pl?chapter=886336&if=gb)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "燕歌行": "\n# 燕歌行\n\n作者：[[高适]]。年表：[[高适·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n开元二十六年，客有从御史大夫张公出塞而还者，作《燕歌行》以示适，感征戍之事，因而和焉。\n\n汉家烟尘在东北，汉将辞家破残贼。\n男儿本自重横行，天子非常赐颜色。\n摐金伐鼓下榆关，旌旆逶迤碣石间。\n校尉羽书飞瀚海，单于猎火照狼山。\n山川萧条极边土，胡骑凭陵杂风雨。\n战士军前半死生，美人帐下犹歌舞。\n大漠穷秋塞草腓，孤城落日斗兵稀。\n身当恩遇恒轻敌，力尽关山未解围。\n铁衣远戍辛勤久，玉箸应啼别离后。\n少妇城南欲断肠，征人蓟北空回首。\n边庭飘飖那可度，绝域苍茫更何有。\n杀气三时作阵云，寒声一夜传刁斗。\n相看白刃血纷纷，死节从来岂顾勋。\n君不见沙场征战苦，至今犹忆李将军。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 738年（开元二十六年），诗序明记，作年依据较强；具体本事与讽刺对象有争议。 |\n| 地点 | 通行系于梁宋一带；诗序不能确定落笔城址。 |\n| 当时官职 | 尚未任封丘尉，更未进入哥舒翰幕府。 |\n| 生活处境 | 游食求仕阶段；知道东北边地情形，也由归客作品获得材料。 |\n| 交游与写作对象 | 序中“张公”通常指[[张守珪]]；和诗对象是未具名归客，不能认定为张守珪本人。 |\n| 历史事件 | [[开元东北边事与燕歌行]]；开元年间对奚、契丹的战争。 |\n\n## 结合处境读诗（整理者解读）\n\n全诗由出师的荣宠、鼓角和旌旗转向包围中的士卒。“美人帐下”与“半死生”放在同一时间，揭示将帅和士卒承受战争的差异；随后把镜头移到城南少妇，使军中失误同时成为家庭创伤。末句借汉代李广寄托善待士卒、共担风险的理想，不是在交代一位唐代友人。\n\n序文说“客”出塞归来，高适据其诗唱和，不能把全篇当作作者亲历某一战役的报告。它与[[走马川行奉送封大夫出师西征]]可以对读：前者着眼于军中苦乐与指挥失误，后者是出征送行场合的行动与期待。\n\n## 版本与辨析\n\n本页保留诗序。“御史大夫张公”一作“元戎”，“恒轻敌”一作“常轻敌”。张守珪隐瞒败绩说、指向其部将说不能混为定论；2026年研究摘要据墓志确认元戎为张守珪，并反对把本事简单限定为隐败冒功。本轮已读摘要，未完成论文及墓志全文校勘。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [生平核对：《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [黄清发《出土墓志与高适诗歌新考》摘要：《文献》2026年第1期](https://www.nlc.cn/pcab/zx/xw/20260119_2650720.shtml)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "史思明": "\n# 史思明\n\n安史之乱中的重要军事首领，原在安禄山军政网络中，战争中经历归附与再叛等变化。761年被其子杀死，叛乱直到763年才结束，个人死亡与整场战争结束是不同节点。\n\n## 主线与事件\n\n主要活动跨[[唐玄宗李隆基]]、[[唐肃宗李亨]]两朝，后续战争延至[[唐代宗李豫]]。与[[安禄山]]有军政关联，但两人并非一生所有行动都同步。\n\n[[邺城之败与三吏三别]]连接759年的战局与征役压力；[[安史之乱平定与杜甫闻捷]]连接最终平定。\n\n## 阅读边界\n\n本页为事件关联档案，未逐役重建史思明军程。[[新安吏]]、[[石壕吏]]等写战争中的人，不宜把每一处征役都直接视为史思明亲自下令。\n\n## 来源\n\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n- [《旧唐书》卷11](https://zh.wikisource.org/wiki/舊唐書/卷11)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "夜归鹿门山歌": "\n# 夜归鹿门山歌\n\n作者：[[孟浩然]]。\n\n## 完整原文\n\n山寺钟鸣昼已昏，渔梁渡头争渡喧。\n人随沙路向江村，余亦乘舟归鹿门。\n鹿门月照开烟树，忽到庞公栖隐处。\n岩扉松径长寂寥，惟有幽人自来去。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 未定，常联系返乡后的隐居生活 |\n| 地点 | 襄阳渔梁渡、鹿门山的归途与隐居空间 |\n| 官职 | 无据认定当时荆州幕职；不补辞职当天 |\n| 生活处境 | 在乡居、山居与外出之间选择生活 |\n| 交游 | 庞公通行解庞德公，是追慕前贤，非现实同游 |\n| 历史事件 | 襄阳隐逸传统，与[[孟浩然长安求仕与荆州幕府]]对读 |\n\n## 结合处境解读\n\n人群往江村，诗人归鹿门，方向分叉使生活选择成为可见的动作。钟声与争渡声没有使他否认人间，月照烟树、岩扉松径才逐渐形成幽居的秩序。\n\n“庞公栖隐处”借地方前贤传统表达志趣；不能把庞德公写成孟浩然的在世朋友，也不能把一次夜归推成他余生再无任何求荐。\n\n## 系年、异文与证据边界\n\n具体年份未定，“幽人”是诗中自我呈现。本页用“沙路”“余亦”“惟有”的通行录文；鹿门山和南园的居处不可笼统合并。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/夜歸鹿門山歌)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "孟浩然·年表与争议": "\n# 孟浩然·年表与争议\n\n| 年代 | 地点、身份与处境 | 作品／事件 | 不确定性 |\n|---|---|---|---|\n| 689—青年，通行 | 襄阳家园，山水生活与交游 | [[孟浩然]]、[[过故人庄]]、[[春晓（孟浩然）]] | 另有691生说；后两诗不因“隐居”就锁定青年作 |\n| 约728前后 | 游长安、应进士不第 | [[孟浩然长安求仕与荆州幕府]]、[[岁暮归南山]] | “年四十”与现代编年须区别；御前故事不足单独锁年 |\n| 开元年间 | 江汉送别、吴越漫游 | [[李白孟浩然交游与江汉送别]]、[[宿建德江]] | 李孟初识年、黄鹤楼送别年皆有异说；建德诗常系730但不确证 |\n| 733或其他系年 | 临洞庭、投赠张丞相 | [[望洞庭湖赠张丞相]] | 张九龄说通行，另有张说及较早系年说 |\n| 737前后以后 | 张九龄荆州幕府从事 | [[张九龄]]、[[孟浩然长安求仕与荆州幕府]] | 辟署有史传支持，任期与俸禄不补精确值 |\n| 740，通行 | 襄阳病卒 | [[王昌龄]] | 食鲜病发细节见晚出文献，不能追究为确定致死因果 |\n\n## 作品不等于连续日记\n\n[[夜归鹿门山歌]]可联系襄阳隐居传统，但具体作年未定。[[春晓（孟浩然）]]与[[过故人庄]]无法仅凭景物锁年。题中的南山、鹿门、建德、洞庭各有不同地理层次，不能归并成同一处“故乡山村”。\n\n他卒于安史之乱前十五年，不将战乱生存境况倒填进这些诗中。\n\n## 来源与核查\n\n- [《旧唐书》孟浩然传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》孟浩然传](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n- [中国大百科纪年](https://www.zgbk.com/ecph/words?Name=孟浩然&SiteID=1&SourceID=19129&Type=bkzyb&subSourceType=000003000005000001)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "岑参入蜀与嘉州岁月": "\n# 岑参入蜀与嘉州岁月\n\n## 时间与任职\n\n通行编年将入蜀系于766年前后，随后任嘉州刺史，常系767年前后。[[杜鸿渐]]幕府与嘉州任职的精确先后，需参考校注年谱；不同传记的叙次不能直接拼接成逐月履历。\n\n## 诗人的另一面\n\n“岑嘉州”的称呼来自地方官任职，不是姓名或自号。嘉州即今四川乐山一带。《登嘉州凌云寺作》等作品，可在《全唐诗》卷198查读，说明其诗歌并不限于边塞。\n\n## 蜀地与归路\n\n政治动荡、幕府去留、地方生活和东归愿望交织。杜确序记他卒于蜀，通行资料多写成都；卒年有769、770等考订。没有可靠细节就不写出具体临终场所与对白。\n\n## 后续\n\n[[岑嘉州集的编纂与流传]]让这一段生命经历成为可被后世阅读的作品。空间入口为[[岑参的行旅地点]]。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n- [《旧唐书》卷108·杜鸿渐](https://zh.wikisource.org/wiki/舊唐書/卷108)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "杨氏（杜甫妻）": "\n# 杨氏（杜甫妻）\n\n杜甫之妻，通称杨氏，本名不详。不要为了人物卡片完整而杜撰名字、出生年月或逐年经历。\n\n## 可从作品看到的处境\n\n[[月夜（杜甫）]]写756年杜甫困居长安时遥想鄜州妻儿。“香雾云鬟湿”是诗人的悬想，并非独立传记对她当夜行为的记录。[[闻官军收河南河北]]把家人的忧虑与希望收入政治消息带来的喜悦。\n\n## 从家庭理解诗史\n\n妻儿的迁徙、信息隔绝、破被和漏雨，使战乱不只属于将帅与帝王。[[茅屋为秋风所破歌]]中家属与诗人共同受冻，支持从家庭单位理解流离；无法证实的家务分工、对话及心理独白不补写。\n\n关联：[[杜甫]]、[[长安陷落与杜甫困居]]、[[杜甫成都草堂与严武幕府]]。\n\n## 来源与核查\n\n- [元稹杜甫墓铭，转录于《唐诗纪事》卷18](https://zh.wikisource.org/wiki/唐詩紀事_(四庫全書本)/卷18)\n- [《月夜》](https://zh.wikisource.org/wiki/月夜_(杜甫))\n- [《闻官军收河南河北》](https://zh.wikisource.org/wiki/聞官軍收河南河北)\n- [《茅屋为秋风所破歌》](https://zh.wikisource.org/wiki/茅屋為秋風所破歌)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "岑嘉州集的编纂与流传": "\n# 岑嘉州集的编纂与流传\n\n## 谁保存了作品\n\n[[杜确]]的序记岑参去世近三十年后，其子[[岑佐公]]提供遗文，杜确受托分类编次，成八卷。“近三十年”不宜未经考证就换算成一个精确编成年份。\n\n## 版本问题\n\n八卷是序中记载的整理规模；后世版本、选本与《全唐诗》的分卷不能视为同一回事。《全唐诗》收岑参作品于卷198—201，这不意味着原集仅四卷，也不意味着四卷编排就是写作先后。\n\n## 为什么重要\n\n今天看到的诗人形象经过家属保存、编者选择和版本流传。读[[岑参·人生故事]]时，应知道材料的来源链，而不是把现存作品当作无缺失的日记。\n\n## 下一步阅读\n\n从[[岑参·史料来源与阅读方法]]进入古籍与现代校注索引；从[[岑参·年表与争议]]检查编年差异。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n", "杜确": "\n# 杜确\n\n唐代《岑嘉州集序》的作者和岑参遗作的编次者。这里依据序中自述建立档案，不补写未经核实的生卒与仕历。\n\n## 所做的工作\n\n序称岑参去世已近三十年，其子提供遗文，杜确受托分类编次，成八卷。这使他成为[[岑嘉州集的编纂与流传]]的关键人物。\n\n## 与岑参的关系类型\n\n属于作品保存和家族文献传承关系，不能误连成[[岑参第二次出塞]]的军幕同僚。序中“通家”关系的表达，也不等于有明确证据证明杜确亲历岑参每项任职。\n\n## 如何使用他的序\n\n它保存科举、官职及文章评价，是[[岑参·人生故事]]的重要来源；同时有纪念与推尊目的，不把所有赞语当作中性事实。篇名可见《岑嘉州集序》及《岑嘉州诗集序》等称法。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n", "天宝开边与兵车行系年": "\n# 天宝开边与兵车行系年\n\n## 战争与征役\n\n天宝年间对吐蕃及南诏等方向的战争持续消耗人力。751年鲜于仲通征南诏失败及后续强征，是解释[[兵车行]]本事的重要背景之一；诗又写“北防河”“西营田”“青海头”，涵盖更长时间、更广地域的征戍代价。\n\n## 系年分歧\n\n常见751年与752年说。本页优先保留“天宝长安时期”的稳妥坐标，不用网页页头一个数字替代编年论证。具体解释是直接联系征南诏，还是主要强调对吐蕃长期用兵，也不完全一致。\n\n## 与安史之乱区分\n\n这首诗在乱前创作，[[杜甫]]尚未任左拾遗。它揭示的是盛世扩张的社会成本，不能笼统写成安史之乱时叛军抓兵。[[邺城之败与三吏三别]]则是759年前后平叛过程中的征役，支持平叛与痛惜民生的关系更复杂。\n\n关联：[[高适]]、[[燕歌行]]、[[杜甫·年表与争议]]。\n\n## 来源与核查\n\n- [《资治通鉴》卷216](https://zh.wikisource.org/wiki/資治通鑑/卷216)\n- [《兵车行》](https://zh.wikisource.org/wiki/兵車行)\n- [作年讨论论文的可检索段落](https://c.cnkgraph.com/eBooks/今著/杜甫研究学刊/2004/1/论杜甫新乐府诗的产生——以《兵车行》的探讨为中心.pdf)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "杜甫谏救房琯与华州任职": "\n# 杜甫谏救房琯与华州任职\n\n## 官职与事件先后\n\n757年杜甫脱身赴凤翔，受左拾遗。[[房琯]]罢相时，他上疏谏救，触怒肃宗，经张镐等救解免罪。758年外任华州司功参军。两件事有政治关联，但不宜写成上疏次日便被贬华州。\n\n## 与岑参的双链\n\n杜甫左拾遗、岑参右补阙属于规谏职位，[[寄左省杜拾遗]]可证朝廷交往。杜甫离中央后，诗歌的观察空间转为华州、洛阳及沿路乡村。\n\n## 华州一年与离职争议\n\n[[邺城之败与三吏三别]]约在759年春；同年秋杜甫离华州，经秦州、同谷，岁末到成都。通行说是弃官，也有对离职性质的不同研究；本页不用无来源的精确“辞职理由”替代讨论。\n\n## 史传互校\n\n两《唐书》杜甫传均作“右拾遗”，与元稹墓铭“拜左拾遗”及相关诗题互校，应为左拾遗。《旧唐书》的授官、陷贼、严武荐官与卒年叙述也有错乱，需结合诗文与编年辨析。引用它证明有这段传记，不等于每个字都已核实。\n\n关联：[[唐代幕府与谏官]]、[[杜甫·年表与争议]]、[[高适封丘任职与入哥舒翰幕府]]。\n\n## 来源与核查\n\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [离华州性质研究（本轮只核对检索摘要）](https://zzxk1979.cn/Uploads/PdfFile/2022-12-13/63986978a0df0.pdf)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n校勘依据：[元稹《唐故工部员外郎杜君墓系铭》](https://zh.wikisource.org/wiki/唐故工部員外郎杜君墓系銘)，明确记“拜左拾遗”。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "春日忆李白": "\n# 春日忆李白\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n白也诗无敌，飘然思不群。\n清新庾开府，俊逸鲍参军。\n渭北春天树，江东日暮云。\n何时一樽酒，重与细论文。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系746或747年春，编年有差别，本页不固定单一年。 |\n| 地点 | 杜甫所在渭北与想象中的李白江东形成空间对应；精确落笔地点未定。 |\n| 当时官职 | 未仕，渐入长安求仕阶段。 |\n| 生活处境 | 经历梁宋、齐鲁交游后，与李白分处两地。 |\n| 交游与写作对象 | 直接怀念[[李白]]；庾信、鲍照是诗风评价中的古人参照。 |\n| 历史事件 | [[梁宋交游与李杜高同游]]之后的离别。 |\n\n## 结合处境读诗（整理者解读）\n\n开头用文学批评建立相知：不是泛泛称赞，而是以庾信的清新、鲍照的俊逸说明李诗的特质。中间两句把诗友各自看到的树与云并置，景物承担了无法见面的距离。结尾想要重聚“细论文”，使友情落在共同写作和评诗的实践上。\n\n诗不能证明李白当时也正在望着同一片云，它写的是杜甫的遥想；这种交游证据比后人虚构三人如何逐日游猎更可靠。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [746／747系年的辞典转述（原校注未全文阅读）](https://zidian.openi.cn/shiwen/407453.html)\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/春日憶李白)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "永王事件与高适李白分途": "\n# 永王事件与高适李白分途\n\n## 事件坐标\n\n756年玄宗入蜀后命诸王分镇，肃宗继位又形成新的权力秩序。永王李璘东下江淮，756—757年间与肃宗中央发生冲突，兵败。具体政治意图与“叛”的定性应注意史书来自胜利一方。\n\n## 两位诗人的职位\n\n[[李白]]进入永王幕；[[高适]]受肃宗命，任淮南节度使等职，参与军事部署。《旧唐书》高适传称会师部署尚在推进而永王已败，不应渲染为高适亲自率军擒获永王。\n\n## 可确认与不能确认\n\n可以确认李白受事件牵连、被判流夜郎及遇赦，高适与其政治位置不同。不能凭后人友情叙事断言高适有意拒绝李白求救、亲自判罪，或杜甫当面调停。史书记录和推测动机应分栏。\n\n关联：[[梁宋交游与李杜高同游]]、[[高适·年表与争议]]。\n\n## 来源与核查\n\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 扩展阅读：获罪以后的李白\n\n[[李白流夜郎与遇赦东还]]补上拘系、通行758流夜郎、759遇赦与东还；[[早发白帝城]]保留遇赦系年与早年作说。[[李白当涂晚年与诗集编纂]]延伸至762病中托稿。\n\n史传郭子仪救李白报恩故事见[[李白事迹中的史料与传说]]，不据此补齐未确认的求救链。[[孟浩然]]在740年前后已卒，不能加入永王事件现场。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "岑参·人生故事与知识导航": "\n# 岑参·人生故事与知识导航\n\n岑参是一位把书生的抱负、远行的疲惫和塞外的奇景同时写进诗中的唐代诗人。这里以生平为主线，人物、事件、作品和地点分别建档。\n\n> 人物已确认：唐代诗人岑参，而非春秋时期的曾参。生卒年暂用约715—770年作为阅读坐标，异说见年表。\n\n## 从这里开始\n\n1. [[岑参·人生故事]]：按人生阶段连续阅读。\n2. [[岑参·年表与争议]]：核对时间，不把争议年代写死。\n3. [[岑参·人物事件关系图]]：查看每条联系的类型与依据。\n4. [[岑参·史料来源与阅读方法]]：区分史实、诗歌表达和整理者解读。\n\n## 相关人物\n\n- [[高仙芝]]、[[封常清]]：两次出塞时的幕府主帅。\n- [[高适]]、[[杜甫]]、[[薛据]]：交游与诗歌唱和。\n- [[岑文本]]：家世背景，非直接交游。\n- [[杜鸿渐]]：晚年入蜀的幕府关系。\n- [[武判官]]：《白雪歌》的送别对象，姓名未定。\n- [[岑佐公]]：保存父亲遗文并托人整理。\n- [[杜确]]：编次遗作的人，非出塞同僚。\n\n## 事件与作品\n\n- [[岑参进士及第与初授官]] → [[岑参第一次出塞]] → [[慈恩寺登塔唱和]] → [[岑参第二次出塞]]。\n- [[安史之乱与岑参东归]] → [[岑参入蜀与嘉州岁月]] → [[岑嘉州集的编纂与流传]]。\n- [[白雪歌送武判官归京]]、[[逢入京使]]、[[走马川行奉送封大夫出师西征]]、[[寄左省杜拾遗]]。\n- 背景入口：[[岑参的行旅地点]]、[[唐代幕府与谏官]]。\n\n这些条目构成一个以岑参为中心的专题网络；相关人物笔记有独立知识，但不无限扩展其所有亲友。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n\n\n## 扩展阅读：高适与杜甫\n\n[[高适与杜甫·作品与时代知识地图]]把本专题的诗友节点扩展为独立的作品与时代网络。先看[[高适·年表与争议]]、[[杜甫·年表与争议]]，再沿每篇作品的地点、官职、生活处境和历史事件阅读。\n\n对读入口：[[燕歌行]]与[[走马川行奉送封大夫出师西征]]；[[同诸公登慈恩寺浮图（高适）]]与[[同诸公登慈恩寺塔（杜甫）]]；[[寄左省杜拾遗]]与[[杜甫谏救房琯与华州任职]]；[[人日寄杜二拾遗]]与[[追酬故高蜀州人日见寄]]。\n\n扩展保留岑参原有主线。高杜各自的求仕、乱中分途和蜀地生活见新增独立条目，不能因为交游或同在蜀地而把三人的人生合为一条线。\n\n\n## 扩展阅读：李白、孟浩然与盛唐诗友\n\n[[李白孟浩然与盛唐诗友·知识地图]]保留岑参主线，向外补充[[李白]]、[[孟浩然]]、[[王维]]、[[贺知章]]、[[王昌龄]]的人生事迹和作品。\n\n李白路线：[[李白·年表与争议]]；孟浩然路线：[[孟浩然·年表与争议]]。求仕对读[[孟浩然长安求仕与荆州幕府]]与[[岑参进士及第与初授官]]；边地使行对读[[使至塞上]]、[[送元二使安西]]与岑参两次出塞。\n\n[[李白事迹中的史料与传说]]单列文学传奇的证据界限。《将进酒》的“岑夫子”通行指[[岑勋]]，不因同姓误认岑参。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "送元二使安西": "\n# 送元二使安西\n\n作者：[[王维]]。\n\n## 完整原文\n\n渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 未定；常置开元、天宝间，亦有乱后等说 |\n| 地点 | 渭城送行；阳关、安西是远行方向而非当场地点 |\n| 官职 | 当时官职随系年变化，不能一概写尚书右丞 |\n| 生活处境 | 京畿送友承担西行差遣 |\n| 交游 | 元二，排行二；完整身份未确证 |\n| 历史事件 | 西域使行，与[[岑参第一次出塞]]、[[武判官]]送别节点对读 |\n\n## 结合处境解读\n\n朝雨把客舍柳色洗新，新的春景反而与离别形成张力。“更尽”延缓告别，远方“无故人”是朋友对孤身处境的体贴，不必解释成当地真的没有任何人际往来。\n\n王维留在渭城送行，不能因此补写他与元二共赴安西。全诗也没有说元二被贬或死别。\n\n## 系年、异文与证据边界\n\n又称《渭城曲》，后有《阳关三叠》音乐接受。“客舍青青”有别本字样；本页用通行正文。具体年与元二姓名不填猜测。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/送元二使安西)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "李林甫": "\n# 李林甫\n\n玄宗朝宰相，长期处于中枢用人和政策网络之中。《旧唐书》本传对其结交、排斥异己有强烈批评，事实叙述与史家道德评价应分读。\n\n## 主线关系\n\n与[[唐玄宗李隆基]]为君臣关系，与[[张九龄]]在开元中枢用人上存在张力；[[开元政局与文人求仕]]提供背景。其后[[杨国忠]]成为天宝后期的重要宰相。\n\n## 连接诗人\n\n他构成杜甫等人的长安求仕政治背景，不代表与每位诗人都有可以证实的私人会面。文学中的“权门”“权佞”也不能未经考证全部指定为他。\n\n关联：[[兵车行]]、[[杜甫·年表与争议]]、[[唐代皇帝主线·史料与关系规则]]。\n\n## 来源\n\n- [《旧唐书》卷106](https://zh.wikisource.org/wiki/舊唐書/卷106)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "封丘作": "\n# 封丘作\n\n作者：[[高适]]。年表：[[高适·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n我本渔樵孟诸野，一生自是悠悠者。\n乍可狂歌草泽中，宁堪作吏风尘下。\n只言小邑无所为，公门百事皆有期。\n拜迎官长心欲碎，鞭挞黎庶令人悲。\n归来向家问妻子，举家尽笑今如此。\n生事应须南亩田，世情付与东流水。\n梦想旧山安在哉，为衔君命且迟回。\n乃知梅福徒为尔，转忆陶潜归去来。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 约749—752年封丘尉任内；常见系751年前后，本轮不固定单一年份。 |\n| 地点 | 封丘，今河南封丘一带；“孟诸”回指梁宋旧日生活。 |\n| 当时官职 | 封丘县尉，是州县属官，不是县令或节度使。 |\n| 生活处境 | 由长期布衣生活进入基层吏务，面对限期差事、长官礼仪和催迫百姓。 |\n| 交游与写作对象 | 无明确赠答对象；梅福、陶潜是古人典故。 |\n| 历史事件 | [[高适封丘任职与入哥舒翰幕府]]；[[唐代幕府与谏官]]。 |\n\n## 结合处境读诗（整理者解读）\n\n“百事皆有期”比笼统说不喜欢做官更具体：基层政务有期限、有上级监督，县尉既受官长约束，又可能以刑罚催迫百姓。“心欲碎”写对上受辱，“令人悲”写对下施压，两句构成他的伦理困境。\n\n结尾不是立即辞官的行政文书。“为衔君命且迟回”说明仍在官职责任与归隐愿望之间犹豫。此后转入[[哥舒翰]]幕府，意味着改变职业路径，不是从此彻底退出政治。\n\n## 版本与辨析\n\n本页为七言长篇《封丘作》；高适另有同名五绝“州县才难适”，不可混用。“只言”对应古籍“秪言”，“官长”常见选本写“长官”；本页依《全唐诗》正文顺序。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [生平核对：《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "唐代宗李豫": "\n# 唐代宗李豫\n\n## 身份与生平\n\n李豫（726—779），肃宗之子，原名俶，后改名豫，762—779年在位。宝应沿用于继位之初，随后广德、永泰、大历；不要误把宝应元年全部算为肃宗朝。\n\n## 战争与恢复\n\n他在皇太子时期参与平乱，继位后战争在763年结束。[[安史之乱平定与杜甫闻捷]]与[[闻官军收河南河北]]表现消息如何进入诗人的生活。\n\n但763年又有吐蕃进入长安，见[[宝应继位与广德长安危机]]。平定叛乱、边防危机与地方军事权力并存，不宜把“战乱结束”理解为各地立刻恢复安定。\n\n## 与人物的联系\n\n[[郭子仪]]连接军事恢复；[[严武]]连接蜀地军政与杜甫晚年幕职；[[杜鸿渐]]连接蜀地处置和岑参的晚年。这里的联系有任命、军事行动、幕府背景等差别，不都是皇帝与诗人的直接会面。\n\n[[高适]]晚年地方和中央任职跨入代宗朝；[[李白]]通常纪年卒于762年，主要人生不能笼统放进整个大历时期。\n\n## 晚年诗歌环境\n\n[[杜甫成都草堂与严武幕府]]中764年幕职属于此朝；[[杜甫出蜀与夔州江湘漂泊]]串联离蜀、夔州与江湘。\n\n完整作品可从[[秋兴八首]]、[[登高（杜甫）]]、[[登岳阳楼]]进入。把漂泊与朝廷政治放在同一时间轴，有助于理解“时代已平乱，个人仍未安居”的处境；这是一种对读解释，而非以皇帝个人性格解释所有诗意。\n\n## 来源\n\n- [《旧唐书》卷11](https://zh.wikisource.org/wiki/舊唐書/卷11)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "武判官": "\n# 武判官\n\n《[[白雪歌送武判官归京]]》的送别对象。可以确认“武”是诗题所用姓氏，“判官”是职位称谓；本轮没有可靠依据确定其全名、生卒、家庭或完整任职履历。\n\n## 可以知道什么\n\n诗题写归京，诗中安排军中宴饮、辕门暮雪与轮台送行，说明文本中的他是一位从军幕离开的归客。判官承担军政辅助事务，可结合[[唐代幕府与谏官]]理解。\n\n## 暂时不定什么\n\n“岑参接替武判官”“某年某日交接”“武某具体名字”等说法，在本专题中均不作为已核实事实。作品能支撑送别关系，不能自动支撑完整人事档案。\n\n## 知识网络中的位置\n\n[[岑参第二次出塞]] → 武判官的离去 → 送别诗的形成，是背景与文本之间的连接。缺乏履历并不妨碍理解他在作品中的情感作用。\n\n关联：[[岑参·史料来源与阅读方法]]。\n\n## 来源与核查\n\n- [《白雪歌》原文及异文](https://zh.wikisource.org/wiki/白雪歌送武判官歸京)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n", "王昌龄": "\n# 王昌龄\n\n王昌龄，字少伯，生卒通行约698—757，亦有卒于756等说。籍贯有京兆、太原等不同记载；不据一个条目填成无争议精确坐标。曾任秘书省校书郎、汜水尉、江宁丞，后贬龙标尉，故有“王江宁”“王龙标”之称。\n\n## 从低级文官到贬谪诗友\n\n他的七言绝句著名，却没有因此走上显达仕途。[[芙蓉楼送辛渐二首]]在送友中表明清白心志；[[李白]]的[[闻王昌龄左迁龙标遥有此寄]]则用明月表达远方朋友的支持。具体贬谪原因，《旧唐书》笼统写“不护细行”，不能据此编造某项罪案。\n\n## 孟浩然与战乱中的死亡\n\n他与[[孟浩然]]有交往，《唐才子传》载740年前后访孟、孟食鲜病发，属于晚出细节，应参照[[孟浩然]]笔记的证据说明。《新唐书》及《唐才子传》记其乱中返乡、为刺史闾丘晓所杀，精确卒年不同编年有异，动机细节不补写成现场实录。\n\n与[[高适]]、[[岑参·人生故事|岑参]]对读边塞诗时须区分诗中军人角色和作者实任官职；写战阵不等于诗人亲自指挥每一场战斗。\n\n## 来源与核查\n\n- [《旧唐书》王昌龄传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》王昌龄传](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n- [《唐才子传》卷二](https://ctext.org/wiki.pl?chapter=849792&if=gb)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "新婚别": "\n# 新婚别\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n兔丝附蓬麻，引蔓故不长。\n嫁女与征夫，不如弃路旁。\n结发为妻子，席不暖君床。\n暮婚晨告别，无乃太匆忙！\n君行虽不远，守边赴河阳。\n妾身未分明，何以拜姑嫜？\n父母养我时，日夜令我藏。\n生女有所归，鸡狗亦得将。\n君今往死地，沉痛迫中肠。\n誓欲随君去，形势反苍黄。\n勿为新婚念，努力事戎行。\n妇人在军中，兵气恐不扬。\n自嗟贫家女，久致罗襦裳。\n罗襦不复施，对君洗红妆。\n仰视百鸟飞，大小必双翔。\n人事多错迕，与君永相望。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系759年（乾元二年）春，洛阳返回华州途中及相关创作；诗中细节的完成时间不能逐首精确到某日。 |\n| 地点 | 拟写赴河阳守军的新婚离别；新妇所在村落无确证。 |\n| 当时官职 | 华州司功参军，负责相关州务，不是现场主持抓丁的县吏。 |\n| 生活处境 | 朝廷任职受挫后在华州任官，往返河南与关中，目睹战争和征役压力。 |\n| 交游与写作对象 | 新妇向征夫独白，不能认作杜甫妻子自述。 |\n| 历史事件 | [[邺城之败与三吏三别]]；[[杜甫谏救房琯与华州任职]]。 |\n\n## 结合处境读诗（整理者解读）\n\n开篇寄生植物的依附关系对应婚姻尚未安稳即被战争折断。“席不暖君床”把征役压缩到新婚一夜；未正式拜见公婆又使她处于家庭身份尚未确定的状态。\n\n从“誓欲随君去”转成“努力事戎行”，不是感情突然消失，而是私人愿望向战争形势让步。“洗红妆”取消婚礼的喜庆，最后双飞的鸟反衬人间分离。\n\n## 版本与辨析\n\n“无乃太匆忙”线上单篇录作“无奈太匆忙”，本页采用《杜甫集》线上录文及通行读法；须注意版本差异。“兔丝”即菟丝，保留录文写法。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/新婚别)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n原文对校：[《杜甫集·新婚别》](https://www.shidianguji.com/book/SBCK133/chapter/SBCK133_478)。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "杜甫": "\n# 杜甫\n\n唐代诗人，字子美，通常纪年712—770。经历求仕、战乱、中央与地方任职，后来在蜀地等处辗转。诗作既有个人生活，也对政治和民生保持持续关注。\n\n## 与岑参的关系\n\n后世传记记载他参与荐举岑参；[[寄左省杜拾遗]]提供岑参写给杜甫的直接作品证据。荐举名单在后出材料中有需要辨析的人名，不照录整份名单为确定事实。\n\n## 共同活动与不同表达\n\n[[慈恩寺登塔唱和]]通常将杜甫与岑参、[[高适]]等联系起来。同登一塔，可以产生不同的诗歌观察。诗歌交流有证据，但不因此虚构日常聊天内容。\n\n## 阅读入口\n\n《春望》可理解战争中的城市与家庭；《茅屋为秋风所破歌》可理解个人困境与他人处境的联系。与岑参对读时，应关注两人各自的职业和行旅，而非只有“忧国”与“壮阔”两个标签。\n\n关联：[[安史之乱与岑参东归]]、[[唐代幕府与谏官]]。\n\n## 来源与核查\n\n- [《旧唐书》卷190下·杜甫](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《唐才子传》卷3·岑参](https://zh.wikisource.org/wiki/唐才子傳/卷3)\n- [《寄左省杜拾遗》原文](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n\n\n## 扩展：人生坐标与完整作品\n\n年表见[[杜甫·年表与争议]]；完整作品目录见[[高适与杜甫·作品与时代知识地图]]。\n\n- 壮游与诗友：[[望岳（岱宗夫如何）]]、[[春日忆李白]]、[[同诸公登慈恩寺塔（杜甫）]]。\n- 长安求仕与困居：[[兵车行]]、[[月夜（杜甫）]]、[[春望]]。\n- 华州与征役：[[新安吏]]、[[潼关吏]]、[[石壕吏]]、[[新婚别]]、[[垂老别]]、[[无家别]]，六篇全录。\n- 成都、梓州：[[蜀相]]、[[春夜喜雨]]、[[茅屋为秋风所破歌]]、[[闻官军收河南河北]]。\n- 出蜀与晚年：[[旅夜书怀]]、[[秋兴八首]]（八首全录）、[[登高（杜甫）]]、[[登岳阳楼]]、[[追酬故高蜀州人日见寄]]（含序）。\n\n从低级率府官、左拾遗、华州司功到节度参谋与检校工部员外郎，是数次职位转换；“杜拾遗”“杜工部”有时沿用旧称，不能一概当作创作时的现职。草堂前期的喜雨、破屋诗，早于764年入严武幕。\n\n人物入口：[[房琯]]、[[严武]]、[[杨氏（杜甫妻）]]、[[李白]]、[[郭子仪]]；[[诸葛亮]]是诗中追怀古人，非现实交游。事件入口：[[长安陷落与杜甫困居]]、[[杜甫谏救房琯与华州任职]]、[[邺城之败与三吏三别]]、[[杜甫成都草堂与严武幕府]]、[[杜甫出蜀与夔州江湘漂泊]]。\n\n\n## 扩展对读：李白与孟浩然、王维、贺知章\n\n[[李白孟浩然与盛唐诗友·知识地图]]把既有李杜交游接入李白其他时期的诗友网络。[[春日忆李白]]对读[[赠孟浩然]]，[[追酬故高蜀州人日见寄]]对读[[对酒忆贺监二首]]；[[旅夜书怀]]对读[[宿建德江]]，[[登岳阳楼]]对读[[望洞庭湖赠张丞相]]。\n\n[[王维辋川生活与陷贼受官]]可与杜甫困居长安、脱身赴凤翔相互参照，不把不同诗人的受困与审查经历写成同一条路线。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "李阳冰": "\n# 李阳冰\n\n李阳冰，唐代书法家，尤以篆书著名，生卒年不详。762年任当涂县令，[[李白]]晚年依之，史传称两人为族人，通常称李白族叔；具体亲属世系不作无据补全。\n\n## 当涂照料与编集\n\n《草堂集序》署宝应元年十一月，记李白病亟、枕上授稿、托其作序。李阳冰的意义不只在接济，而在保存、整理诗稿，使今日读者还能追索李白文学。见[[李白当涂晚年与诗集编纂]]。\n\n序中追述家世、皇帝知遇和文学成就，有见闻价值，也有尊亲与颂扬的立场。“十丧其九”不可机械用于反算李白一生作品总数。现传《李太白集》经过后代搜辑，并不等于762年《草堂集》原貌。\n\n可与[[杜确]]、[[岑嘉州集的编纂与流传]]对读诗人的身后文献命运。\n\n## 来源与核查\n\n- [李阳冰《草堂集序》](https://www.xuges.com/mj/l/libai/072.htm)\n- [《新唐书》李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [宋蜀刻本《李太白文集》说明](https://www.shuge.org/view/li_tai_bai_wen_ji/)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "行路难三首（李白）": "\n# 行路难三首（李白）\n\n作者：[[李白]]。\n\n## 完整原文\n\n### 其一\n\n金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难！行路难！多岐路，今安在？\n长风破浪会有时，直挂云帆济沧海。\n\n### 其二\n\n大道如青天，我独不得出。\n羞逐长安社中儿，赤鸡白狗赌梨栗。\n弹剑作歌奏苦声，曳裾王门不称情。\n淮阴市井笑韩信，汉朝公卿忌贾生。\n君不见昔时燕家重郭隗，拥篲折节无嫌猜。\n剧辛乐毅感恩分，输肝剖胆效英才。\n昭王白骨萦烂草，谁人更扫黄金台。\n行路难，归去来。\n\n### 其三\n\n有耳莫洗颍川水，有口莫食首阳蕨。\n含光混世贵无名，何用孤高比云月。\n吾观自古贤达人，功成不退皆殒身。\n子胥既弃吴江上，屈原终投湘水滨。\n陆机雄才岂自保，李斯税驾苦不早。\n华亭鹤唳讵可闻，上蔡苍鹰何足道。\n君不见吴中张翰称达生，秋风忽忆江东行。\n且乐生前一杯酒，何须身后千载名。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 三首常联系744年离京；逐首是否同年、同时而作不确证 |\n| 地点 | 长安及离京语境，三首确切写作地点未定 |\n| 官职 | 翰林供奉结束前后，通行背景 |\n| 生活处境 | 功业期待、求知遇与身退念头相互拉扯 |\n| 交游 | 无明示现实受赠者；大量古人是用典 |\n| 历史事件 | [[李白翰林供奉与赐金放还]] |\n\n## 结合处境解读\n\n其一借吕尚垂钓、伊尹梦日等典故让困境保留转机；其二追问谁能礼贤，将怀才不遇写成君臣相遇的制度问题；其三又借历史中的失身者和归乡者讨论身名取舍。三首合读，能看见李白既求作为又惧被消耗。\n\n“长风破浪”不只是独立的励志句；它从停杯、拔剑、道路阻塞中转出，与后两首的退隐愿望构成张力。\n\n## 系年、异文与证据边界\n\n“珍羞”“直”分别通馐、值，保留底本文字；“碧溪／坐溪”“雪／云”“破浪／破波”等有异文。本页三首完整收录，采用通行读法，不强认三首对应连续三天的经历。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/行路難_(李白))\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "闻官军收河南河北": "\n# 闻官军收河南河北\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n剑外忽传收蓟北，初闻涕泪满衣裳。\n却看妻子愁何在，漫卷诗书喜欲狂。\n白日放歌须纵酒，青春作伴好还乡。\n即从巴峡穿巫峡，便下襄阳向洛阳。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系763年春（广德元年），平叛消息传入蜀地后。 |\n| 地点 | 梓州（今四川三台一带），不是在成都草堂听讯。 |\n| 当时官职 | 离开中央与华州任，尚未于764年入严武幕。 |\n| 生活处境 | 因蜀中动乱寄居梓州，久盼回乡。 |\n| 交游与写作对象 | 妻子儿女；“妻子”是妻与子女的旧义。 |\n| 历史事件 | [[安史之乱平定与杜甫闻捷]]；此前[[徐知道之乱与杜甫流寓梓阆]]。 |\n\n## 结合处境读诗（整理者解读）\n\n全诗的动作依次是听、哭、看家人、卷诗书、放歌、想象出发。喜悦来自战争结束可能带来的归家机会，而不是已实际回到故乡。\n\n巴峡、巫峡、襄阳、洛阳是一瞬间铺开的归途愿景，“即”“便”压缩旅程，不能据此写成当天完成的交通路线。杜甫此后仍留蜀并漂泊，诗的愿望与生平实际应分别记录。“青春”指明媚春光。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/聞官軍收河南河北)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "严武": "\n# 严武\n\n唐代官员、将领（726—765，通行纪年），曾两度镇蜀，是[[杜甫]]草堂时期的重要交游与幕主。\n\n## 任职与杜甫生活\n\n761年末至762年镇蜀，后回朝；764年再镇成都，杜甫返草堂，并入其幕为节度参谋，兼检校工部员外郎。不能把760年建草堂、761年《春夜喜雨》与764年入幕压成同一件事，也不能将检校官称写成杜甫一直在中央工部办公。\n\n## 文学和史传的相互限制\n\n诗中交往能证实往来与支持，史传也有性情冲突的叙述；后出的“险被杀”故事不宜不加辨析地当逐日事实。杜甫的依赖与自尊可以并存，幕府工作也可能带来不适。\n\n765年严武卒，杜甫随后离成都；这是一项重要背景，但离蜀亦与健康、归乡和地方局势有关，不只是一条“失去朋友便无处可去”的单因果故事。\n\n关联：[[杜甫成都草堂与严武幕府]]、[[徐知道之乱与杜甫流寓梓阆]]、[[旅夜书怀]]、[[高适杜甫蜀中交游与人日唱和]]。\n\n## 来源与核查\n\n- [《旧唐书》卷117·严武](https://zh.wikisource.org/wiki/舊唐書/卷117)\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "兵车行": "\n# 兵车行\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n车辚辚，马萧萧，行人弓箭各在腰。\n爷娘妻子走相送，尘埃不见咸阳桥。\n牵衣顿足拦道哭，哭声直上干云霄。\n道旁过者问行人，行人但云点行频。\n或从十五北防河，便至四十西营田。\n去时里正与裹头，归来头白还戍边。\n边庭流血成海水，武皇开边意未已。\n君不闻汉家山东二百州，千村万落生荆杞。\n纵有健妇把锄犁，禾生陇亩无东西。\n况复秦兵耐苦战，被驱不异犬与鸡。\n长者虽有问，役夫敢申恨？\n且如今年冬，未休关西卒。\n县官急索租，租税从何出？\n信知生男恶，反是生女好。\n生女犹得嫁比邻，生男埋没随百草。\n君不见青海头，古来白骨无人收。\n新鬼烦冤旧鬼哭，天阴雨湿声啾啾。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 天宝年间长安时期，常见751年说与752年说；具体作年及征兵本事均有不同解释。 |\n| 地点 | 长安、咸阳桥的征兵送行场景；不等于作者亲赴青海。 |\n| 当时官职 | 未仕。 |\n| 生活处境 | 长安求仕而生活困顿，能接触征役与家庭破产。 |\n| 交游与写作对象 | “道旁过者”和“行人”是叙事角色，不能具名当作真实访谈记录。 |\n| 历史事件 | [[天宝开边与兵车行系年]]；尚在安史之乱以前。 |\n\n## 结合处境读诗（整理者解读）\n\n“点行频”把零散的送别集中为制度问题：役夫从少年到白头仍不断戍守，家中劳力流失又使租税无法交纳。诗用问答把前线、田亩和家庭接在一起，最后以青海无主白骨写战争代价的累积。\n\n“武皇”“汉家”借汉代语汇书写唐代现实，“山东”主要指崤山或华山以东的大范围地域，不能直接缩成今天的山东省。部分解释联系751年征南诏后的强制募兵，另一些强调对吐蕃长期用兵；不能把它锁定为一场战争的完整战报。\n\n## 版本与辨析\n\n“爷娘”对应古籍“耶孃”等写法。线上作品页标752年仅是编者标签，本页保留751／752异说；本轮论文仅核对检索可见段落，未完成全文阅读。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/兵車行)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [《兵车行》作年讨论：杜甫研究学刊2004年第1期论文](https://c.cnkgraph.com/eBooks/今著/杜甫研究学刊/2004/1/论杜甫新乐府诗的产生——以《兵车行》的探讨为中心.pdf)\n- [征南诏史事转述](https://www.gushici.net/shici/04/8856.html)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "月夜（杜甫）": "\n# 月夜（杜甫）\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n今夜鄜州月，闺中只独看。\n遥怜小儿女，未解忆长安。\n香雾云鬟湿，清辉玉臂寒。\n何时倚虚幌，双照泪痕干。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系756年秋（至德元载），后人结合陷贼经历系年。 |\n| 地点 | 作者在沦陷长安；妻儿在鄜州，诗中的鄜州夜景是遥想。 |\n| 当时官职 | 此前任右卫率府胄曹参军；此时受困，不是已任左拾遗。 |\n| 生活处境 | 赴肃宗行在途中被叛军俘获，与家属分隔。 |\n| 交游与写作对象 | 妻子[[杨氏（杜甫妻）]]及儿女。 |\n| 历史事件 | [[长安陷落与杜甫困居]]；[[安史之乱与岑参东归]]。 |\n\n## 结合处境读诗（整理者解读）\n\n杜甫没有先说自己思家，而从妻子独看鄜州月写起；“未解”让儿童的不知与成人的忧苦相映。香雾、湿发和寒冷玉臂都是想象中的细部，并不是作者亲眼看见妻子当夜的姿态。\n\n末句期待“双照”，把战争中无法团聚的现实改写为团聚的愿望。杜甫后来才从长安脱身赴凤翔任谏官，不能将这首诗写成朝廷任职期间的普通出差思家。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/月夜_(杜甫))\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "李白翰林供奉与赐金放还": "\n# 李白翰林供奉与赐金放还\n\n## 742—744年的长安身份\n\n通行编年认为[[李白]]742年奉召入长安，供奉翰林，744年离京。其职责围绕文学供奉、应制等，不宜直接等同后世制度固定的翰林学士，也不能说已经取得他理想中的经世宰辅职位。\n\n## 从受到知遇到离开宫廷\n\n《新唐书》记[[贺知章]]激赏、玄宗召见，以及李白醉中应制、高力士脱靴、受到排斥、请求还山、赐金放还。李白诗序能直接支持“谪仙”与金龟换酒；杨贵妃因某句诗阻止授官的完整因果链则主要靠史传、笔记，不能当作李白自述。\n\n[[行路难三首（李白）]]通行联系744离京失意，其一仍盼施展，其二寻求礼贤者，其三思考功成身退。三首不宜压成“李白愤怒辞职”一个场景。[[蜀道难（李白）]]精确系年与讽刺对象争议另外保留。\n\n## 接入既有诗友路线\n\n离京后李白与[[杜甫]]相识，并有[[梁宋交游与李杜高同游]]，这是前一专题已经建立的节点。不能将744年长安宫廷会见与744—745年三人行旅写成同一场聚会。\n\n## 来源与核查\n\n- [《新唐书》李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [《旧唐书》李白传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [李阳冰序](https://www.xuges.com/mj/l/libai/072.htm)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n"}, "vault": "Obsidian Vault", "folder": "40-历史与人文/唐诗·岑参", "version": "2026-10-02", "supplementedPoems": ["逢入京使", "白雪歌送武判官归京", "走马川行奉送封大夫出师西征", "寄左省杜拾遗"]}</script><script function noteSection(text,title){const lines=text.split('\n');let start=lines.findIndex(l=>l.trim()==='## '+title);if(start<0)return '';let end=start+1;while(end<lines.length&&!/^#{1,2}\s/.test(lines[end]))end++;return lines.slice(start+1,end).join('\n').trim();}
function poemCard(title,index,event){const note=D.notes[title]||'',original=noteSection(note,'完整原文');let context=noteSection(note,'创作坐标');if(!context){const remaining=noteSection(note,'原笔记与创作背景');context=remaining.split('\n').filter(l=>l.trim()&&!l.startsWith('#')).slice(0,2).join('\n');}return `<details class="inline-poem" ${index===0?'open':''}><summary><span>${esc(title)}</span><small>完整原文 <i>⌄</i></small></summary><div class="poem-content"><div class="poem-original">${original?markdown(original):'<p>原文尚未收录，可打开原笔记查看。</p>'}</div><details class="poem-context"><summary>创作环境 · 时间与处境</summary><div class="poem-background">${context?markdown(context):'<p>'+esc(event.dateLabel+' · '+D.places[event.place][0])+'</p><p>'+esc(event.summary)+'</p>'}</div></details><button class="poem-note-link" data-note="${esc(title)}">解读、来源与详细笔记 ↗</button></div></details>`;}

function render(){const list=filtered();if(!list.some(e=>e.id===state.selected))state.selected=list[0]?.id??null;const selected=list.find(e=>e.id===state.selected);$('mapcount').textContent=new Set(list.map(e=>e.place)).size+' 个地点 · '+list.length+' 段人生';$('resultcount').textContent=list.length+' 个事件，按时间排列';$('yearlabel').textContent=state.min+' — '+state.max+' 年';$('yearmin').value=state.min;$('yearmax').value=state.max;document.querySelectorAll('[data-poet]').forEach(b=>{b.classList.toggle('active',b.dataset.poet===state.poet);b.setAttribute('aria-pressed',String(b.dataset.poet===state.poet));});document.querySelectorAll('[data-epoch]').forEach(b=>{b.classList.toggle('active',b.dataset.epoch===state.epoch);b.setAttribute('aria-pressed',String(b.dataset.epoch===state.epoch));});

let siblings=list.filter(e=>e.place===selected.place);$('detail').innerHTML=`<button class="cardclose" data-close-detail aria-label="关闭事件卡">×</button><div class="panel-top"><span>地点 / ${esc(D.places[selected.place][0])}</span><span>${esc(selected.kind)}</span></div><div class="timebig">${esc(selected.dateLabel)}</div><div class="period">${esc(epochs(selected))} · 按通行编年／事件背景浏览</div><h2>${esc(selected.title)}</h2><div>${selected.poets.map(p=>`<button class="pill" style="color:${colors[p]}" data-note="${esc(p==='岑参'?'岑参·人生故事':p)}">${esc(p)}</button>`).join('')}</div><div class="poet-profiles">${selected.poets.map(portraitCard).join('')}</div><p class="summary">${esc(selected.summary)}</p>${selected.uncertain?'<div class="note-warning">这个节点包含系年或定位的未定之处。图上的时间窗口用于浏览，具体证据与异说请看原笔记。</div>':''}<div class="sectiontitle">关键人物与时代关系</div><div class="personlinks">${selected.people.map(p=>noteButton(p)).join('')}</div>${selected.poems.length?`<div class="sectiontitle">此地诗作 · 原文与创作处境</div>${selected.poems.map((p,i)=>poemCard(p,i,selected)).join('')}`:''}<button class="readmain" data-note="${esc(selected.note)}">阅读事件原笔记 ↗</button><button class="focus-place" data-focus-place>◎ 将此地点移到地图中心</button><p class="locationnote">定位说明：${esc(D.places[selected.place][3])}</p>${siblings.length>1?'<div class="sectiontitle">此地还有 '+siblings.length+' 个匹配事件</div><div class="place-events">'+siblings.map(e=>`<button data-event="${e.id}" class="${e.id===state.selected?'active':''}">${esc(e.title)}</button>`).join('')+'</div>':''}`;if(map.hasLayer(eventPopup)){eventPopup.setLatLng(latlng(selected.place));eventPopup.update();}

function renderMap(list){markers.clearLayers();routes.clearLayers();const grouped={};for(const e of list)(grouped[e.place]??=[]).push(e);
if(state.routes)for(const p of Object.keys(colors)){if(state.poet!=='全部'&&state.poet!==p)continue;const path=list.filter(e=>e.poets.includes(p)&&e.kind!=='政局'&&!['gs-yange','df-memory','gs-shuzhou','wine'].includes(e.id)).sort((a,b)=>a.start-b.start).map(e=>latlng(e.place));if(path.length>1)L.polyline(path,{color:colors[p],weight:2,dashArray:'6 8',opacity:.65}).addTo(routes);}
const groups=[];for(const[id,evs]of Object.entries(grouped)){const point=map.latLngToContainerPoint(latlng(id));const group=groups.find(g=>g.point.distanceTo(point)<38);if(group){group.ids.push(id);group.evs.push(...evs);}else groups.push({ids:[id],evs:[...evs],point});}
for(const group of groups){const{id}=group;const primary=group.ids.find(i=>grouped[i].some(e=>e.id===state.selected))||group.ids[0],selected=group.evs.some(e=>e.id===state.selected),poets=[...new Set(group.evs.flatMap(e=>e.poets))],name=D.places[primary][0],label=group.ids.length>1?name+'周边 · '+group.ids.length+'地':name;
const segments=poets.map((p,i)=>colors[p]+' '+i*100/poets.length+'% '+(i+1)*100/poets.length+'%').join(',');
const icon=L.divIcon({className:'poetry-icon',iconSize:[30,30],iconAnchor:[15,15],html:`<button class="geo-marker ${selected?'selected':''}" data-place="${primary}" data-cluster="${group.ids.join(',')}" style="background:conic-gradient(${segments})" aria-label="${esc(label)}，${group.evs.length}个事件"><span>${group.evs.length}</span></button>`});
const marker=L.marker(latlng(primary),{icon,keyboard:true,title:label}).addTo(markers);marker.bindTooltip(esc(label),{direction:'top',offset:[0,-16],permanent:map.getZoom()>=6||group.ids.length>1,className:'place-label'});
marker.on('click',()=>{if(group.ids.length>1){map.fitBounds(L.latLngBounds(group.ids.map(latlng)),{padding:[100,150],maxZoom:map.getZoom()+2});}select(group.evs.find(e=>e.id===state.selected)?.id||group.evs[0].id);});}
}

// Small, escaped Markdown reader. Local wikilinks resolve to the embedded note snapshot.
function inline(s){return esc(s).replace(/\[\[([^\]]+)\]\]/g,(_,v)=>{let[t,label]=v.split('|'),name=t.split('#')[0];return`<button class="wikilink" data-note="${esc(name)}">${label||name}</button>`;}).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,t,url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${t}</a>`).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function markdown(s){let lines=s.split('\n'),html='',i=0,verse=false;while(i<lines.length){let l=lines[i];if(!l.trim()){i++;continue;}if(l.startsWith('#')){let m=l.match(/^(#{1,3})\s+(.*)$/);if(m){let h=m[1].length;html+=`<h${h}>${inline(m[2])}</h${h}>`;verse=m[2]==='完整原文';i++;continue;}}
if(l.startsWith('|')){let rows=[];while(i<lines.length&&lines[i].startsWith('|'))rows.push(lines[i++]);html+='<table>';rows.forEach((r,k)=>{if(/^\|[\s:|\-]+\|$/.test(r))return;let tag=k===0?'th':'td';html+='<tr>'+r.slice(1,-1).split('|').map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>';});html+='</table>';continue;}
if(l.startsWith('>')){let r=[];while(i<lines.length&&lines[i].startsWith('>'))r.push(lines[i++].replace(/^>\s?/,''));html+='<blockquote>'+r.map(inline).join('<br>')+'</blockquote>';continue;}
if(/^[-*] /.test(l)||/^\d+\. /.test(l)){let rows=[],ordered=/^\d/.test(l);while(i<lines.length&&(/^[-*] /.test(lines[i])||/^\d+\. /.test(lines[i])))rows.push(lines[i++].replace(/^([-*]|\d+\.)\s+/,''));let tag=ordered?'ol':'ul';html+=`<${tag}>`+rows.map(r=>'<li>'+inline(r)+'</li>').join('')+`</${tag}>`;continue;}
let para=[];while(i<lines.length&&lines[i].trim()&&!/^(#|\||>|[-*] |\d+\. )/.test(lines[i]))para.push(lines[i++]);if(!para.length){i++;continue;}html+=`<div class="${verse?'verse':'prose'}"><p>`+para.map(inline).join('<br>')+'</p></div>';}
return html;}
let history=[],returnFocus=null;function openNote(t,back=false){if(!$('modal').classList.contains('open')){returnFocus=document.activeElement;history=[];}if(!back)history.push(t);$('modal').classList.add('open');$('detail').classList.add('reader-behind');landing.classList.add('hidden');$('notetitle').textContent=t;$('noteback').style.display=history.length>1?'block':'none';let c=D.notes[t];$('notebody').innerHTML=(portraits[t]?portraitCard(t):t==='岑参·人生故事'?portraitCard('岑参'):'')+'<div class="readerhint">笔记快照 · 双链可继续阅读 · 原文、环境与争议保留</div>'+(c?markdown(c):'<p>此关联笔记尚未收录到地图快照。可在 Obsidian 笔记库中查找。</p>');$('notebody').scrollTop=0;$('obsidian').href='obsidian://open?vault='+encodeURIComponent(D.vault)+'&file='+encodeURIComponent(D.folder+'/'+t);$('close').focus();}
function closeNote(){$('modal').classList.remove('open');$('detail').classList.remove('reader-behind');returnFocus?.focus();}document.addEventListener('click',e=>{if(e.target.closest('[data-close-detail]')){closeEvent();return;}if(e.target.closest('[data-focus-place]')){focusPlace();return;}let n=e.target.closest('[data-note]');if(n){openNote(n.dataset.note);return;}let ev=e.target.closest('[data-event]');if(ev){select(ev.dataset.event);return;}if(e.target.closest('[data-reset]'))reset();});$('close').onclick=closeNote;$('noteback').onclick=()=>{history.pop();openNote(history.at(-1),true);};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeNote();});document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('open')){if(e.key==='Escape'){closeEvent();document.querySelector('.collection').classList.remove('open');$('browse').classList.remove('active');$('browse').setAttribute('aria-expanded','false');}return;}if(e.key==='Escape')closeNote();if(e.key==='Tab'){let f=[...$('modal').querySelectorAll('button,a[href]')].filter(n=>n.offsetParent!==null);let first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('about').onclick=()=>{D.notes['地图阅读说明']='# 地图阅读说明\n\n## 阅读路径\n\n选诗人、时期和类型 → 点击地点 → 选择此地事件 → 阅读人物与作品。原笔记的双链也可以在网页内继续阅读。\n\n## 时间与位置\n\n事件按时间区间与筛选窗口相交显示。736／752等争议节点以宽区间示意，不声称每一年都发生。756、762是跨朝年份，皇帝时期标签只是导航，不替代确切月份。\n\n现代经纬度近似代表活动区域，底图采用 Esri 现代地图，没有唐代疆界。真实地理底图需要联网；知识笔记与组件保存在本地。作品题材与作者落笔地、家属所在地、追忆对象所在地不能混为一谈。节点连线只是浏览顺序，非核实的道路和逐日行程。\n\n## 资料范围\n\n40个节点经过人工选择，以已有135篇笔记为知识来源。网页是2026-10-02的静态快照，不会自动同步后续笔记更改。作品原文、来源和异说保留在原笔记中。\n\n## 操作\n\n拖动和滚轮缩放；加减按钮适合触屏；全图按钮恢复地图。地点也支持键盘Tab和Enter。对话框可按Esc关闭。筛选结果表汇总当前地点、时期和事件，可继续打开事件笔记。\n\n## 相关知识\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]\n[[岑参·史料来源与阅读方法]]\n[[李白事迹中的史料与传说]]';openNote('地图阅读说明');$('obsidian').style.visibility='hidden';};const originalOpen=openNote;document.addEventListener('click',e=>{if(e.target.closest('[data-note]'))$('obsidian').style.visibility='visible';});$('export').onclick=()=>{const list=filtered();const title='当前筛选结果';D.notes[title]='# 当前筛选结果\n\n人物：'+state.poet+'；年份：'+state.min+'—'+state.max+'；类型：'+state.kind+'。共'+list.length+'个事件。\n\n| 时间 | 地点 | 事件原笔记 | 相关诗人 |\n|---|---|---|---|\n'+list.map(e=>'|'+e.dateLabel+'|'+D.places[e.place][0]+'|[['+e.note+']]|'+e.poets.join('、')+'|').join('\n');openNote(title);$('obsidian').style.visibility='hidden';};window.addEventListener('resize',()=>{map.invalidateSize();renderMap(filtered());});render();requestAnimationFrame(()=>{map.invalidateSize();fitMap();});
</script></body></html>
