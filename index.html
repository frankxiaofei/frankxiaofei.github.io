start": 724, "end": 725, "place": "jiangyou", "poets": ["李白"], "people": ["李白"], "kind": "行旅", "note": "李白出蜀漫游与安陆生活", "poems": [], "summary": "离开蜀地，文章、求道与求荐共同进入漫游生活。出蜀年有724、725等说。", "dateLabel": "约724／725", "uncertain": true}, {"id": "lb-anlu", "title": "安陆生活与求荐", "start": 727, "end": 735, "place": "anlu", "poets": ["李白"], "people": ["李白"], "kind": "生活", "note": "李白出蜀漫游与安陆生活", "poems": [], "summary": "家庭依托和地方生活伴随求荐；布衣漫游不能理解为没有经济与家庭支持。", "dateLabel": "727前后起", "uncertain": true}, {"id": "lb-meng", "title": "江汉交游与送孟浩然", "start": 728, "end": 740, "place": "wuhan", "poets": ["李白"], "people": ["李白", "孟浩然"], "kind": "交游", "note": "李白孟浩然交游与江汉送别", "poems": ["黄鹤楼送孟浩然之广陵", "赠孟浩然"], "summary": "诗友间的敬慕与送别。初识和作品年份存在不同系年，时间区间是浏览窗口，不表示十二年连续同游。", "dateLabel": "开元年间 · 年份未定", "uncertain": true}, {"id": "df-qizhao", "title": "齐赵壮游与望岳", "start": 735, "end": 737, "place": "taishan", "poets": ["杜甫"], "people": ["杜甫"], "kind": "作品", "note": "杜甫·年表与争议", "poems": ["望岳（岱宗夫如何）"], "summary": "此节点以洛阳作为早年求仕与外游入口，作品实际关联齐赵泰山区域。请从作品页辨认登顶愿望与实际经历。", "dateLabel": "约736 · 区域入口", "uncertain": true}, {"id": "gs-yange", "title": "东北征戍与燕歌行", "start": 738, "end": 738, "place": "yan", "poets": ["高适"], "people": ["高适", "张守珪"], "kind": "作品", "note": "开元东北边事与燕歌行", "poems": ["燕歌行"], "summary": "诗序明记738年，归客示诗引出唱和。图示的是题材区域，落笔地常系梁宋，不能当作现场战报。", "dateLabel": "738 · 题材区域", "uncertain": false}, {"id": "lb-court", "title": "翰林供奉与离京", "start": 742, "end": 744, "place": "changan", "poets": ["李白"], "people": ["李白", "贺知章", "唐玄宗李隆基"], "kind": "任职", "note": "李白翰林供奉与赐金放还", "poems": ["行路难三首（李白）", "蜀道难（李白）"], "summary": "供奉翰林与经世愿望之间有落差。742—744为通行生平坐标，作品具体系年仍以原笔记说明为准。", "dateLabel": "742—744", "uncertain": false}, {"id": "li-du", "title": "李杜相识", "start": 744, "end": 744, "place": "luoyang", "poets": ["李白", "杜甫"], "people": ["李白", "杜甫"], "kind": "交游", "note": "梁宋交游与李杜高同游", "poems": ["春日忆李白"], "summary": "通行系年将李杜相识置于洛阳；后来怀人诗证明文学交流，不补写相遇时的对白。", "dateLabel": "744前后", "uncertain": true}, {"id": "three", "title": "李杜高梁宋交游", "start": 744, "end": 745, "place": "liangsong", "poets": ["李白", "杜甫", "高适"], "people": ["李白", "杜甫", "高适"], "kind": "交游", "note": "梁宋交游与李杜高同游", "poems": ["春日忆李白"], "summary": "三位诗人的人生交汇。各地同行范围须逐诗考订，不能把两年全部路线写成全程共游。", "dateLabel": "744—745前后", "uncertain": true}, {"id": "gs-dong", "title": "睢阳送董庭兰", "start": 747, "end": 747, "place": "liangsong", "poets": ["高适"], "people": ["高适", "董庭兰"], "kind": "交游", "note": "别董大二首", "poems": ["别董大二首"], "summary": "通行系747冬的布衣送友。两首全文同时保留，离别中的勉励不能掩盖求仕困顿。", "dateLabel": "通行747冬", "uncertain": true}, {"id": "df-changan", "title": "困居长安与求仕", "start": 746, "end": 755, "place": "changan", "poets": ["杜甫"], "people": ["杜甫", "唐玄宗李隆基", "李林甫"], "kind": "生活", "note": "杜甫·年表与争议", "poems": ["兵车行", "春日忆李白"], "summary": "献赋求仕、生活困顿与征役题材相交。作诗时官职须逐篇区分，不能提前赋予左拾遗职位。", "dateLabel": "746—755", "uncertain": false}, {"id": "gs-county", "title": "封丘县尉的公务困境", "start": 749, "end": 752, "place": "fengqiu", "poets": ["高适"], "people": ["高适"], "kind": "任职", "note": "高适封丘任职与入哥舒翰幕府", "poems": ["封丘作"], "summary": "对上拜迎与对下鞭挞的矛盾进入诗篇，基层任职不同于后来统军的节度使。", "dateLabel": "749—752前后", "uncertain": true}, {"id": "cs-anxi", "title": "第一次出塞：安西军幕", "start": 749, "end": 751, "place": "anxi", "poets": ["岑参"], "people": ["高仙芝"], "kind": "任职", "note": "岑参第一次出塞", "poems": ["逢入京使"], "summary": "文职掌书记的工作与长途行旅带来新的诗歌经验。入高仙芝幕不等于确认参加怛罗斯战役。", "dateLabel": "749—751前后", "uncertain": true}, {"id": "gs-west", "title": "进入河西军幕", "start": 752, "end": 754, "place": "wuwei", "poets": ["高适"], "people": ["高适", "哥舒翰"], "kind": "任职", "note": "高适封丘任职与入哥舒翰幕府", "poems": [], "summary": "从县尉转向掌书记，文章接入边镇行政。以武威示意军幕区域，不认定每日驻地。", "dateLabel": "约752／753起", "uncertain": true}, {"id": "tower", "title": "慈恩寺登塔唱和", "start": 752, "end": 752, "place": "changan", "poets": ["岑参", "杜甫", "高适"], "people": ["杜甫", "高适", "薛据"], "kind": "交游", "note": "慈恩寺登塔唱和", "poems": ["同诸公登慈恩寺塔（杜甫）", "同诸公登慈恩寺浮图（高适）"], "summary": "共同登临与不同观察并存。岑参诗题直接列高适、薛据；通行年份来自后世编年。", "dateLabel": "通行752秋", "uncertain": true}, {"id": "wine", "title": "宴饮、抱负与将进酒", "start": 736, "end": 752, "place": "songshan", "poets": ["李白"], "people": ["李白", "岑勋", "元丹丘"], "kind": "作品", "note": "将进酒（李白）", "poems": ["将进酒（李白）"], "summary": "有736、752等系年，常联系嵩山颍阳山居。宽时间区间表示未定，不表示连续宴饮；“岑夫子”是岑勋，非岑参。", "dateLabel": "736／752等说", "uncertain": true}, {"id": "cs-beiting", "title": "第二次出塞：北庭与送别", "start": 754, "end": 757, "place": "beiting", "poets": ["岑参"], "people": ["封常清", "武判官"], "kind": "任职", "note": "岑参第二次出塞", "poems": ["白雪歌送武判官归京", "走马川行奉送封大夫出师西征"], "summary": "封常清幕中任判官。风雪中的送行与出征诗形成不同情境，武判官完整姓名未定。", "dateLabel": "754起 · 至乱中", "uncertain": true}, {"id": "rebellion", "title": "范阳起兵与全国危机", "start": 755, "end": 755, "place": "fan", "poets": ["李白", "杜甫", "高适", "岑参"], "people": ["安禄山", "唐玄宗李隆基"], "kind": "政局", "note": "安史之乱与岑参东归", "poems": [], "summary": "这是共同的时代背景，不表示四位诗人到过起兵现场。军权、中枢关系与个人命运开始改变。", "dateLabel": "755", "uncertain": false}, {"id": "tongguan", "title": "潼关失守与玄宗入蜀", "start": 756, "end": 756, "place": "tongguan", "poets": ["高适", "杜甫"], "people": ["哥舒翰", "唐玄宗李隆基", "高适"], "kind": "政局", "note": "潼关失守与玄宗入蜀", "poems": [], "summary": "关中防线失守改变中央与诗人的去向。图示关口区域，非精确作战阵位。", "dateLabel": "756", "uncertain": false}, {"id": "lingwu", "title": "肃宗灵武即位", "start": 756, "end": 756, "place": "lingwu", "poets": ["李白", "杜甫", "高适", "岑参"], "people": ["唐肃宗李亨", "唐玄宗李隆基", "郭子仪"], "kind": "政局", "note": "灵武即位与两京收复", "poems": [], "summary": "皇帝主线转到肃宗。上皇与在位皇帝并存，战时即位与后来收复两京不能合写为一个节点。", "dateLabel": "756", "uncertain": false}, {"id": "df-prison", "title": "困居陷落长安", "start": 756, "end": 757, "place": "changan", "poets": ["杜甫"], "people": ["杜甫", "杨氏（杜甫妻）"], "kind": "生活", "note": "长安陷落与杜甫困居", "poems": ["月夜（杜甫）", "春望"], "summary": "杜甫身在长安，妻儿在鄜州。《月夜》从家人视角表达思念，不能把作者移到家属所在地。", "dateLabel": "756—757", "uncertain": false}, {"id": "df-fengxiang", "title": "脱身赴凤翔与谏救房琯", "start": 757, "end": 758, "place": "fengxiang", "poets": ["杜甫"], "people": ["杜甫", "房琯", "唐肃宗李亨"], "kind": "任职", "note": "杜甫谏救房琯与华州任职", "poems": ["寄左省杜拾遗"], "summary": "任左拾遗后谏救房琯，随后地方任职；这是一段官职变化，非始终在长安为官。", "dateLabel": "757—758", "uncertain": false}, {"id": "cs-return", "title": "东归与谏官生活", "start": 757, "end": 759, "place": "changan", "poets": ["岑参"], "people": ["杜甫", "唐肃宗李亨"], "kind": "任职", "note": "安史之乱与岑参东归", "poems": ["寄左省杜拾遗"], "summary": "军幕文字工作转向朝廷进言。图示中央生活入口；补阙左右称谓差异在原笔记保留。", "dateLabel": "757前后起", "uncertain": true}, {"id": "df-hua", "title": "华州司功任职", "start": 758, "end": 759, "place": "huazhou", "poets": ["杜甫"], "people": ["杜甫", "房琯"], "kind": "任职", "note": "杜甫谏救房琯与华州任职", "poems": ["新安吏", "潼关吏"], "summary": "中央任职转向地方，战局与征役生活进入返程途中的诗歌。", "dateLabel": "758—759", "uncertain": false}, {"id": "lb-yong", "title": "永王幕与政治分途", "start": 756, "end": 757, "place": "jiangling", "poets": ["李白", "高适"], "people": ["李白", "高适", "永王李璘", "唐肃宗李亨"], "kind": "政局", "note": "永王事件与高适李白分途", "poems": [], "summary": "李白进入永王幕，高适参与肃宗方面部署。江陵代表永王军政背景，不表示高适在此亲自擒王。", "dateLabel": "756—757", "uncertain": false}, {"id": "lb-return", "title": "遇赦东还与白帝轻舟", "start": 759, "end": 759, "place": "baidi", "poets": ["李白"], "people": ["李白", "唐肃宗李亨"], "kind": "行旅", "note": "李白流夜郎与遇赦东还", "poems": ["早发白帝城"], "summary": "按通行759系年展示获赦后的东还；诗亦有早年出蜀作说。流夜郎之刑不证明已经到达夜郎。", "dateLabel": "通行759 · 另有早年说", "uncertain": true}, {"id": "three-吏", "title": "征役与新安吏", "start": 759, "end": 759, "place": "xinanj", "poets": ["杜甫"], "people": ["杜甫", "史思明"], "kind": "作品", "note": "邺城之败与三吏三别", "poems": ["新安吏", "新婚别", "垂老别", "无家别"], "summary": "邺城之败后的征役压力成为途程诗的背景；具体叙事不等同逐日逐字实录。", "dateLabel": "通行759春", "uncertain": true}, {"id": "shihao", "title": "石壕夜宿与家庭创伤", "start": 759, "end": 759, "place": "shihao", "poets": ["杜甫"], "people": ["杜甫"], "kind": "作品", "note": "邺城之败与三吏三别", "poems": ["石壕吏", "潼关吏"], "summary": "从征募进入一个家庭的夜晚。图示陕州区域，不把文学人物补成可定位的完整户籍。", "dateLabel": "通行759春", "uncertain": true}, {"id": "df-qin", "title": "离华州，转向秦州", "start": 759, "end": 759, "place": "qinzhou", "poets": ["杜甫"], "people": ["杜甫"], "kind": "行旅", "note": "杜甫·年表与争议", "poems": [], "summary": "离职后经秦州、同谷至成都。这里用秦州代表迁徙中的一次停留，具体离职性质保留讨论。", "dateLabel": "759秋冬", "uncertain": true}, {"id": "df-house", "title": "成都草堂：安居与风雨", "start": 760, "end": 761, "place": "chengdu", "poets": ["杜甫"], "people": ["杜甫", "杨氏（杜甫妻）"], "kind": "生活", "note": "杜甫成都草堂与严武幕府", "poems": ["蜀相", "春夜喜雨", "茅屋为秋风所破歌"], "summary": "草堂前期尚未进入764年的严武幕府。喜雨、破屋与关怀他人的表达，处于肃宗朝。", "dateLabel": "760—761", "uncertain": false}, {"id": "gs-shuzhou", "title": "蜀州寄诗：人日忆友", "start": 761, "end": 761, "place": "chengdu", "poets": ["高适", "杜甫"], "people": ["高适", "杜甫"], "kind": "交游", "note": "高适杜甫蜀中交游与人日唱和", "poems": ["人日寄杜二拾遗"], "summary": "以成都周边代表蜀州—草堂交游区域；原赠通行761，与770年杜甫追酬分开。", "dateLabel": "通行761 · 成都周边示意", "uncertain": true}, {"id": "local", "title": "徐知道之乱与梓阆流寓", "start": 762, "end": 763, "place": "zizhou", "poets": ["杜甫", "高适"], "people": ["杜甫", "高适", "严武"], "kind": "政局", "note": "徐知道之乱与杜甫流寓梓阆", "poems": [], "summary": "地方兵乱阻碍返回草堂，杜甫转向梓州、阆州。高适的军政位置与全国战事不能混为同一事件。", "dateLabel": "762—763", "uncertain": false}, {"id": "lb-last", "title": "当涂病中托稿", "start": 761, "end": 762, "place": "dangtu", "poets": ["李白"], "people": ["李白", "李阳冰"], "kind": "生活", "note": "李白当涂晚年与诗集编纂", "poems": [], "summary": "李阳冰序支持病中托稿与文集编纂；不以捞月传说代替材料，不把序的署日当确切卒日。", "dateLabel": "761—762前后", "uncertain": true}, {"id": "victory", "title": "梓州闻捷，想象归乡", "start": 763, "end": 763, "place": "zizhou", "poets": ["杜甫"], "people": ["杜甫", "唐代宗李豫"], "kind": "作品", "note": "安史之乱平定与杜甫闻捷", "poems": ["闻官军收河南河北"], "summary": "国家平乱消息抵达流寓中的诗人。作品的归乡喜悦不表示当即完成返乡行程。", "dateLabel": "通行763春", "uncertain": true}, {"id": "capital", "title": "广德危机：吐蕃入长安", "start": 763, "end": 763, "place": "changan", "poets": ["杜甫", "高适", "岑参"], "people": ["唐代宗李豫", "郭子仪"], "kind": "政局", "note": "宝应继位与广德长安危机", "poems": [], "summary": "同年平乱与新的边防危机并存。是诗人的时代背景，不推定所有诗人都在长安现场。", "dateLabel": "763", "uncertain": false}, {"id": "df-mufu", "title": "返成都，进入严武幕", "start": 764, "end": 765, "place": "chengdu", "poets": ["杜甫"], "people": ["杜甫", "严武", "唐代宗李豫"], "kind": "任职", "note": "杜甫成都草堂与严武幕府", "poems": [], "summary": "节度参谋、检校工部员外郎的阶段晚于草堂早期诗；称号与现职需要分别核对。", "dateLabel": "764—765", "uncertain": false}, {"id": "df-river", "title": "离蜀东下，舟中书怀", "start": 765, "end": 765, "place": "jiaz", "poets": ["杜甫"], "people": ["杜甫", "严武"], "kind": "行旅", "note": "杜甫出蜀与夔州江湘漂泊", "poems": ["旅夜书怀"], "summary": "以岷江东下途程的区域点展示，准确泊舟地点未定，不把作品确定写在嘉州。", "dateLabel": "通行765 · 途程示意", "uncertain": true}, {"id": "cs-jia", "title": "入蜀与嘉州刺史", "start": 766, "end": 769, "place": "jiaz", "poets": ["岑参"], "people": ["杜鸿渐", "唐代宗李豫"], "kind": "任职", "note": "岑参入蜀与嘉州岁月", "poems": [], "summary": "晚年军幕与地方任职相接，“岑嘉州”来自官职。精确先后仍待年谱互校。", "dateLabel": "766起 · 通行767任嘉州", "uncertain": true}, {"id": "df-kui", "title": "夔州客居与秋兴登高", "start": 766, "end": 767, "place": "baidi", "poets": ["杜甫"], "people": ["杜甫"], "kind": "作品", "note": "杜甫出蜀与夔州江湘漂泊", "poems": ["秋兴八首", "登高（杜甫）"], "summary": "作客、多病与长安记忆相互叠合。八首秋兴完整保留，登高不强定为重阳当日。", "dateLabel": "766—767", "uncertain": false}, {"id": "df-yue", "title": "岳阳孤舟与北方军情", "start": 768, "end": 768, "place": "yueyang", "poets": ["杜甫"], "people": ["杜甫"], "kind": "作品", "note": "杜甫出蜀与夔州江湘漂泊", "poems": ["登岳阳楼"], "summary": "壮阔湖景与断信、孤舟相接，抒情中的“独”不等于没有家属或任何帮助。", "dateLabel": "通行768冬", "uncertain": true}, {"id": "df-memory", "title": "湖湘舟居，追酬故友", "start": 770, "end": 770, "place": "hunan", "poets": ["杜甫", "高适"], "people": ["杜甫", "高适"], "kind": "交游", "note": "高适杜甫蜀中交游与人日唱和", "poems": ["追酬故高蜀州人日见寄"], "summary": "杜甫翻检高适旧诗，追酬发生在高适去世之后，图中的高适是追忆对象，不表示770年同游。", "dateLabel": "770正月二十一 · 序明记", "uncertain": false}], "notes": {"岑参·年表与争议": "\n# 岑参·年表与争议\n\n以下年份是阅读坐标，不代表所有节点均有精确日期。\n\n| 时间 | 经历 | 关联笔记 | 确定程度 |\n|---|---|---|---|\n| 约715或717年 | 出生；江陵与南阳分别涉及居地、郡望等问题 | [[岑文本]] | 生年有异说，出生地不作定论 |\n| 744年，另有746年考订 | 进士及第，随后授官 | [[岑参进士及第与初授官]] | 序记天宝三载，现代有五载说 |\n| 749年前后 | 入高仙芝幕，第一次出塞 | [[岑参第一次出塞]] | 通行编年 |\n| 751年前后 | 返回长安 | [[慈恩寺登塔唱和]] | 回程具体行程待细考 |\n| 通常系752年秋 | 与诗友登慈恩寺塔 | [[高适]]、[[杜甫]]、[[薛据]] | 活动有诗证，年份为编年 |\n| 754年前后 | 入封常清幕，赴北庭 | [[岑参第二次出塞]] | 通行编年 |\n| 755—763年 | 安史之乱；岑参东归并任中央官职 | [[安史之乱与岑参东归]] | 战乱范围明确，个人节点另核 |\n| 757年前后 | 常见编年系右补阙任职于此 | [[寄左省杜拾遗]] | 部分传记作左补阙，需辨 |\n| 766年前后 | 入蜀，参与杜鸿渐幕府 | [[杜鸿渐]] | 通行编年 |\n| 常系767年前后 | 任嘉州刺史 | [[岑参入蜀与嘉州岁月]] | 文献叙次不尽相同 |\n| 约769或770年 | 卒于蜀地，通常称成都 | [[岑嘉州集的编纂与流传]] | 卒年与末段行程有争议 |\n\n## 需要保留的差异\n\n- **生卒**：教学资料多用约715—770；搜韵引辞典同时列717—770、715—769等说。\n- **及第**：杜确序记天宝三载，现代辞典有校作五载的意见。不能把两种日期混写成一条无争议事实。\n- **补阙左右**：序及《全唐诗》小传作右补阙，部分后世传记作左补阙。本专题通常采用右补阙，并保留异说。\n- **蜀中官职顺序**：序、后出传记、现代编年有差异，暂不逐月排出任职表。\n\n年龄不宜简单用争议生年逐项计算。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [《唐才子传》卷3·岑参](https://zh.wikisource.org/wiki/唐才子傳/卷3)\n", "潼关失守与玄宗入蜀": "\n# 潼关失守与玄宗入蜀\n\n## 两个军事阶段\n\n755年末，[[高仙芝]]、[[封常清]]退守潼关后被处死。此后[[哥舒翰]]主持关防；756年奉催促出关作战而失利，关门失守，玄宗离长安入蜀。高适曾佐哥舒翰守关，败后赴玄宗行在陈说军务，见《旧唐书》卷111。\n\n## 对三位诗人的不同影响\n\n- [[高适]]：由幕僚进入朝廷谏议与军政任职。\n- [[杜甫]]：安置妻儿后赴肃宗行在，途中被俘，后来困居长安，见[[长安陷落与杜甫困居]]。\n- 岑参：所依边地军政网络发生变化，后东归，见[[安史之乱与岑参东归]]。\n\n## 作品回看\n\n759年前后的[[潼关吏]]以“慎勿学哥舒”追论756年的失败，不能把诗的写作时间也改成756年。“百万化为鱼”是文学夸张，史书具体兵额与伤亡需要另校。\n\n此页不将所有失败都归于一人，也不把玄宗与肃宗的行在混成一处。\n\n## 来源与核查\n\n- [《旧唐书》卷104](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "追酬故高蜀州人日见寄": "\n# 追酬故高蜀州人日见寄\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n### 序\n\n开文书帙中，检所遗忘，因得故高常侍往居在成都时高任蜀州刺史人日相忆见寄诗，泪洒行间，读终篇末。自枉诗已十余年，计存没又六七年矣。老病怀旧，生意可知。今海内忘形故人，独汉中王瑀与昭州敬使君超先在，爱而不见，情见乎词。大历五年正月二十一日，追酬高公此作，因寄王及敬弟。\n\n### 诗\n\n自枉蜀州人日作，不意清诗久零落。\n今晨散帙眼忽开，迸泪幽吟事如昨。\n呜呼壮士多慷慨，合沓高名动寥廓。\n叹我凄凄求友篇，感时郁郁匡君略。\n锦里春光空烂漫，瑶池侍臣已冥寞。\n潇湘水国傍鼋鼍，鄠杜秋天失雕鹗。\n东西南北更堪论，白首扁舟病独存。\n遥拱北辰缠寇盗，欲倾东海洗乾坤。\n边塞西蕃正充斥，衣冠南渡多崩奔。\n鼓瑟至今悲帝子，曳裾何处觅王门。\n文章曹植波澜阔，服食刘安德业尊。\n长笛谁能乱愁思，昭州词翰与招魂。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 770年（大历五年）农历正月二十一日，序明记，日期依据强；原赠诗的倒推年代另有问题。 |\n| 地点 | 湘江流域舟居背景；精确停泊点未定。 |\n| 当时官职 | 无现任实职，高适已去世。 |\n| 生活处境 | 老病漂泊，偶得旧诗，故友凋零。 |\n| 交游与写作对象 | 追忆[[高适]]，并寄汉中王李瑀与敬超先；序中“独”是怀旧表达，不是全体朋友存亡统计。 |\n| 历史事件 | [[高适杜甫蜀中交游与人日唱和]]延伸到晚年；仍有边患与南渡。 |\n\n## 结合处境读诗（整理者解读）\n\n翻检旧书使时间突然叠合：眼前是舟中老病，诗中又回到成都春光。高适的赠诗并不只是文学遗物，也是被关怀过的证据。由“慷慨”到“冥寞”，作品让故友的政治抱负与自身失依并在一起。\n\n“招魂”连接悼友与向存友索取词翰的愿望。序称“十余年”“六七年”，与通常采用的761年原赠、765年高适卒年并非严格相扣，因此年表不能把这些约数直接转换成确定年款。\n\n## 版本与辨析\n\n本页据《岁时杂咏》卷五录文收序及全诗，断句为整理者所加。《杜甫集》另一线上录文有“自蒙／自枉”“瑶墀／瑶池”“最充斥／正充斥”等异文，本页依《岁时杂咏》保持一套正文，不混拼版本。古籍“高常侍”是高适后来的官称，“高蜀州”指其先前地方任官。诗中曹植、刘安属典故，不是现实友人。\n\n## 来源与核查\n\n- [《杜甫集》追酬诗与序（异文对读）](https://www.shidianguji.com/book/SBCK133/chapter/SBCK133_131)\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/歲時雜詠_(四庫全書本)/卷05)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "张守珪": "\n# 张守珪\n\n唐代边镇将领，长期参与东北对奚、契丹的战争，曾任幽州节度使、兼御史大夫。高适[[燕歌行]]序的“御史大夫张公”（一作“元戎”）通常指他。\n\n## 与诗的关系及争议\n\n序能证明来客从张公军中出塞归来，不能证明张守珪本人给高适送诗。旧说多将诗对应到738年部将战败、主帅隐瞒败绩；亦有注家把讽刺重心放在部将。黄清发2026年论文摘要据墓志确认元戎为张守珪，同时反对把诗本事简单限定为隐败冒功。本页不把一种解释宣布为唯一结论。\n\n## 与后来的安史之乱\n\n安禄山曾在其麾下，这是军职关系；不能因后来安禄山反叛，就认定开元时期每首边塞诗已在预言安史之乱。\n\n关联：[[开元东北边事与燕歌行]]、[[高适·年表与争议]]。\n\n## 来源与核查\n\n- [《旧唐书》卷103·张守珪](https://zh.wikisource.org/wiki/舊唐書/卷103)\n- [《燕歌行》序与诗](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [黄清发研究摘要](https://www.nlc.cn/pcab/zx/xw/20260119_2650720.shtml)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "秋兴八首": "\n# 秋兴八首\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n### 其一\n\n玉露凋伤枫树林，巫山巫峡气萧森。\n江间波浪兼天涌，塞上风云接地阴。\n丛菊两开他日泪，孤舟一系故园心。\n寒衣处处催刀尺，白帝城高急暮砧。\n\n### 其二\n\n夔府孤城落日斜，每依北斗望京华。\n听猿实下三声泪，奉使虚随八月槎。\n画省香炉违伏枕，山楼粉堞隐悲笳。\n请看石上藤萝月，已映洲前芦荻花。\n\n### 其三\n\n千家山郭静朝晖，日日江楼坐翠微。\n信宿渔人还泛泛，清秋燕子故飞飞。\n匡衡抗疏功名薄，刘向传经心事违。\n同学少年多不贱，五陵裘马自轻肥。\n\n### 其四\n\n闻道长安似弈棋，百年世事不胜悲。\n王侯第宅皆新主，文武衣冠异昔时。\n直北关山金鼓振，征西车马羽书驰。\n鱼龙寂寞秋江冷，故国平居有所思。\n\n### 其五\n\n蓬莱宫阙对南山，承露金茎霄汉间。\n西望瑶池降王母，东来紫气满函关。\n云移雉尾开宫扇，日绕龙鳞识圣颜。\n一卧沧江惊岁晚，几回青琐点朝班。\n\n### 其六\n\n瞿塘峡口曲江头，万里风烟接素秋。\n花萼夹城通御气，芙蓉小苑入边愁。\n珠帘绣柱围黄鹄，锦缆牙樯起白鸥。\n回首可怜歌舞地，秦中自古帝王州。\n\n### 其七\n\n昆明池水汉时功，武帝旌旗在眼中。\n织女机丝虚夜月，石鲸鳞甲动秋风。\n波漂菰米沉云黑，露冷莲房坠粉红。\n关塞极天惟鸟道，江湖满地一渔翁。\n\n### 其八\n\n昆吾御宿自逶迤，紫阁峰阴入渼陂。\n香稻啄余鹦鹉粒，碧梧栖老凤凰枝。\n佳人拾翠春相问，仙侣同舟晚更移。\n彩笔昔曾干气象，白头吟望苦低垂。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系766年秋（大历元年）；八首整体采用通行系年，不能据每首景物逐一推定日程。 |\n| 地点 | 夔州；长安、曲江、昆明池、渼陂等多属记忆与想象空间。 |\n| 当时官职 | 无现任实职；诗里朝班和画省回望此前朝廷经历。 |\n| 生活处境 | 病中客居，归乡意愿受阻，仍关注乱后政治。 |\n| 交游与写作对象 | 未具名的同学少年与旧游同伴；匡衡、刘向属自况典故。 |\n| 历史事件 | [[杜甫出蜀与夔州江湘漂泊]]；两京秩序与边防未完全恢复。 |\n\n## 结合处境读诗（整理者解读）\n\n其一以夔州秋景与捣衣声开启故园之思；其二从孤城望京华，把病卧和离开官署相连；其三对照同辈显达，写自身抗疏与学术志愿不遂；其四用弈棋写京城权势更替与持续军情。\n\n其五重现宫阙朝班，在瑰丽的朝廷记忆里埋入“一卧沧江”的晚景；其六直接并置瞿塘和曲江，把万里距离收进一联；其七从汉代昆明池的帝国经营转到“江湖满地一渔翁”的自身位置；其八追忆渼陂等长安旧游，以彩笔与白头的反差结束。\n\n八首并非八次旅游记录，而是夔州眼前秋景反复触发长安记忆。第六至八首应与早年的[[同诸公登慈恩寺塔（杜甫）]]对读：皇州曾可登高眺望，现在只能在记忆中回访。组诗的情绪同时包含眷恋、失落与政治忧虑，不是简单赞颂过去的繁华。\n\n## 版本与辨析\n\n完整收八首，不以其一代替组诗。其二本页取通行“北斗”，线上《全唐诗》录文作“南斗”并注一作“北”；“两开”“不胜悲”“香稻啄余”等均有异文。典故与真实宫苑要区分，王母不是杜甫现实交游人物。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/秋興八首)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "宝应继位与广德长安危机": "\n# 宝应继位与广德长安危机\n\n## 762：继位\n\n[[唐代宗李豫]]在肃宗去世后继位，宝应年号跨接两朝。皇帝变化与[[李白当涂晚年与诗集编纂]]的年代相近，但不能因此补写两人直接接触。\n\n## 763：两种不同的“结束”\n\n安史之乱结束，[[闻官军收河南河北]]写[[杜甫]]闻捷后的归乡想象；同年广德时期，吐蕃进入长安，代宗出奔陕州，随后朝廷收复京城。这说明平叛不等于边防与政治环境全面安定。\n\n[[郭子仪]]连接军事应对；蜀中局势连接[[徐知道之乱与杜甫流寓梓阆]]以及[[严武]]后来的任职。不同地区事件互相关联，但没有证据时不直接合并成一个因果链。\n\n## 晚年阅读方向\n\n[[杜甫出蜀与夔州江湘漂泊]]、[[岑参入蜀与嘉州岁月]]显示诗人的具体生活继续变动。将个人漂泊放到战后军事环境中，有助于理解诗意，仍须保留作品各自作年。\n\n## 来源\n\n- [《旧唐书》卷11](https://zh.wikisource.org/wiki/舊唐書/卷11)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "王维": "\n# 王维\n\n王维，字摩诘，通行纪年701—761；生年另有699、700等说。本页采用通行年线，涉及精确年龄时保留差异。世称王右丞，指晚年官至尚书右丞，不代表他写每一首诗时都任此职。\n\n## 从音乐官到谏官、边地使者\n\n开元年间登进士第，通行系721年，初授太乐丞，后因事贬为济州司仓参军。其后受到[[张九龄]]赏识，任右拾遗、监察御史。737年前后出使河西并参与幕府事务，作品[[使至塞上]]把朝廷差遣、孤独感和边地景象放在一起。实际行程与诗中汉代地名、典故不能逐点硬对。\n\n## 交游与辋川\n\n王维与[[孟浩然]]交好，《新唐书》还有为孟画像、题孟浩然亭的记载。“王孟”是后世诗史中的并称，不是两人组成了有章程的流派。与[[裴迪]]的辋川唱和有《辋川集》序及诗作支持。详见[[王维辋川生活与陷贼受官]]。辋川在京畿蓝田，别业生活与任官有交叠，不宜把所有山水诗理解为辞官之后。\n\n[[送元二使安西]]则以渭城送友联到西域差遣，和[[岑参第一次出塞]]、[[岑参第二次出塞]]可以对读；王维和元二在渭城送别，并不等于王维同赴安西。\n\n## 安史之乱中的被俘与审查\n\n756年两京危局中被叛军捕获、押往洛阳并受伪职。史传记他服药、佯喑以逃避，并作凝碧池诗悲悼。757年收复两京后仍被审查，因诗与弟王缙求情等因素从轻处理，后来官至尚书右丞。这段经历不能略去，也不能只按“忠臣／叛臣”标签消除当时的强制处境。\n\n他信佛，善诗、书、画；“诗佛”“南宗画祖”是后世评价。现存署名画卷是否为真迹须另作艺术史鉴定，不能因为署名就当作唐代原作。\n\n## 来源与核查\n\n- [《旧唐书》王维传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》王维传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [历代人名资料中的生年分歧](https://hhl.cnkgraph.com/Poem/唐朝/王維/18616)\n- [《辋川集》](https://zh.wikisource.org/wiki/輞川集_(王維))\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "李白孟浩然交游与江汉送别": "\n# 李白孟浩然交游与江汉送别\n\n## 诗歌可以确证的友谊\n\n[[李白]]的[[赠孟浩然]]直称敬爱孟夫子，[[黄鹤楼送孟浩然之广陵]]明记送友东下。[[孟浩然]]的襄阳生活与吴越漫游，使两人有江汉交往的空间条件；这比后世补出的带信约见、连续住宿几天等细节更可核查。\n\n## 年长友人与诗中形象\n\n按通行纪年孟比李年长十二岁。“红颜弃轩冕”是李白为朋友建立的高士形象；与孟实际应举、干谒、入张九龄幕府合读，便见赞美修辞和复杂人生的区别。不能只拿这句诗证明孟从未求仕。\n\n## 时间与路线的边界\n\n相识与送别常系727、728、730等不同阶段，送别诗也有737等系年。《黄鹤楼》题目与诗句能确认江夏方向的楼台、三月、广陵目的地，不能自行确认公历某日。两人都卒于不同阶段，孟在740年、李在762年，故永王事件中不可能再有孟浩然参与。\n\n## 来源与核查\n\n- [李白赠孟诗](https://zh.wikisource.org/wiki/贈孟浩然)\n- [黄鹤楼送别诗](https://zh.wikisource.org/wiki/黃鶴樓送孟浩然之廣陵)\n- [刘逸生送别诗散考转载，保留不同编年](https://m.mokecn.com/guoxue/info_12942.html)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "贺知章": "\n# 贺知章\n\n贺知章（约659—744，通行纪年），字季真，越州永兴人，晚年自号四明狂客。长期在朝任职，曾任礼部侍郎、太子宾客、秘书监等，故李白称“贺监”。礼部尚书为身后追赠，不宜笼统前移成其在世最终实任。\n\n## 朝廷里的诗人、书家与年长知己\n\n贺知章的旷达建立在数十年的仕宦与声望上。他对[[李白]]的激赏有李白[[对酒忆贺监二首]]及序直接支持，诗序记紫极宫相见、呼为谪仙、金龟换酒。至于“初到长安立刻呈《蜀道难》”的完整情节，需与《本事诗》等较晚笔记区别；见[[李白翰林供奉与赐金放还]]、[[李白事迹中的史料与传说]]。\n\n## 荣归故里与人事变化\n\n744年通行归乡年，朝廷以诗送行、准其为道士，并赐镜湖一曲。[[回乡偶书二首]]的“被儿童视为客人”和故旧半消磨，使荣归的社会地位与个人的迟暮感同时显现。具体辞归奏请在史书中有天宝二年末的记载，不能把奏请、离京、归乡写成同一天；见[[贺知章归乡与李白追忆]]。\n\n他并非民间想象中只喝酒的老人；修书、东宫职务、书法与诗友声望共同构成其事迹。“金龟换酒”也不必补出忘带酒钱、店主对话等原序没有的细节。\n\n## 来源与核查\n\n- [《新唐书》贺知章传](https://zh.wikisource.org/wiki/新唐書/卷196)\n- [《旧唐书》玄宗纪：奏请与送行](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [李白纪念诗](https://zh.wikisource.org/wiki/對酒憶賀監_(四明有狂客))\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "将进酒（李白）": "\n# 将进酒（李白）\n\n作者：[[李白]]。\n\n## 完整原文\n\n君不见，黄河之水天上来，奔流到海不复回！\n君不见，高堂明镜悲白发，朝如青丝暮成雪！\n人生得意须尽欢，莫使金樽空对月。\n天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。\n岑夫子，丹丘生，将进酒，杯莫停。\n与君歌一曲，请君为我倾耳听。\n钟鼓馔玉不足贵，但愿长醉不复醒。\n古来圣贤皆寂寞，惟有饮者留其名。\n陈王昔时宴平乐，斗酒十千恣欢谑。\n主人何为言少钱，径须沽取对君酌。\n五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 有736、752等说，未定 |\n| 地点 | 常联系嵩山颍阳一带元丹丘山居，具体宴饮地点仍需考订 |\n| 官职 | 不能因752说就当成在任官员；736说则早于翰林 |\n| 生活处境 | 宴饮中的自负、惜时与愁苦；具体贫富状况不由千金夸语反推 |\n| 交游 | [[岑勋]]、[[元丹丘]] |\n| 历史事件 | 736说与752说对应不同人生阶段，见[[李白·年表与争议]] |\n\n## 结合处境解读\n\n点名劝酒把宏大的黄河、白发感慨落回朋友之间。陈王即曹植，借古人的才与不遇表达不平；末尾“万古愁”使欢饮没有真正消灭忧愁。\n\n理解此诗不能只按“被逐后借酒浇愁”的单一传记公式。若取736系年，宫廷挫折尚未发生；若取752，也须承认文学表达不是当天心情的逐字记录。\n\n## 系年、异文与证据边界\n\n“天生我材必有用”“古来圣贤皆寂寞”等与敦煌《惜罇空》录文有重要异文，本页用通行《全唐诗》正文，不说成唯一原貌。“岑夫子”通行指岑勋，不是岑参。系年分歧参见现代校注资料。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/將進酒_(李白))\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n系年对读：[736与752两说及校注书目](https://www.gushiwen.cn/mingju/juv_adada191ca2c.aspx)。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "岑参·人生故事": "\n# 岑参·人生故事\n\n## 一、家族的名望，未能替他安排好前途\n\n岑参的家族有显赫的文官传统，[[岑文本]]曾在唐太宗朝参与中枢政务。到了岑参的早年，家境已经困顿。杜确的序将他描述为早岁孤贫、勤学的人。名门后裔与现实贫困并存，是理解他求仕愿望的起点。\n\n他读书、求仕，也亲近山林。这两种生活并不互相排斥：山水提供安顿之所，官职则提供生计和施展能力的机会。在《初授官题高冠草堂》里，他写到微官与归隐之间的牵扯。这里读到的是诗人对自己的表达，不能据此虚构童年对白或具体遭遇。详见[[岑参进士及第与初授官]]。\n\n## 二、离开长安：文章成为远行的本领\n\n约749年，岑参进入[[高仙芝]]的幕府，开始[[岑参第一次出塞]]。他是处理文字与公务的幕僚，不宜把他写成亲自冲锋的骑兵将军。军中需要书奏、公文与筹划，文才由此成为进入边地政治生活的能力。\n\n西去的道路使他感受到空间的辽阔，也拉长了与家人的距离。[[逢入京使]]抓住一次马上相逢：没有纸笔，仍想让归京的人捎去平安。诗中的深情并不削弱远行的抱负，反而让“出塞”不只是抽象的报国口号。\n\n## 三、回到长安：与朋友站在同一座高塔上\n\n第一次出塞后，他回到长安。通常系于752年秋的[[慈恩寺登塔唱和]]，让[[高适]]、[[杜甫]]与岑参的人生相接；岑参诗题也直接提到[[薛据]]。\n\n登塔看似一次游览，却为理解诗人提供了一个横向切面：有人关注高处的奇观，有人从俯瞰中看见政治与世事。共同到场不意味着观点相同；“高岑”这个文学史称呼，也不能抹去高适与岑参的各自经历。\n\n## 四、再次西行：雄奇景物中，也有送别和乡愁\n\n754年前后，他又进入[[封常清]]的幕府，开始[[岑参第二次出塞]]。风、雪、砂石、马匹、军帐和音乐，成为他诗中的具体材料。\n\n[[走马川行奉送封大夫出师西征]]将恶劣环境写成军队行动的张力；[[白雪歌送武判官归京]]则把视线从漫天飞雪逐渐收束到一个离去的人。[[武判官]]的身影消失后，雪上的马迹还在。这是诗歌结构产生的情感效果，不能改写为已经核实的现场录像。\n\n## 五、国家的裂变，改变了他的去向\n\n755年爆发的安史之乱打断了原有的政治秩序。高仙芝、封常清在平乱初期被朝廷处死，两个曾经托付他文才的主帅都退出了历史舞台。这里可以确认的是政治背景；现有材料不足以写出岑参收到消息时的确切反应。\n\n岑参后来东归，进入谏官等中央职位。[[杜甫]]与他的联系既有荐举传统记载，也有[[寄左省杜拾遗]]这类作品证据。诗中朝廷生活的描写，和谏官应当进言的职责形成值得细读的张力。官职左右称谓有材料差异，见[[岑参·年表与争议]]与[[唐代幕府与谏官]]。\n\n## 六、嘉州与蜀地：远行没有换来安稳的结局\n\n766年前后，岑参入蜀，与[[杜鸿渐]]的幕府发生联系，后来任嘉州刺史。因此后人称他“岑嘉州”。[[岑参入蜀与嘉州岁月]]里，军幕和朝廷不再是唯一背景，地方生活、山水和归路也进入诗篇。\n\n他最终卒于蜀地，通行生平多写客死成都，确切卒年与地点细节仍有讨论。因此这份故事不编写旅店、病床或临终遗言。\n\n## 七、人生停止，作品仍在前行\n\n[[杜确]]在岑参去世多年后受其子所托整理遗文，编成八卷。[[岑嘉州集的编纂与流传]]使个人生命连接到另一种时间：整理、抄写、刊刻和阅读的时间。\n\n**整理者的理解**：岑参的动人之处，在于抱负与脆弱同时存在。他可以把边塞写得壮阔，也会在远行途中急切地报平安；他曾追求仕途，却不断把目光投向山水与归路。这一解释来自作品与经历的对读，不是对他内心的确定诊断。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n- [《全唐诗》卷201](https://zh.wikisource.org/wiki/全唐詩/卷201)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [《旧唐书》卷104·高仙芝、封常清](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [《寄左省杜拾遗》原文](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n", "岑参第一次出塞": "\n# 岑参第一次出塞\n\n## 事件概要\n\n通常系于749年，岑参进入[[高仙芝]]幕府任掌书记，西行至安西等地，约751年前后返回长安。具体往返节点仍需编年材料细核。\n\n## 为什么重要\n\n出塞把文学能力接入军事行政，也使诗人接触长途行旅、边城与军幕。[[逢入京使]]可作为理解乡愁的入口，但作品并不能提供完整逐日路线。\n\n## 不作的推断\n\n岑参属于高仙芝幕府，不等于确认他参加怛罗斯战役；本轮未找到足以确定他亲临该战场的证据。\n\n## 后续与关联\n\n返回长安后，交游活动连接[[慈恩寺登塔唱和]]；再次进入边地则见[[岑参第二次出塞]]。空间入口为[[岑参的行旅地点]]。\n\n## 来源与核查\n\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [《全唐诗》卷201](https://zh.wikisource.org/wiki/全唐詩/卷201)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "春晓（孟浩然）": "\n# 春晓（孟浩然）\n\n作者：[[孟浩然]]。\n\n## 完整原文\n\n春眠不觉晓，处处闻啼鸟。\n夜来风雨声，花落知多少。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 未定 |\n| 地点 | 春晨居处；通常联系襄阳生活，但不能据四句确定位于鹿门某屋 |\n| 官职 | 无据指定当时官职 |\n| 生活处境 | 醒来由鸟声联想到夜间风雨与落花 |\n| 交游 | 无明示现实交游对象 |\n| 历史事件 | 日常惜春，非战乱事件的直接纪实 |\n\n## 结合处境解读\n\n诗的展开由听觉走向对未见之物的想象：醒时听鸟，忆起夜雨，才问花落。它没有把庭院花瓣逐一写成目击，末句留下温柔的不确定感。\n\n将此诗放回孟浩然的生活世界有助于理解，但“落第后第二天作”“晚年病中作”等精确情节需要文献，不能仅由惜春推出。\n\n## 系年、异文与证据边界\n\n《文苑英华》有“欲知昨夜风”异文，本页采用通行“夜来风雨声”。未定年、未定作地是有效信息，不用故事补齐。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/春曉_(孟浩然))\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "开元东北边事与燕歌行": "\n# 开元东北边事与燕歌行\n\n## 时间与范围\n\n开元年间，唐朝在东北与奚、契丹之间反复作战；[[张守珪]]统领幽州军镇，部将中有安禄山。高适[[燕歌行]]序明记738年，但一首诗不等于某一次军事行动的全记录。\n\n## 三种不能混同的判断\n\n1. 序中军镇长官是谁：通常指张守珪，墓志研究强化这一对应。\n2. 诗是否包含对轻敌与军中苦乐不均的批评：从诗句可见。\n3. 是否专刺738年隐瞒败绩，以及每句分别刺谁：解释仍需辨析，不能从前两项直接推出。\n\n## 接入诗歌网络\n\n与[[兵车行]]对读可看出边地风险如何转化成士卒家庭和生产的负担；与岑参出师送行诗对读，则要注意不同写作场合。不得称高适738年已在哥舒翰幕，那个职业阶段在十余年后。\n\n关联：[[高适]]、[[高适·年表与争议]]。\n\n## 来源与核查\n\n- [《旧唐书》卷103](https://zh.wikisource.org/wiki/舊唐書/卷103)\n- [《燕歌行》](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [2026年研究摘要](https://www.nlc.cn/pcab/zx/xw/20260119_2650720.shtml)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "杜甫成都草堂与严武幕府": "\n# 杜甫成都草堂与严武幕府\n\n## 759—765年的分段生活\n\n759年末到成都，760年在浣花溪一带营建草堂。亲友的支持帮助他暂时安居，但不能把全部建屋费用归给某一人。[[高适]]与他保持蜀中交往；[[人日寄杜二拾遗]]提供直接材料。\n\n761年前后[[春夜喜雨]]与[[茅屋为秋风所破歌]]同出于草堂生活：一首写春雨生长，一首写秋风破屋，安居与脆弱并存。初到成都的[[蜀相]]借[[诸葛亮]]寄托未竟功业之感。\n\n严武761年末起镇蜀，762年离任；[[徐知道之乱与杜甫流寓梓阆]]使杜甫无法立即返回成都。764年严武再镇成都后，杜甫返草堂并入幕，任节度参谋、检校工部员外郎。检校是官衔性质，不能据此认作长期在长安工部实际办公。\n\n765年严武卒，杜甫离成都，经岷江、长江东下，转入[[杜甫出蜀与夔州江湘漂泊]]。\n\n## 读诗与读官职\n\n“杜工部”是后世常用称号，不能前移到所有草堂诗创作时。草堂不是与政治完全隔绝的桃源，仍受地方兵乱、家庭经济与幕府关系影响。\n\n关联：[[严武]]、[[岑参入蜀与嘉州岁月]]、[[唐代幕府与谏官]]。\n\n## 来源与核查\n\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [《旧唐书》卷117](https://zh.wikisource.org/wiki/舊唐書/卷117)\n- [《人日寄杜二拾遗》](https://zh.wikisource.org/wiki/全唐詩/卷213)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "使至塞上": "\n# 使至塞上\n\n作者：[[王维]]。\n\n## 完整原文\n\n单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 通行系737，具体出使及入幕阶段有不同解释 |\n| 地点 | 河西出使语境；居延、萧关、燕然不能直接连成已验证全路线 |\n| 官职 | 监察御史出使及河西幕府经历相关；非晚年尚书右丞 |\n| 生活处境 | 奉命出行，与京城政治关系和边地孤独可合读 |\n| 交游 | 军中使者、候骑；不补与岑参同年同游 |\n| 历史事件 | 乱前河西边政，与[[岑参第一次出塞]]相隔十余年 |\n\n## 结合处境解读\n\n征蓬、归雁使使者身份带上孤单感，随后大漠、长河、烟与落日又展开极简而雄阔的构图。公务与个人体验并在，不只是没有情绪的边疆写生。\n\n诗中“属国”“燕然”等含汉代名物与典故，“都护在燕然”不等于王维本人已到蒙古燕然山。长河具体指哪一水系、孤烟为何物有异说。\n\n## 系年、异文与证据边界\n\n候骑是侦察骑兵，“候”不误写“侯”。737通行，不以全诗逐点复原地图；创作官职和河西任职先后保留边界。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/使至塞上)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "徐知道之乱与杜甫流寓梓阆": "\n# 徐知道之乱与杜甫流寓梓阆\n\n## 762年的转折\n\n严武离蜀回朝，杜甫送行至绵州一带。成都少尹、剑南兵马使徐知道发动兵乱，使杜甫返回草堂的计划受阻，随后辗转梓州、阆州。高适参与平定相关动乱并任剑南西川节度使。\n\n## 763年的作品地点\n\n杜甫[[闻官军收河南河北]]通常作于梓州，不能因提到家属、诗书就把地点改成成都草堂。国家平叛消息与蜀地尚不完全安定的生活同时存在，喜欲归乡也不等于当即离蜀。\n\n## 回草堂与政治环境\n\n764年严武再任，杜甫才返成都并入幕。地方兵乱也显示安史之乱的全国余波不能仅以两京收复是否完成判断。\n\n关联：[[杜甫成都草堂与严武幕府]]、[[高适]]、[[严武]]、[[安史之乱平定与杜甫闻捷]]。\n\n系年与史传分歧：关于严武离任与徐知道作乱，《资治通鉴》把严武任命系762年，钱谦益等据杜诗指出时间错置；本页采用通常的761年末镇蜀、762年离任坐标，并保留争议。高适平乱与徐知道被部将杀死不是互斥的描述，也不可混同为高适亲手诛杀。\n\n核查边界：杜甫逐日路线、每场地方战斗的兵额，本页未展开；不能把后来的崔旰之乱和徐知道之乱合成同一事件。\n\n## 来源与核查\n\n- [史书系年与杜诗订正线索（仅用来定位注释）](https://zh.wikipedia.org/wiki/徐知道)\n- [陈乐保：西川节度使继任危机研究的线上文章](https://history.ifeng.com/c/7xisuOZRZQt)\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《旧唐书》卷117](https://zh.wikisource.org/wiki/舊唐書/卷117)\n- [《中国通史》杜甫章节的线上录文](https://szzy.7lue.cn/read/8041cf2059c4a25e1657faa59107128d/0d93f594154351f34ada824c2ccbc8d2.md)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "高适": "\n# 高适\n\n盛唐诗人，也有军幕和地方军政任职经历，与岑参并称“高岑”。字达夫，渤海人，出生年存在不同考订；本页不固定生年。\n\n## 人生与作品\n\n他曾任封丘尉，后来进入河西军幕；安史之乱及其后的政治环境中，又参与军政事务。《燕歌行》《别董大》是认识其诗歌的常见入口。文学成就与现实官职需要分别理解，不能因为会写边塞诗就预设所有战争都曾亲历。\n\n## 与岑参的联系\n\n[[慈恩寺登塔唱和]]及岑参的登塔诗题提供了共同活动证据。并称“高岑”是后世文学概括，不是两人共同创办流派的记录。\n\n## 对读建议（整理者解读）\n\n可以用高适《燕歌行》中对军中苦乐差异的关注，对读[[走马川行奉送封大夫出师西征]]的行动感与奇景。不同作品有不同目的，不能由两首诗直接给两位作者贴永久标签。\n\n关联：[[杜甫]]、[[岑参·人物事件关系图]]。\n\n## 来源与核查\n\n- [《旧唐书》卷111·高适](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n\n\n## 扩展：生平阶段与完整作品\n\n从[[高适·年表与争议]]进入，作品完整原文见[[燕歌行]]、[[别董大二首]]、[[封丘作]]、[[除夜作（高适）]]、[[同诸公登慈恩寺浮图（高适）]]、[[人日寄杜二拾遗]]。\n\n他的仕途不能从后来的显达倒写：738年《燕歌行》尚在布衣阶段；封丘尉时期感到基层催迫与礼仪压力，后来进入[[哥舒翰]]幕府；[[潼关失守与玄宗入蜀]]与[[永王事件与高适李白分途]]把他推入中央和地方军政；蜀中寄友诗则保留有官仍忧国、对杜甫漂泊感到歉疚的另一面。\n\n新人物入口：[[张守珪]]、[[董庭兰]]、[[哥舒翰]]、[[李白]]。与杜甫从乱前同游到乱后寄赠、亡后追酬的证据链，见[[梁宋交游与李杜高同游]]、[[高适杜甫蜀中交游与人日唱和]]。\n\n总阅读地图：[[高适与杜甫·作品与时代知识地图]]。新增部分保留生年、入幕年、除夜诗系年等争议；没有把后来的常侍、节度使官职前移到早年诗歌。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "李白事迹中的史料与传说": "\n# 李白事迹中的史料与传说\n\n## 先问故事是谁记下的\n\n| 常见故事 | 材料层级 | 本专题如何收录 |\n|---|---|---|\n| 谪仙称许、金龟换酒 | 李白《对酒忆贺监》序和诗有自述 | 保留核心交往；不补酒钱、对话和座次 |\n| 高力士脱靴、杨妃阻官 | 两《唐书》及笔记叙述 | 注明史传记载；不据此确定离京全部原因 |\n| 郭子仪救李白，以报当年救命 | 《新唐书》有载，具体年代与仕历需互校 | 作为有争议记载，不将报恩闭环写成确证 |\n| 铁杵磨针 | 常追溯宋代地理志及地方传说，非李白自述 | 说明后世劝学故事性质，不列入确定童年年表 |\n| 醉中捞月而溺死 | 后世传奇 | 不替代李阳冰序所见病中托稿与当涂晚年 |\n| 与所有盛唐名家一次齐聚 | 常见文艺作品拼接 | 必须逐条诗题、诗序、年谱验证，不由关系网络推出同席 |\n\n## 三类材料各有用途\n\n[[李阳冰]]序接近晚年当事人，但带有尊亲颂扬的立场；两《唐书》距李白时代较远，又有叙事次序矛盾；诗作最接近本人声音，却有拟古、夸张与自我塑造。三者宜互证，不把任一类当成无条件准确的传记。\n\n[[蜀道难（李白）]]被解释为讽严武逼迫杜甫，但《河岳英灵集》在严武后来的蜀中经历之前已收此诗，此说存在年代障碍。[[将进酒（李白）]]“岑夫子”是[[岑勋]]，不应误写成[[岑参·人生故事]]里的岑参。\n\n## 与现有史料方法连接\n\n本页是[[岑参·史料来源与阅读方法]]的李白补充。文学传奇可以另行欣赏，录入生平时则标明“自述”“史传载”“晚出传说”“尚有争议”。\n\n## 来源与核查\n\n- [《旧唐书》李白传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [李阳冰序](https://www.xuges.com/mj/l/libai/072.htm)\n- [铁杵故事材料追索：《方舆胜览》](https://zh.wikisource.org/wiki/方輿勝覽)\n- [《河岳英灵集》李白诗](https://zh.wikisource.org/wiki/河嶽英靈集)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "别董大二首": "\n# 别董大二首\n\n作者：[[高适]]。年表：[[高适·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n### 其一\n\n千里黄云白日曛，北风吹雁雪纷纷。\n莫愁前路无知己，天下谁人不识君。\n\n### 其二\n\n六翮飘飖私自怜，一离京洛十余年。\n丈夫贫贱应未足，今日相逢无酒钱。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系于747年（天宝六载）冬，属后人编年，诗题未署年。 |\n| 地点 | 通行说为睢阳（今河南商丘一带）；原诗只写风雪送别，城址来自编年。 |\n| 当时官职 | 未任封丘尉。 |\n| 生活处境 | 诗中“无酒钱”写共同贫困，不能只凭首篇鼓励就认定作者仕途得意。 |\n| 交游与写作对象 | [[董庭兰]]通常被认为是“董大”；“大”是排行称谓。 |\n| 历史事件 | [[梁宋交游与李杜高同游]]的求仕与游历背景；不可与757年的政治案件倒置。 |\n\n## 结合处境读诗（整理者解读）\n\n第一首先把日光、雁群和风雪写得黯淡，再用两句劝慰撑开前路。第二首把“天下谁人不识君”的声名和“无酒钱”的生计并列，说明友人的名望并不等于生活保障。两首合读，豪迈就有了困顿中的分量。\n\n送别发生在高适尚未显达时。把董庭兰后来牵涉[[房琯]]罢相的事情，直接写成747年送别的原因，会造成十年左右的年代错置。\n\n## 版本与辨析\n\n《高常侍集》四部丛刊本录“十里黄云”，《全唐诗》系常见“千里黄云”；本页采用后者。完整收录二首，“六翮”指鸟的翅翼，借喻漂泊，不删去第二首。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/別董大)\n- [生平核对：《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [通行系年与背景：古文岛](https://m.gushiwen.cn/shiwenv_b7289fb613af.aspx)\n- [《高常侍集》四部丛刊本卷八](https://zh.wikisource.org/wiki/高常侍集_(四部叢刊本)/卷第八)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "唐肃宗李亨": "\n# 唐肃宗李亨\n\n## 身份与在位\n\n李亨（711—762），玄宗之子，756—762年在位，年号至德、乾元、上元，晚期还有不建年号的记时阶段。756年在灵武即位，不能将其简单写成和平时期按常规完成的交接。\n\n## 核心政治问题\n\n[[灵武即位与两京收复]]涉及组织战时政府与军事力量；[[郭子仪]]等是收复作战的重要将领。两京收复不意味着安史之乱立刻结束，战争继续反复，直至代宗朝。\n\n[[永王李璘]]的军事活动与肃宗的统一指挥发生冲突，见[[永王事件与高适李白分途]]。[[李白]]和[[高适]]原有诗友关系，不能消除他们当时所处政治位置的差别。\n\n## 与诗人相接\n\n- 杜甫从陷落长安脱身赴凤翔，任左拾遗；[[杜甫谏救房琯与华州任职]]显示官职并非稳定的个人归宿。\n- [[岑参·人生故事]]在东归后转入谏官等任职，作品见[[寄左省杜拾遗]]。\n- [[李白流夜郎与遇赦东还]]说明处分与赦免背景；[[早发白帝城]]采用759遇赦系年时放在此朝，但早年作说仍保留。\n\n## 用作品理解环境\n\n[[月夜（杜甫）]]与[[春望]]可读战争中的家人与城市；[[新安吏]]、[[潼关吏]]、[[石壕吏]]及三别连接759年前后的征役生活。\n\n[[春夜喜雨]]和[[茅屋为秋风所破歌]]仍处于肃宗朝，不能因为写在成都就统一放到代宗朝。761年的诗人生活与当时中央在位者是两个同时存在的坐标。\n\n## 继承\n\n762年肃宗去世，[[唐代宗李豫]]继位。与玄宗同年去世，涉及朝廷权力调整，但不是两人同时在位。\n\n## 来源\n\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n- [《旧唐书》卷107](https://zh.wikisource.org/wiki/舊唐書/卷107)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "高适杜甫蜀中交游与人日唱和": "\n# 高适杜甫蜀中交游与人日唱和\n\n## 直接作品链\n\n高适[[人日寄杜二拾遗]]通常系761年正月初七，寄成都草堂；杜甫[[追酬故高蜀州人日见寄]]序明记770年正月二十一日。后者是在高适亡后翻到旧诗而追酬，不是761年收到信便立即回诗。\n\n## 官职与关系\n\n高适原赠时为蜀州刺史的说法有杜甫追酬题、序支持，地方任职与确切系年仍须年谱互校。杜甫当时已离拾遗职，“杜二拾遗”是旧称；“二千石”是汉官借称，不是唐代薪资数。\n\n## 时间误差怎么保留\n\n追酬序称原赠距今“十余年”，又说高适存没“六七年”，与761年赠诗、765年卒的通行纪年并不严丝合缝。原赠诗没有明确年款，因此本专题将761列作通行系年，不用序中约数把全部日期改写为确定结论。\n\n## 连接到岑参\n\n[[慈恩寺登塔唱和]]是乱前群体诗歌活动；蜀中人日诗是乱后高杜两地问候；[[岑参入蜀与嘉州岁月]]又是岑参自己的地方任职线。三条路径可以对读，但不能因为都到过蜀地就认定三人始终同处一地。\n\n关联：[[高适]]、[[杜甫]]、[[岑参·人物事件关系图]]。\n\n## 来源与核查\n\n- [高适赠诗](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [杜甫追酬序与诗](https://zh.wikisource.org/wiki/歲時雜詠_(四庫全書本)/卷05)\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "蜀道难（李白）": "\n# 蜀道难（李白）\n\n作者：[[李白]]。\n\n## 完整原文\n\n噫吁嚱，危乎高哉！\n蜀道之难，难于上青天！\n蚕丛及鱼凫，开国何茫然！\n尔来四万八千岁，不与秦塞通人烟。\n西当太白有鸟道，可以横绝峨眉巅。\n地崩山摧壮士死，然后天梯石栈相钩连。\n上有六龙回日之高标，下有冲波逆折之回川。\n黄鹤之飞尚不得过，猿猱欲度愁攀援。\n青泥何盘盘，百步九折萦岩峦。\n扪参历井仰胁息，以手抚膺坐长叹。\n问君西游何时还？畏途巉岩不可攀。\n但见悲鸟号古木，雄飞雌从绕林间。\n又闻子规啼夜月，愁空山。\n蜀道之难，难于上青天，使人听此凋朱颜！\n连峰去天不盈尺，枯松倒挂倚绝壁。\n飞湍瀑流争喧豗，砯崖转石万壑雷。\n其险也如此，嗟尔远道之人胡为乎来哉！\n剑阁峥嵘而崔嵬，一夫当关，万夫莫开。\n所守或匪亲，化为狼与豺。\n朝避猛虎，夕避长蛇；磨牙吮血，杀人如麻。\n锦城虽云乐，不如早还家。\n蜀道之难，难于上青天，侧身西望长咨嗟！\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 未定；常系742前后，早于《河岳英灵集》编成（753，通行） |\n| 地点 | 写秦蜀道路，实际写作地点未定；不能把描写地点直接当写作现场 |\n| 官职 | 作于乱前；无据认定创作时任蜀中官职 |\n| 生活处境 | 蜀中成长与后来的漫游提供经验，仍有拟古与想象 |\n| 交游 | [[贺知章]]激赏故事需注明文献层级 |\n| 历史事件 | [[李白翰林供奉与赐金放还]]；不能系为安史之乱后严武逼杜甫事件 |\n\n## 结合处境解读\n\n地势险峻与守关者是否可信是两个递进层次：由山川阻隔写到人事风险。蚕丛、鱼凫与五丁开山等传统被纳入宏大叙述，不能拿“四万八千岁”当可考年代。\n\n“早还家”的劝告呈现远行者面对险境的声音，但具体受劝人未定。与[[岑参的行旅地点]]、[[岑参入蜀与嘉州岁月]]对读时，要区分诗歌地理和可证实的任职行程。\n\n## 系年、异文与证据边界\n\n本页依通行正文录，不把敦煌异文拼成混合版本。《河岳英灵集》已收此诗，讽严武、劝玄宗入蜀等解释须面对年代障碍。精确作年及寄托对象不下定论。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/蜀道難_(李白))\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "孟浩然长安求仕与荆州幕府": "\n# 孟浩然长安求仕与荆州幕府\n\n## 约728前后的京师经历\n\n《旧唐书》记[[孟浩然]]年四十来京、应进士不第；《新唐书》增加太学赋诗、[[王维]]邀入内署、玄宗偶至、床下躲藏、诵“不才明主弃”而被放还等情节。后一故事有唐末笔记渊源，但旧传的简洁记录不能自动证明新增细节全真。\n\n[[岁暮归南山]]本身可确证求仕失意的文学表达，不能确证那段帝王对话真的逐字发生。诗与逸事如相互依赖，便不能当作两条完全独立证据。\n\n## 韩朝宗荐举失约的叙事\n\n《新唐书》又载韩朝宗约孟同赴京师，孟因故友来访欢饮而失约。它表现史传塑造的任情性格。具体年月和内心不补写，也不能据这一个场景概括他一生不愿求仕。\n\n## 737前后以后的荆州从事\n\n[[张九龄]]贬荆州长史后辟孟入府，两《唐书》都有辟署信息。称“从事”是幕府职分，不能写成中央任官，也不能完全删去。其任期长度及是否有正式官告需进一步材料支持。\n\n[[望洞庭湖赠张丞相]]是求荐诗的重要对读入口，但受赠者、作年有争议，不直接把它写作737年入幕当天的谢恩诗。\n\n## 来源与核查\n\n- [《旧唐书》孟浩然传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》孟浩然传](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n- [《唐摭言》，逸事渊源供追索](https://zh.wikisource.org/wiki/唐摭言)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "走马川行奉送封大夫出师西征": "\n\n## 完整原文\n\n君不见走马川行雪海边，平沙莽莽黄入天。\n轮台九月风夜吼，一川碎石大如斗，随风满地石乱走。\n匈奴草黄马正肥，金山西见烟尘飞。\n汉家大将西出师，将军金甲夜不脱。\n半夜军行戈相拨，风头如刀面如割。\n马毛带雪汗气蒸，五花连钱旋作冰。\n幕中草檄砚水凝，虏骑闻之应胆慑。\n料知短兵不敢接，车师西门伫献捷。\n\n## 网页补充说明\n\n本段为地图网页补充的完整古诗，采用通行正文、简体字与现代标点；作品异文与创作背景请结合下方原笔记。\n\n[原文与异文来源](https://zh.wikisource.org/wiki/走馬川行奉送封大夫出師西征)\n\n## 原笔记与创作背景\n# 走马川行奉送封大夫出师西征\n\n岑参的七言歌行，题目有版本差异；本页采用常见题名。奉送对象“封大夫”通常指[[封常清]]，背景见[[岑参第二次出塞]]。\n\n## 阅读重点（整理者解读）\n\n狂风、碎石、夜行和凝结的笔墨，将环境压力与军队行进放在一起。声音、动作和急促节奏，是它区别于普通静态风景描写的重要方式。\n\n诗末表达对战事的预期与胜利想象，不能直接用来证明某一场战争已经如何获胜。献赠性质也会影响作品的赞颂语气。\n\n## 对读路线\n\n与[[白雪歌送武判官归京]]比较：都处于军幕背景，但前者推进到行动与胜利期待，后者收束为一个人的远去。再读[[高适]]的作品，可以比较边塞题材内部的多样性。\n\n## 边界\n\n具体作年、走马川定位与所对应战役，本页不作无来源的精确对应。\n\n关联：[[岑参·史料来源与阅读方法]]。\n\n## 来源与核查\n\n- [《走马川行》原文](https://zh.wikisource.org/wiki/走馬川行奉送封大夫出師西征)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "李白流夜郎与遇赦东还": "\n# 李白流夜郎与遇赦东还\n\n## 入幕、获罪与流放不是同一年全部完成\n\n[[永王事件与高适李白分途]]承接756末—757初李白入永王幕的政治选择。永王败后，李白遭拘系，随后有宋若思辟入幕等经历，通行编年把长流夜郎放在758年，759年遇赦。两《唐书》叙事顺序有错乱，不能逐句当成可靠时间线。\n\n## 幕僚身份的政治风险\n\n李白把入幕解释为参与平乱、报国，朝廷则将永王行动纳入附逆定罪。整理时同时列出这两种立场，不由诗人的自辩自动免除全部政治判断，也不把他概括成主动追随安禄山。[[高适]]受肃宗命参与对永王的部署，位置与李白不同，但求救是否送达、友人心理不得据传说补全。\n\n## 759遇赦及江陵方向\n\n[[早发白帝城]]通行系759年遇赦后东返。夜郎是流放目的地，不等于李白已经到达夜郎后再返程；唐代夜郎所指还需区别古夜郎国、唐县和后世地名。\n\n诗中“一日”与“千里”构成飞快归途的文学感受，不能换算成精确船速。遇赦也没有立刻结束安史之乱。\n\n## 来源与核查\n\n- [《旧唐书》李白传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [《早发白帝城》](https://zh.wikisource.org/wiki/早發白帝城)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "高仙芝": "\n# 高仙芝\n\n唐玄宗时期的重要边将，出身高丽，长期在安西军政系统任职。其军事活动涉及小勃律等地，史传同时记载战功与争议，不能只用“常胜名将”概括。\n\n## 与岑参的关系\n\n[[岑参第一次出塞]]通常系于749年，岑参进入他的幕府任掌书记。这里的联系是主帅与文职幕僚。没有充分依据认定岑参随他参加每一场战役。\n\n## 人生转折\n\n安史之乱初期，他与[[封常清]]退守潼关，随后奉朝廷诏令被处死。《旧唐书》卷104保存军事失利、监军干预与临刑申辩的叙述。史书的对话应视为史传记载，不是现代逐字记录。\n\n## 关联理解\n\n读[[安史之乱与岑参东归]]，可以看到军幕主帅的命运和诗人仕途所处秩序同时发生变化；读[[唐代幕府与谏官]]，能理解为什么文章写作者会进入边将身边。\n\n## 来源与核查\n\n- [《旧唐书》卷104·高仙芝、封常清](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n", "赠孟浩然": "\n# 赠孟浩然\n\n作者：[[李白]]。\n\n## 完整原文\n\n吾爱孟夫子，风流天下闻。\n红颜弃轩冕，白首卧松云。\n醉月频中圣，迷花不事君。\n高山安可仰，徒此挹清芬。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 未定；常置开元江汉交游期间，亦有不同晚年系年 |\n| 地点 | 江汉交游语境，具体作地未确证 |\n| 官职 | 李白主要布衣身份；孟浩然不得显达 |\n| 生活处境 | 诗友赞美与高士形象的塑造 |\n| 交游 | [[孟浩然]] |\n| 历史事件 | [[李白孟浩然交游与江汉送别]] |\n\n## 结合处境解读\n\n李白强调孟的风流与清芬，为年长友人树立值得仰慕的高士形象。“中圣”借酒之清浊的典故说醉，不是宗教成圣记录。\n\n“弃轩冕”“不事君”须和孟的应举、求荐、入张九龄幕府并读。诗歌所赞的是人格与选择，不足证明他从来没有政治愿望。\n\n## 系年、异文与证据边界\n\n“挹”意为汲取、领受，不能误作“揖”。无诗序明确日期，不硬定727初识时。“白首”也不等于诗人正在孟浩然临终床前。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/贈孟浩然)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "同诸公登慈恩寺塔（杜甫）": "\n# 同诸公登慈恩寺塔（杜甫）\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n高标跨苍天，烈风无时休。\n自非旷士怀，登兹翻百忧。\n方知象教力，足可追冥搜。\n仰穿龙蛇窟，始出枝撑幽。\n七星在北户，河汉声西流。\n羲和鞭白日，少昊行清秋。\n秦山忽破碎，泾渭不可求。\n俯视但一气，焉能辨皇州？\n回首叫虞舜，苍梧云正愁。\n惜哉瑶池饮，日晏昆仑丘。\n黄鹄去不息，哀鸣何所投？\n君看随阳雁，各有稻粱谋。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系752年秋；后人系年，不是诗题自记。 |\n| 地点 | 长安慈恩寺塔。 |\n| 当时官职 | 未正式授官；献赋求仕不等于已经在朝任拾遗。 |\n| 生活处境 | 困居长安，理想与生计压力并存。 |\n| 交游与写作对象 | 原注称高适、薛据先有此作；接[[同诸公登慈恩寺浮图（高适）]]与[[慈恩寺登塔唱和]]。 |\n| 历史事件 | 安史之乱前的长安；不能把755年后的事件当作本诗已知事实。 |\n\n## 结合处境读诗（整理者解读）\n\n登塔并未直接解除烦忧。“泾渭不可求”首先是高处眺望中界线难辨的景象，又可读为政治辨识的困境。“虞舜”“瑶池”引入贤君与宴游的对照，但把每个典故强行配给某一条宫廷新闻，会超过诗句能证明的范围。\n\n结尾从黄鹄转到谋食的雁，把高远志向压回生存现实。相对于高适的“输效独无因”，杜甫更突出理想失落与稻粱谋之间的紧张。\n\n## 版本与辨析\n\n保留原文常见“苍天”“足可”“七星在北户”；均有异文，线上录文可查。“诸公”不能单凭题目补出全体参加者。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/同諸公登慈恩寺塔_(杜甫))\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "岑参·人物事件关系图": "\n# 岑参·人物事件关系图\n\n每条边说明“为什么有关”，而不只把名字放在一起。\n\n| 起点 | 关系 | 终点 | 依据 |\n|---|---|---|---|\n| 岑参 | 第一任边地幕主 | [[高仙芝]] | 通行生平、教学资料 |\n| 岑参 | 第二任边地幕主 | [[封常清]] | 生平与献赠诗 |\n| 岑参 | 文学同道、登塔同游 | [[高适]] | 登塔诗题 |\n| 岑参 | 诗友、荐举传统、朝廷交往 | [[杜甫]] | 后世传记与寄赠诗 |\n| 岑参 | 登塔同游 | [[薛据]] | 登塔诗题 |\n| 岑参 | 曾祖辈家世 | [[岑文本]] | 生平资料，非见面关系 |\n| 岑参 | 蜀中幕府关系 | [[杜鸿渐]] | 杜确序及相关生平 |\n| 岑参 | 送别对象 | [[武判官]] | 《白雪歌》诗题 |\n| 岑参遗文 | 后来编次 | [[杜确]] | 集序 |\n\n## 事件串联\n\n[[岑参第一次出塞]]使求仕连接军幕；[[慈恩寺登塔唱和]]连接诗人群体；[[岑参第二次出塞]]连接边塞名作；[[安史之乱与岑参东归]]改变任职背景；[[岑参入蜀与嘉州岁月]]连接地方生活；[[岑嘉州集的编纂与流传]]连接作品传承。\n\n## 浏览方式\n\n在 Obsidian 打开本页的局部关系图，可看到人物和事件；点开其中一篇，再沿正文继续阅读。所有图中的双链都对应独立笔记。诗歌中出现的古代典故人物不自动视为岑参的现实交游。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n- [《寄左省杜拾遗》原文](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n\n\n## 高适、杜甫扩展关系\n\n| 起点 | 关系 | 终点 | 依据 |\n|---|---|---|---|\n| 高适 | 序中归客所从的军镇长官 | [[张守珪]] | [[燕歌行]]序；非直接唱和对象 |\n| 高适 | 琴师送别对象（通行注释） | [[董庭兰]] | [[别董大二首]] |\n| 高适 | 军幕主帅 | [[哥舒翰]] | 史传；[[高适封丘任职与入哥舒翰幕府]] |\n| 高适、杜甫 | 梁宋诗友 | [[李白]] | [[梁宋交游与李杜高同游]]，同行范围另辨 |\n| 杜甫 | 交谊与谏救 | [[房琯]] | [[杜甫谏救房琯与华州任职]] |\n| 杜甫 | 生活支持与幕府任职 | [[严武]] | [[杜甫成都草堂与严武幕府]] |\n| 杜甫 | 战乱中的家庭相思 | [[杨氏（杜甫妻）]] | [[月夜（杜甫）]]，想象视角 |\n| 杜甫 | 借诗寄望平叛将帅 | [[郭子仪]] | [[新安吏]]“仆射”通行解释 |\n| 杜甫 | 追怀古人，不是现实交游 | [[诸葛亮]] | [[蜀相]] |\n| 高适、杜甫 | 当年问候与亡后追酬 | [[高适杜甫蜀中交游与人日唱和]] | 赠诗与770年追酬序 |\n\n完整扩展地图：[[高适与杜甫·作品与时代知识地图]]。事件时间轴接[[潼关失守与玄宗入蜀]]、[[邺城之败与三吏三别]]、[[安史之乱平定与杜甫闻捷]]。\n\n\n## 李白、孟浩然及诗友扩展关系\n\n| 起点 | 关系 | 终点 | 依据／阅读入口 |\n|---|---|---|---|\n| 李白 | 赠诗、送别年长诗友 | [[孟浩然]] | [[赠孟浩然]]、[[黄鹤楼送孟浩然之广陵]] |\n| 李白 | 知遇与亡友追怀 | [[贺知章]] | [[对酒忆贺监二首]]及序 |\n| 李白 | 宴饮诗点名交游 | [[元丹丘]]、[[岑勋]] | [[将进酒（李白）]]，系年另辨 |\n| 李白 | 遥寄贬谪诗友 | [[王昌龄]] | [[闻王昌龄左迁龙标遥有此寄]] |\n| 李白 | 晚年照料与遗稿编集 | [[李阳冰]] | [[李白当涂晚年与诗集编纂]] |\n| 孟浩然 | 荆州幕府辟署 | [[张九龄]] | 两《唐书》孟传 |\n| 王维 | 右拾遗荐拔 | [[张九龄]] | 《新唐书》王维传 |\n| 王维 | 山居同题唱和 | [[裴迪]] | 《辋川集》序与作品 |\n\n完整入口：[[李白孟浩然与盛唐诗友·知识地图]]。新增边多是由原诗友网络向外延伸，不意味着各人都与岑参有可证实的直接见面。\n", "慈恩寺登塔唱和": "\n# 慈恩寺登塔唱和\n\n## 时间与参与者\n\n通常系于752年秋，长安慈恩寺塔的一次登临活动。岑参诗题直接列出[[高适]]、[[薛据]]；[[杜甫]]等人的同题作品与后人考订，提供更广的同游线索。本页只为本专题中的核心人物建链接，参与者名单并非在每个原始诗题中都完整列出。\n\n## 直接材料\n\n岑参《与高适薛据登慈恩寺浮图》收在《全唐诗》卷198，标题存在“同登”等异文。作品由塔的形势与高处视野展开，进而写向精神体验。\n\n## 为什么是知识节点\n\n它把[[岑参第一次出塞]]后的长安生活，与诗友交游相连。比较同题诗，比把几人笼统称为好友更能看出各自的观察方式。\n\n## 核查边界\n\n年份通常来自后世系年，不在岑参诗题中直接标注。共同活动不支撑虚构对话、完整聚会流程或无出处的友情故事。\n\n关联：[[岑参·人物事件关系图]]。\n\n## 来源与核查\n\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n- [《唐才子传》卷2·薛据](https://zh.wikisource.org/wiki/唐才子傳/卷2)\n\n\n## 扩展：高适、杜甫两篇全文与同题比较\n\n全文分别见[[同诸公登慈恩寺浮图（高适）]]和[[同诸公登慈恩寺塔（杜甫）]]。前者由塔上形神舒展转到“输效独无因”，后者从“百忧”写到皇州难辨与“稻粱谋”，两者的高远视野都不能消除仕途、生计的现实。\n\n杜诗原注“时高适、薛据先有此作”提供唱和先后线索；不能据此补完整同游人数、聚会流程或对白。752年秋仍按通行系年标注，非原诗年款。由此可沿[[高适与杜甫·作品与时代知识地图]]比较后来蜀中、夔州时期的写作。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "春夜喜雨": "\n# 春夜喜雨\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n好雨知时节，当春乃发生。\n随风潜入夜，润物细无声。\n野径云俱黑，江船火独明。\n晓看红湿处，花重锦官城。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系761年春（上元二年），为草堂时期系年。 |\n| 地点 | 成都浣花溪草堂附近；结尾展望锦官城。 |\n| 当时官职 | 无现任朝职，尚未在严武幕府任参谋。 |\n| 生活处境 | 暂得居所，接触田园日常与春季生长。 |\n| 交游与写作对象 | 无具名赠答对象；与高适的[[人日寄杜二拾遗]]约在同一时期，不能认作唱和作品。 |\n| 历史事件 | [[杜甫成都草堂与严武幕府]]；乱中局部生活的恢复。 |\n\n## 结合处境读诗（整理者解读）\n\n“喜”由“知时节”的恰当开始：雨来得合乎春季生长需要，且以潜入、细润而不是猛烈冲刷发生作用。第三联黑云与一点船火构成夜中观察，末联是对次日花城的期待，不必视为已在翌晨完成的实景报告。\n\n有了相对稳定的居所，诗人能把注意力从逃亡转向生长。这种喜悦与[[茅屋为秋风所破歌]]同属草堂生活的不同面貌；不能因一首“喜雨”就认定他终年富足无忧。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/春夜喜雨)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "寄左省杜拾遗": "\n\n## 完整原文\n\n联步趋丹陛，分曹限紫微。\n晓随天仗入，暮惹御香归。\n白发悲花落，青云羡鸟飞。\n圣朝无阙事，自觉谏书稀。\n\n## 网页补充说明\n\n本段为地图网页补充的完整古诗，采用通行正文、简体字与现代标点。\n\n[原文来源](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n\n## 原笔记与创作背景\n# 寄左省杜拾遗\n\n岑参写给[[杜甫]]的五言律诗，是理解两人朝廷交往的直接作品材料。题中的杜拾遗即以官职称呼杜甫，左省指其任职背景。\n\n## 阅读线索（整理者解读）\n\n作品从一同入朝而分属不同官署写起，转向个人迟暮与仕途感受，最后落在进谏问题上。末联的表面赞语可以引出不同解读，是否含讽意需要结合语境与历代注释，不只凭一句话定论。\n\n## 人生与制度\n\n[[安史之乱与岑参东归]]说明从军幕转向朝廷的背景；[[唐代幕府与谏官]]说明补阙、拾遗与进言的关系。\n\n## 证据边界\n\n诗题和正文支持交往关系，不足以证明所有荐举细节。岑参右补阙与后出材料左补阙说的差异，见[[岑参·年表与争议]]。\n\n关联：[[岑参·人物事件关系图]]。\n\n## 来源与核查\n\n- [《寄左省杜拾遗》原文](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《唐才子传》卷3·岑参](https://zh.wikisource.org/wiki/唐才子傳/卷3)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "高适封丘任职与入哥舒翰幕府": "\n# 高适封丘任职与入哥舒翰幕府\n\n## 职业转换\n\n高适长期客游梁宋，通行系749年经荐举有道科，任封丘尉。[[封丘作]]写对上拜迎和对下鞭挞的两面困境。后离县尉职，约752—753年前后入[[哥舒翰]]河西、陇右军幕，任掌书记；精确入幕年有编年差别，本页保留区间。\n\n## 官职不能互相替代\n\n县尉为基层属官，掌书记主要负责文书；从文职幕僚到后来节度使是逐步变化。[[燕歌行]]738年创作时尚未进入这个幕府，不因诗写军事就提前赋予统军经历。\n\n## 对作品的解释力\n\n基层县务让他具体接触催迫与民困，军幕则使他进入边镇政务和军队组织。[[同诸公登慈恩寺浮图（高适）]]所说“输效独无因”可放在转职时期读，但登塔年份与入幕时间不要强行排到某日。\n\n关联：[[唐代幕府与谏官]]、[[潼关失守与玄宗入蜀]]。\n\n## 来源与核查\n\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《封丘作》](https://zh.wikisource.org/wiki/全唐詩/卷213)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "对酒忆贺监二首": "\n# 对酒忆贺监二首\n\n作者：[[李白]]。\n\n## 完整原文\n\n### 序\n\n太子宾客贺公于长安紫极宫一见余，呼余为谪仙人。因解金龟换酒为乐。殁后对酒，怅然有怀，而作是诗。\n\n### 其一\n\n四明有狂客，风流贺季真。\n长安一相见，呼我谪仙人。\n昔好杯中物，翻为松下尘。\n金龟换酒处，却忆泪沾巾。\n\n### 其二\n\n狂客归四明，山阴道士迎。\n敕赐镜湖水，为君台沼荣。\n人亡余故宅，空有荷花生。\n念此杳如梦，凄然伤我情。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 通行系746年前后；在贺知章去世以后，确切年月未定 |\n| 地点 | 追忆长安相见与山阴故宅，作地常联系越中行旅 |\n| 官职 | 已经离开翰林的漫游者，通行背景 |\n| 生活处境 | 昔日知遇已成亡友记忆 |\n| 交游 | [[贺知章]] |\n| 历史事件 | [[贺知章归乡与李白追忆]] |\n\n## 结合处境解读\n\n第一首把“谪仙”声名还原为一个年长知己的认可，再由金龟换酒转成悼亡之泪；第二首写朝廷礼遇与故宅空寂，荣宠不能抵抗死亡。\n\n序是金龟换酒的重要本人回忆证据，却没有记下初见精确日期，也没有说当场必读《蜀道难》。把后代笔记细节无缝塞进诗序，会掩盖材料层级。\n\n## 系年、异文与证据边界\n\n本页两首与序全录。“翻为”另有“今为”，“殁／没”等属录文差异。诗序本身不列年款，746仅作通行编年。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/全唐詩/卷182)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n分篇对校：[其一](https://zh.wikisource.org/wiki/對酒憶賀監_(四明有狂客))、[其二](https://zh.wikisource.org/wiki/對酒憶賀監_(狂客歸四明))；序据《全唐诗》卷182。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "诸葛亮": "\n# 诸葛亮\n\n蜀汉丞相（181—234），字孔明。这里作为杜甫[[蜀相]]的历史追怀对象建立节点，不把古代典故人物画成唐代现实朋友。\n\n## 杜甫怎样重写他的形象\n\n“三顾”联系刘备延请，“两朝”概括辅佐刘备与刘禅，“出师未捷”联系北伐未竟而卒。杜诗关注的不是完整军事战略，而是君臣信任、长期尽职与功业未成的悲剧。\n\n## 事实与诗句\n\n《三国志》诸葛亮传与《出师表》可提供历史入口；“长使英雄泪满襟”则是杜甫及后代读者的情感概括，不是诸葛亮本人言论。唐代成都祠堂和今日武侯祠的建筑历史也不能直接等同。\n\n关联：[[杜甫成都草堂与严武幕府]]、[[蜀相]]。\n\n## 来源与核查\n\n- [《三国志》卷35](https://zh.wikisource.org/wiki/三國志/卷35)\n- [《蜀相》](https://zh.wikisource.org/wiki/蜀相)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "李白孟浩然与盛唐诗友·知识地图": "\n# 李白孟浩然与盛唐诗友·知识地图\n\n本地图从[[高适与杜甫·作品与时代知识地图]]、[[岑参·人生故事与知识导航]]继续扩展。以[[李白]]、[[孟浩然]]为主，连接[[王维]]、[[贺知章]]、[[王昌龄]]与幕主、编集者。关系并不等于所有人同时同地见面。\n\n## 从人生故事进入\n\n- [[李白·年表与争议]] → [[李白出蜀漫游与安陆生活]] → [[李白翰林供奉与赐金放还]] → [[梁宋交游与李杜高同游]] → [[永王事件与高适李白分途]] → [[李白流夜郎与遇赦东还]] → [[李白当涂晚年与诗集编纂]]。\n- [[孟浩然·年表与争议]] → [[孟浩然长安求仕与荆州幕府]] ↔ [[李白孟浩然交游与江汉送别]]。\n- [[王维]] → [[王维辋川生活与陷贼受官]]；[[贺知章]] → [[贺知章归乡与李白追忆]]。\n- 逸事核查：[[李白事迹中的史料与传说]] ↔ [[岑参·史料来源与阅读方法]]。\n\n## 人物与证据\n\n| 人物关系 | 可确认的线索 | 不应自动推出 |\n|---|---|---|\n| 李白—孟浩然 | 赠诗、黄鹤楼送别题 | 初识准确日与完整对话 |\n| 李白—贺知章 | 追忆诗序、金龟换酒 | 所有后代笔记情节同样可靠 |\n| 李白—[[元丹丘]]、[[岑勋]] | 点名诗句与酬赠诗题 | 《将进酒》的岑夫子是岑参 |\n| 李白—[[李阳冰]] | 病中托稿与草堂集序 | 序日就是准确卒日 |\n| 孟浩然—[[张九龄]] | 史传所记荆州辟署 | 终身未参与任何幕府事务 |\n| 王维—[[裴迪]] | 辋川集序与同题唱和 | 所有盛唐名家曾同席 |\n| 李白—王昌龄 | 遥寄贬谪诗 | 两人的夜郎行程是同一件事 |\n| 李白—高适、杜甫 | 既有梁宋交游与乱中分途笔记 | 三人744—745全程同行 |\n\n## 完整作品入口\n\n### 李白\n\n[[蜀道难（李白）]]、[[将进酒（李白）]]、[[行路难三首（李白）]]（三首全录）、[[黄鹤楼送孟浩然之广陵]]、[[赠孟浩然]]、[[早发白帝城]]、[[对酒忆贺监二首]]（两首及序）、[[闻王昌龄左迁龙标遥有此寄]]。\n\n### 孟浩然\n\n[[过故人庄]]、[[春晓（孟浩然）]]、[[宿建德江]]、[[夜归鹿门山歌]]、[[望洞庭湖赠张丞相]]、[[岁暮归南山]]。\n\n### 王维、贺知章、王昌龄\n\n[[使至塞上]]、[[送元二使安西]]、[[回乡偶书二首]]、[[芙蓉楼送辛渐二首]]。凝碧池四句全录在[[王维辋川生活与陷贼受官]]。\n\n## 与原专题的对读路线\n\n1. 求仕与基层：孟浩然的[[望洞庭湖赠张丞相]]、李白的[[行路难三首（李白）]] ↔ 高适[[封丘作]] ↔ [[岑参进士及第与初授官]]。\n2. 朝廷身份与战乱：李白翰林供奉 ↔ [[杜甫谏救房琯与华州任职]]；王维陷贼受官 ↔ [[长安陷落与杜甫困居]]。\n3. 送别方向：[[黄鹤楼送孟浩然之广陵]]、[[送元二使安西]] ↔ [[白雪歌送武判官归京]]，分辨东下、西行、归京。\n4. 亡友与文本保存：[[对酒忆贺监二首]] ↔ [[追酬故高蜀州人日见寄]]；[[李阳冰]]编集 ↔ [[杜确]]与[[岑嘉州集的编纂与流传]]。\n5. 山水中的处境：[[宿建德江]] ↔ [[旅夜书怀]]；[[望洞庭湖赠张丞相]] ↔ [[登岳阳楼]]，同类景物对应不同政治与生活坐标。\n\n孟浩然740年去世，贺知章通行744年去世，都在安史之乱以前；不把他们加入永王之争或乱后蜀中交游。\n\n## 来源与核查\n\n- [李白、王维史传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [孟浩然、王昌龄史传](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n- [贺知章史传](https://zh.wikisource.org/wiki/新唐書/卷196)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "开元政局与文人求仕": "\n# 开元政局与文人求仕\n\n开元时期中央用人与文人的求荐、科举、漫游并行。[[唐玄宗李隆基]]是帝位主线，[[张九龄]]、[[李林甫]]是理解中枢政治变化的重要人物。\n\n## 连接已有知识\n\n[[孟浩然长安求仕与荆州幕府]]显示诗人进入仕途的不同尝试；[[望洞庭湖赠张丞相]]兼具山水观察与求用表达，具体受赠对象和系年仍看作品页。\n\n[[李白出蜀漫游与安陆生活]]表明游历不只出于游兴，也涉及生活支持与求荐。[[望岳（岱宗夫如何）]]处于杜甫早年壮游背景，不宜前移其后来官职。\n\n## 政治与诗歌的边界\n\n开元的文化繁荣不能证明每个有名诗人都已顺利为官；中枢用人变化也不能直接解释所有未仕者。把制度机会、个人路线与作品表述分开，见[[唐代皇帝主线·史料与关系规则]]。\n\n## 来源\n\n- [《旧唐书》卷8](https://zh.wikisource.org/wiki/舊唐書/卷8)\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷106](https://zh.wikisource.org/wiki/舊唐書/卷106)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "杜甫出蜀与夔州江湘漂泊": "\n# 杜甫出蜀与夔州江湘漂泊\n\n## 行旅坐标\n\n765年离成都，经岷江、长江东下，在云安停留；766年到夔州，768年出峡，经江陵到公安、岳阳，随后在湖南舟行，770年卒。此为通行生平骨架，不用现代地名替代唐代全部行政边界。\n\n## 作品与生活的对应\n\n| 阶段 | 完整作品 | 阅读重点 |\n|---|---|---|\n| 765年东下舟行 | [[旅夜书怀]] | 失去相对安定与幕府依靠，政治抱负与漂泊相接 |\n| 766年夔州 | [[秋兴八首]] | 眼前秋景与长安记忆反复叠合 |\n| 767年夔州 | [[登高（杜甫）]] | 多病、作客与时间压力 |\n| 768年岳阳 | [[登岳阳楼]] | 壮阔湖景、孤舟断信与北方军情 |\n| 770年湖南 | [[追酬故高蜀州人日见寄]] | 翻检旧诗、友人凋零与怀旧 |\n\n## 别把晚年写成连续绝境\n\n漂泊中也有地方官与亲友的帮助、暂住和生产活动；作品中的“独”与“孤舟”是抒情位置，不证明每时每刻全家绝无依靠。[[严武]]765年卒与[[高适]]同年卒，影响其旧友网络，却不说明所有后来诗作都是直接哭两人。\n\n## 卒年与死因\n\n通常纪为770年卒。《旧唐书》记永泰二年及牛肉白酒暴卒，年代与通行纪年不合，死因叙述也需辨析；不据此编造临终食谱或把传说写成医学结论。\n\n关联：[[杜甫·年表与争议]]、[[岑参的行旅地点]]。\n\n## 来源与核查\n\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "李白·年表与争议": "\n# 李白·年表与争议\n\n[[李白]]的生平按通行年谱铺设；没有日期的诗不能反过来强制填满年表。\n\n| 年代 | 地点、身份与处境 | 关联 | 证据与不确定性 |\n|---|---|---|---|\n| 701—约724/725 | 童少年主要在蜀中；学习、任侠、求道 | [[李白出蜀漫游与安陆生活]] | 生年通行701；出生碎叶或蜀地有争论，幼年迁蜀年也需辨 |\n| 约724/725起 | 出蜀、沿江漫游；主要布衣身份 | 同上；[[孟浩然]] | 出蜀年有724、725说，不固定生日与月日 |\n| 727前后 | 安陆一带生活，与许氏婚姻及求荐 | 同上 | 非出蜀后立即任官，亦非没有家庭与经济依托 |\n| 开元年间 | 江汉交游、漫游吴越等地 | [[黄鹤楼送孟浩然之广陵]]、[[赠孟浩然]] | 初识与送别年多说 |\n| 742—744，通行 | 长安翰林供奉；离京赐金放还 | [[李白翰林供奉与赐金放还]]、[[贺知章]] | 推荐人及离京细节有不同材料；供奉不等于实任宰相 |\n| 744—745前后 | 与杜甫相识，梁宋、东鲁交游 | [[梁宋交游与李杜高同游]] | 三人不是全程共同旅行 |\n| 736或752等系年 | 与岑勋、元丹丘宴饮 | [[将进酒（李白）]] | 争议作品单列，不硬塞入742后失意故事 |\n| 756末—757初 | 入永王幕，永王败后获罪 | [[永王事件与高适李白分途]] | 本人辩辞与朝廷定罪立场须并读 |\n| 758—759，通行 | 流夜郎途中，759遇赦东还 | [[李白流夜郎与遇赦东还]]、[[早发白帝城]] | 是否行至夜郎不能由刑罚名推定；白帝诗亦有早年作说 |\n| 761—762前后 | 病中往依当涂李阳冰 | [[李白当涂晚年与诗集编纂]] | 762卒通行；捞月溺死不作事实 |\n\n## 不宜作为年谱硬坐标的故事\n\n[[李白事迹中的史料与传说]]区分铁杵磨针、金龟换酒、高力士脱靴、郭子仪报恩和捞月等故事的材料层级。出生地点与家世争论不简化成现代国籍问题。\n\n## 来源与核查\n\n- [《旧唐书》李白传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》李白传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [李阳冰序](https://www.xuges.com/mj/l/libai/072.htm)\n- [清代《李太白年谱》，供比较而非唯一编年](https://ctext.org/wiki.pl?chapter=886336&if=gb)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "芙蓉楼送辛渐二首": "\n# 芙蓉楼送辛渐二首\n\n作者：[[王昌龄]]。\n\n## 完整原文\n\n### 其一\n\n寒雨连江夜入吴，平明送客楚山孤。\n洛阳亲友如相问，一片冰心在玉壶。\n\n### 其二\n\n丹阳城南秋海阴，丹阳城北楚云深。\n高楼送客不能醉，寂寂寒江明月心。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 常系741前后，具体年份未定 |\n| 地点 | 丹阳、润州一带送别；芙蓉楼古址与今行政区不可径直混同 |\n| 官职 | 江宁丞阶段，通行解释；非在龙标任尉后确定之作 |\n| 生活处境 | 任低级官职，向远方亲友申明心志 |\n| 交游 | 辛渐，友人，生平详况未确证 |\n| 历史事件 | [[王昌龄]]仕途及交游；不强配某一已证实罪案 |\n\n## 结合处境解读\n\n寒雨、孤山、楚云、寒江让清冷景物贯穿两首。第一首借亲友问讯将人格表达送向洛阳，第二首把不能醉的送别与明月心衔接。\n\n“冰心玉壶”是清白品格的传统意象，但不能据一首自陈诗证明全部行为毫无争议；也不能拿史传“不护细行”就补出某件具体罪案来反驳诗人。\n\n## 系年、异文与证据边界\n\n两首完整收录。其一常单独流传，不能说它是组诗全篇；“夜入吴”有别本写法，采用本页来源正文。精确系年与送别楼址保留考订边界。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/芙蓉樓送辛漸)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "岑文本": "\n# 岑文本\n\n唐初文臣，字景仁，南阳棘阳人。文才、政务与文书工作是其重要履历；《旧唐书》记载他参与中枢文翰，并与史书编纂有关。\n\n## 与岑参的关系\n\n生平资料通常将他列为岑参曾祖。此处链接的是家世背景，两人不属于同一代，更不是实际诗歌交游对象。[[岑参·人生故事]]的开端需要区分家族名望和岑参早年的现实贫困。\n\n## 为什么值得单独建档\n\n从文本写作到官僚工作，是岑氏家族背景中可见的一条线索。但家族有显宦不能证明后辈一定继承财富或官位。阅读[[岑参进士及第与初授官]]时，可以把这种差距作为问题，而非直接推断具体家庭财产。\n\n关联：[[唐代幕府与谏官]]。\n\n## 来源与核查\n\n- [《旧唐书》卷70·岑文本](https://zh.wikisource.org/wiki/舊唐書/卷70)\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n", "岁暮归南山": "\n# 岁暮归南山\n\n作者：[[孟浩然]]。\n\n## 完整原文\n\n北阙休上书，南山归敝庐。\n不才明主弃，多病故人疏。\n白发催年老，青阳逼岁除。\n永怀愁不寐，松月夜窗虚。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 通行联系728年前后长安求仕失意；精确作年未定 |\n| 地点 | 北阙与南山构成朝廷／归居对举；南山具体所指有终南、故园不同理解 |\n| 官职 | 未得稳定官位，不是罢相 |\n| 生活处境 | 求荐受挫、自责与怨望、归去的念头 |\n| 交游 | 故人未点名；玄宗对话见较晚史传 |\n| 历史事件 | [[孟浩然长安求仕与荆州幕府]] |\n\n## 结合处境解读\n\n“不才”既自责也含怨，“故人疏”写失意者感觉支持减弱。归居没有立刻疗愈愁绪：松月夜窗仍照着不眠。\n\n《新唐书》把第三句嵌入御前逸事，但诗中“明主弃”是诗人的表达，不足独立证明玄宗真的以这句为由放还。\n\n## 系年、异文与证据边界\n\n题又作《归故园作》《归终南山》。“多病／卧病”“年老／年去”“窗／堂”等有异文。南山地理和御前故事的真实性、系年不能互相循环证明。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/歲暮歸南山)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "黄鹤楼送孟浩然之广陵": "\n# 黄鹤楼送孟浩然之广陵\n\n作者：[[李白]]。\n\n## 完整原文\n\n故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 730年说常见，另有728、737等系年 |\n| 地点 | 江夏黄鹤楼送行，广陵即扬州，是朋友的目的地 |\n| 官职 | 布衣漫游阶段，无证据为翰林任内 |\n| 生活处境 | 江汉交游中的离别 |\n| 交游 | [[孟浩然]] |\n| 历史事件 | [[李白孟浩然交游与江汉送别]]；乱前交通与吴越行旅 |\n\n## 结合处境解读\n\n三月繁华与船影消失并列，送别情绪通过持续的凝望产生，而不靠直接说悲伤。扬州既是现实旅行方向，也承载盛唐都会的吸引力。\n\n诗可以确认送行对象和方向，不能确认送行前住了几天、说了什么。“孤帆”是诗人目光中的一帆，不意味着当时长江航道没有其他船。\n\n## 系年、异文与证据边界\n\n“唯／惟”有不同录字。确切送别年有多说，不以旅游故事锁定某年某日；孟浩然启程的完整路线不由四句诗自行推导。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/黃鶴樓送孟浩然之廣陵)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n系年对读：[刘逸生《散考》转载](https://m.mokecn.com/guoxue/info_12942.html)。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "唐代皇帝主线·史料与关系规则": "\n# 唐代皇帝主线·史料与关系规则\n\n## 主线范围\n\n围绕李白、杜甫、高适、岑参，建立玄宗—肃宗—代宗三朝的知识网络。唐初家世、后世文学传播和追怀古人的关系，可保留原专题入口，不硬塞入三朝直接交往。\n\n## 四种边\n\n- **君臣、任职**：有任命或供奉资料支持，如玄宗与李白、肃宗与杜甫。\n- **事件背景**：生活和创作处于某朝，如代宗与杜甫夔州诗，不等于直接见面。\n- **诗友交游**：据诗题、寄赠或传记建立，如李白与杜甫。\n- **追怀与传播**：如诗中的诸葛亮、后来的集子编者，不是同时代亲见。\n\n## 作品保留办法\n\n原有完整诗文与创作坐标保留；追加皇帝时期导航不会重写正文。已有争议作年继续以“通行系年”“另一说”标明，如[[早发白帝城]]、[[蜀道难（李白）]]、[[将进酒（李白）]]。\n\n[[唐代三朝·作品与创作环境索引]]是导航层，不是新年谱。皇帝的在位年、年号和个人在世年也分列，参见[[唐代三朝·继承与时代时间线]]。\n\n## 来源方法\n\n本轮新增主要依据《旧唐书》玄宗、肃宗、代宗本纪及相关列传，配合既有诗人资料。史传中的祥瑞、性格判断、叛逆定性应作为叙述立场阅读；不能借皇帝主线把诗意简化成每项政令的直接回声。\n\n## 来源\n\n- [《旧唐书》卷8](https://zh.wikisource.org/wiki/舊唐書/卷8)\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n- [《旧唐书》卷11](https://zh.wikisource.org/wiki/舊唐書/卷11)\n- [《旧唐书》卷106](https://zh.wikisource.org/wiki/舊唐書/卷106)\n- [《旧唐书》卷107](https://zh.wikisource.org/wiki/舊唐書/卷107)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "人日寄杜二拾遗": "\n# 人日寄杜二拾遗\n\n作者：[[高适]]。年表：[[高适·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n人日题诗寄草堂，遥怜故人思故乡。\n柳条弄色不忍见，梅花满枝空断肠。\n身在远藩无所预，心怀百忧复千虑。\n今年人日空相忆，明年人日知何处。\n一卧东山三十春，岂知书剑老风尘。\n龙钟还忝二千石，愧尔东西南北人。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系761年（上元二年）正月初七；诗本身无年款，杜甫770年追酬序提供回溯线索，不能把“十余年”机械当精确计数。 |\n| 地点 | 通常系蜀州（今四川崇州一带），寄成都浣花溪草堂。 |\n| 当时官职 | 蜀州刺史；以杜甫追酬诗题和序自述为重要依据，蜀州、彭州任职先后及具体系年需结合年谱。 |\n| 生活处境 | 地方任官，有官位却远离中央大政；杜甫暂得草堂栖身仍多忧虑。 |\n| 交游与写作对象 | 直接寄[[杜甫]]；“杜二拾遗”沿用旧官称，此时杜甫不是在成都任左拾遗。 |\n| 历史事件 | [[高适杜甫蜀中交游与人日唱和]]；安史之乱仍在继续。 |\n\n## 结合处境读诗（整理者解读）\n\n柳梅本应带来春意，却使离乡之人“不忍见”。“无所预”不是说刺史完全没有工作，而是身在远地，许多国事无从参与。“二千石”借汉代郡守秩禄指刺史身份，并非实录其唐代薪俸。\n\n末句以自己有官与杜甫四方漂泊相对，包含歉疚与关怀。不能把它简化成成功者劝落魄者振作；高适自己也说“百忧”“千虑”。与[[追酬故高蜀州人日见寄]]合读，关系从当年的问候延伸到故友亡后的追忆。\n\n## 版本与辨析\n\n“远藩”一作“南蕃”，“空断肠”一作“堪断肠”。人日为农历正月初七，不是公历1月7日。“三十春”概括长期不得志，不直接用于反推生年。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [生平核对：《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [杜甫追酬序与全诗](https://zh.wikisource.org/wiki/歲時雜詠_(四庫全書本)/卷05)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "蜀相": "\n# 蜀相\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n丞相祠堂何处寻？锦官城外柏森森。\n映阶碧草自春色，隔叶黄鹂空好音。\n三顾频烦天下计，两朝开济老臣心。\n出师未捷身先死，长使英雄泪满襟。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系760年春，初到成都阶段。 |\n| 地点 | 成都诸葛亮祠一带；今日祠庙布局不能直接等同唐代所见。 |\n| 当时官职 | 已离华州任，尚未入严武幕。 |\n| 生活处境 | 初获成都栖身之所，政治抱负与流离经历仍在。 |\n| 交游与写作对象 | [[诸葛亮]]是追怀的历史人物，不是杜甫现实交游。 |\n| 历史事件 | [[杜甫成都草堂与严武幕府]]；安史之乱未平，借蜀汉旧事思索君臣与功业。 |\n\n## 结合处境读诗（整理者解读）\n\n“自”“空”让春色和鸟鸣仿佛与人的哀思脱节。三顾与两朝强调受到信任后长久尽职；末联写尽心经营仍未竟功业的结局。\n\n杜甫可以借诸葛亮表达自己的政治关切，但不应据诗宣布自己与诸葛亮完全等同，也不能把所有“英雄”限定为单一当代人物。失意之人的向往，在祠堂与流寓成都的处境中获得分量。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/蜀相)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "安禄山": "\n# 安禄山\n\n唐代边将，755年从范阳起兵，是安史之乱的发起者。边镇军权、中枢政治与个人势力构成其活动背景，不能把民族出身视为解释叛乱的唯一原因。\n\n## 人物关联\n\n[[唐玄宗李隆基]]曾任用他；他与[[杨国忠]]的冲突成为乱前政治的一部分。乱起后[[高仙芝]]、[[封常清]]参与抵抗，[[哥舒翰]]后来守潼关。\n\n## 事件与后续\n\n[[潼关失守与玄宗入蜀]]、[[长安陷落与杜甫困居]]展示朝廷与诗人遭遇的变化。安禄山757年死亡，并不代表叛乱结束；[[史思明]]等人的势力使战争继续。\n\n作品入口为[[月夜（杜甫）]]与[[春望]]。诗中的叛军称谓与修辞不宜直接当人口、兵力统计。\n\n## 来源\n\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "孟浩然": "\n# 孟浩然\n\n孟浩然（689—740，通行纪年；另有691年生说），襄州襄阳人，世称孟襄阳。生平与作品线索见[[孟浩然·年表与争议]]，整体阅读入口见[[李白孟浩然与盛唐诗友·知识地图]]。\n\n## 襄阳生活：有家园，也有向外的愿望\n\n他熟悉汉江、岘山和鹿门一带的山水。《旧唐书》以“隐鹿门山”概括其早年，但不能据此认定一生只住鹿门、从不求仕。[[过故人庄]]写友人邀饮和农事谈话，[[夜归鹿门山歌]]写从渡口喧闹转入幽居；这些作品呈现他选择的生活秩序，不是全部行踪的登记表。\n\n## 四十岁前后的长安求仕\n\n两《唐书》都说他约四十岁游京师，《旧唐书》明记应进士不第。通行年谱系于728年前后。他的声望已获[[王维]]、[[张九龄]]称许，却未因此取得稳定官位。[[岁暮归南山]]的自责、怨望与归去之念，和[[望洞庭湖赠张丞相]]委婉请求引荐的姿态可以对读。\n\n《新唐书》所载藏床、御前吟诗触怒玄宗的场景，见[[孟浩然长安求仕与荆州幕府]]；它是较晚史传中的逸事，不能作为确定落第原因的唯一证据。\n\n## 吴越行旅与荆州幕府\n\n孟浩然有东南漫游经历，[[宿建德江]]保留客船暮泊的孤独。他与[[李白]]的交往有赠送诗直接支持：[[赠孟浩然]]、[[黄鹤楼送孟浩然之广陵]]，具体相识年和送别年仍需考订。\n\n737年前后张九龄贬荆州长史，辟孟浩然为从事；史传对辟署记载明确，任期起讫与实际职掌不宜补写。“终身未仕”若解释成从未参与任何幕府事务，便抹去了这段经历。他没有获得显达仕途，与完全没有求仕行动是两回事。\n\n## 晚年与身后故事\n\n通行卒年740年，在安史之乱爆发之前。《新唐书》记病疽背卒，《唐才子传》又载[[王昌龄]]来访、欢饮食鲜而病发的细节；后一叙事晚出，不能把朋友写成可以确认的致死责任人。[[春晓（孟浩然）]]的惜春也不应凭空系于某一次落第或临终。\n\n他的生命路线与[[杜甫]]的战乱漂泊时间不同，二人山水诗中的“愁”不能统一套上安史之乱。\n\n## 来源与核查\n\n- [《旧唐书》孟浩然传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》孟浩然传](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n- [中国大百科：通行生卒纪年](https://www.zgbk.com/ecph/words?Name=孟浩然&SiteID=1&SourceID=19129&Type=bkzyb&subSourceType=000003000005000001)\n- [《唐才子传》卷二](https://ctext.org/wiki.pl?chapter=849792&if=gb)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "永王李璘": "\n# 永王李璘\n\n玄宗之子、肃宗的兄弟，封永王；他是宗室王，不是本专题中的在位皇帝。\n\n## 战时授权与冲突\n\n756年受[[唐玄宗李隆基]]战时授权，在江陵等地组织军事力量，后来东下，与[[唐肃宗李亨]]政府发生冲突，757年兵败被杀。\n\n## 为什么连接李白与高适\n\n[[李白]]进入其幕府；[[高适]]则受肃宗命参与应对永王的部署。见[[永王事件与高适李白分途]]。两位诗人原有交游，不足以推出他们必然共享政治判断，也不支持无史料的“拒绝救友”戏剧化场景。\n\n## 史料边界\n\n《旧唐书》本传从朝廷立场定性其行为；李白诗文涉及个人辩解和表达。动机与责任需交叉阅读，不能把一方叙述当作完整事实。\n\n后续：[[李白流夜郎与遇赦东还]]、[[早发白帝城]]。\n\n## 来源\n\n- [《旧唐书》卷107](https://zh.wikisource.org/wiki/舊唐書/卷107)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "高适与杜甫·作品与时代知识地图": "\n# 高适与杜甫·作品与时代知识地图\n\n从[[岑参·人生故事与知识导航]]延伸出来的双诗人专题。[[高适]]、[[杜甫]]保留原有介绍，新增作品原文、时代处境与独立人物事件。本地图是阅读入口，逐篇的来源与争议在各笔记内。\n\n## 先读生平，再读完整作品\n\n### 高适：由布衣到军政任职\n\n[[高适·年表与争议]] → [[燕歌行]] → [[别董大二首]] → [[封丘作]] → [[同诸公登慈恩寺浮图（高适）]] → [[人日寄杜二拾遗]]。\n\n[[除夜作（高适）]]单列为作年与地点未定的羁旅诗，不强插入一条精确年线。\n\n### 杜甫：壮游、求仕、战乱、草堂与江湘\n\n[[杜甫·年表与争议]] → [[望岳（岱宗夫如何）]] → [[春日忆李白]] → [[同诸公登慈恩寺塔（杜甫）]] → [[兵车行]] → [[月夜（杜甫）]] → [[春望]]。\n\n[[新安吏]]、[[潼关吏]]、[[石壕吏]]、[[新婚别]]、[[垂老别]]、[[无家别]]合读，先看[[邺城之败与三吏三别]]。\n\n草堂与流寓：[[蜀相]] → [[春夜喜雨]] → [[茅屋为秋风所破歌]] → [[闻官军收河南河北]]。\n\n晚年：[[旅夜书怀]] → [[秋兴八首]]（八首全录） → [[登高（杜甫）]] → [[登岳阳楼]] → [[追酬故高蜀州人日见寄]]（含序）。\n\n## 人物、职位、事件怎么相接\n\n| 起点 | 关系类型 | 终点 | 证据／阅读入口 |\n|---|---|---|---|\n| 高适 | 从归客得到军旅诗而和作 | [[张守珪]]所辖东北军镇 | [[燕歌行]]序；不是主帅亲自唱和 |\n| 高适 | 送别琴师 | [[董庭兰]] | [[别董大二首]]，通行对象对应 |\n| 高适 | 幕僚与幕主 | [[哥舒翰]] | 史传；[[高适封丘任职与入哥舒翰幕府]] |\n| 高适、杜甫 | 同游与诗歌交往 | [[李白]] | [[梁宋交游与李杜高同游]]；具体同行范围另辨 |\n| 高适、杜甫、岑参 | 登临唱和 | [[慈恩寺登塔唱和]] | 原诗题与杜诗原注 |\n| 杜甫 | 谏救有交谊的宰相 | [[房琯]] | [[杜甫谏救房琯与华州任职]] |\n| 杜甫 | 幕僚与幕主、生活支持 | [[严武]] | [[杜甫成都草堂与严武幕府]] |\n| 杜甫 | 家庭相思 | [[杨氏（杜甫妻）]] | [[月夜（杜甫）]]；悬想非实见 |\n| 杜甫 | 寄望平叛将帅 | [[郭子仪]] | [[新安吏]]“仆射”通行注解 |\n| 杜甫 | 追怀古人，非现实交游 | [[诸葛亮]] | [[蜀相]] |\n| 高适、杜甫 | 当年寄赠与亡后追酬 | [[高适杜甫蜀中交游与人日唱和]] | 两首诗及770年序 |\n\n## 历史主线\n\n[[开元东北边事与燕歌行]]、[[天宝开边与兵车行系年]]是乱前开边背景。\n\n[[潼关失守与玄宗入蜀]] → [[长安陷落与杜甫困居]] → [[杜甫谏救房琯与华州任职]] → [[邺城之败与三吏三别]] → [[安史之乱平定与杜甫闻捷]]。\n\n蜀中局势另走一条线：[[杜甫成都草堂与严武幕府]] → [[徐知道之乱与杜甫流寓梓阆]] → [[杜甫出蜀与夔州江湘漂泊]]。高适、李白乱中分途见[[永王事件与高适李白分途]]。\n\n## 与岑参对读的四条路线\n\n1. **军中处境**：[[燕歌行]] ↔ [[走马川行奉送封大夫出师西征]]，比较归客和作与出师送行。\n2. **同一地点，不同心境**：两人的慈恩寺诗 ↔ [[慈恩寺登塔唱和]]中的岑参作品。\n3. **朝廷交往和职位**：[[杜甫谏救房琯与华州任职]] ↔ [[寄左省杜拾遗]] ↔ [[唐代幕府与谏官]]。\n4. **蜀地行旅与归乡**：[[人日寄杜二拾遗]] ↔ [[追酬故高蜀州人日见寄]] ↔ [[岑参入蜀与嘉州岁月]]；不据同在蜀地虚构重聚。\n\n## 证据边界\n\n诗序明记日期优先，但诗句仍经过修辞。现代编年与史传互证时保留冲突；作年未定不补精确月份。完整古诗属于公版文本，现代赏析不整篇复制。本轮核查说明接[[岑参·史料来源与阅读方法]]。\n\n## 来源与核查\n\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [高适作品卷213](https://zh.wikisource.org/wiki/全唐詩/卷213)\n- [杜甫晚年组诗](https://zh.wikisource.org/wiki/秋興八首)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 扩展：李白、孟浩然与盛唐诗友\n\n[[李白孟浩然与盛唐诗友·知识地图]]从既有[[李白]]节点延伸到[[孟浩然]]、[[王维]]、[[贺知章]]、[[王昌龄]]、[[张九龄]]及诗友、编集者。先读两份年表，再沿作品页查地点、职位、生活处境和事件。\n\n对读：[[赠孟浩然]]与[[春日忆李白]]；[[对酒忆贺监二首]]与[[追酬故高蜀州人日见寄]]；[[宿建德江]]与[[旅夜书怀]]；[[望洞庭湖赠张丞相]]与[[登岳阳楼]]。\n\n孟浩然、贺知章分别通行卒于740、744，不参与安史之乱后的交游；关系网络不得自动转换成同席故事。李白史传卷号补正见[[李白]]的新增部分。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "同诸公登慈恩寺浮图（高适）": "\n# 同诸公登慈恩寺浮图（高适）\n\n作者：[[高适]]。年表：[[高适·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n香界泯群有，浮图岂诸相。\n登临骇孤高，披拂欣大壮。\n言是羽翼生，迥出虚空上。\n顿疑身世别，乃觉形神王。\n宫阙皆户前，山河尽檐向。\n秋风昨夜至，秦塞多清旷。\n千里何苍苍，五陵郁相望。\n盛世惭阮步，末宦知周防。\n输效独无因，斯焉可游放。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系752年秋；具体登塔年份属于后人系年，见[[慈恩寺登塔唱和]]。 |\n| 地点 | 长安慈恩寺塔。 |\n| 当时官职 | 通行编年处于离封丘任、入河西幕之前后衔接阶段；不能把后来节度使官职前移。 |\n| 生活处境 | 有仕途抱负，也感到地位低微、报效无门。 |\n| 交游与写作对象 | 与[[杜甫]]、[[薛据]]和岑参等同题唱和。 |\n| 历史事件 | [[慈恩寺登塔唱和]]，乱前长安诗人群体活动。 |\n\n## 结合处境读诗（整理者解读）\n\n佛寺词汇和登高的身体感受先使人仿佛脱离尘世，宫阙与山河又把视野拉回现实。“末宦”“输效独无因”说明他没有真正忘掉仕途，游放只能暂时安顿不得施展的抱负。\n\n对读[[同诸公登慈恩寺塔（杜甫）]]：高适以报效无门收束，杜甫则由俯瞰不辨皇州写到政治忧思与谋生。共同登临不意味着相同情绪。\n\n## 版本与辨析\n\n“浮图”指佛塔；“形神王”的“王”读作旺盛义，不径改为帝王。“周防”指周密防备、小官谨慎自处，不是现实交游人物。\n\n## 来源与核查\n\n- [《中国大百科全书》：同诸公登慈恩寺浮图](https://www.zgbk.com/ecph/words?ID=633649&SiteID=1&SubID=1105&Type=bkztb)\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/同諸公登慈恩寺浮圖)\n- [生平核对：《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "梁宋交游与李杜高同游": "\n# 梁宋交游与李杜高同游\n\n## 通行时间坐标\n\n744年前后，[[李白]]离开长安后与[[杜甫]]在洛阳相遇，随后同游梁宋，[[高适]]参与。745年前后李杜在齐鲁仍有交往；不能把所有齐鲁行程一概认定三人同时在场。具体相遇月份与同行范围应依年谱逐项核对。\n\n## 为什么重要\n\n这发生在杜甫长期困居长安之前，也在高适任封丘尉之前。三人的诗歌相知植根于求仕与游历，而不是“诗仙、诗圣、边塞派代表”三个后世标签的碰面。[[春日忆李白]]为离别后的怀念提供直接作品证据。\n\n## 与后来的分途\n\n[[永王事件与高适李白分途]]显示乱中朋友可能进入不同政治网络；[[高适杜甫蜀中交游与人日唱和]]则保存了高杜后来继续联系的另一条线。\n\n核查边界：没有依据三人诗句重建每日酒宴、对话和全程路线；[[别董大二首]]属于另一位友人的送别，不等于同游当天的作品。\n\n## 来源与核查\n\n- [《旧唐书》卷190下](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [《春日忆李白》](https://zh.wikisource.org/wiki/春日憶李白)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 扩展：李白其他时期的诗友\n\n[[李白孟浩然交游与江汉送别]]是更早的江汉交游；[[贺知章归乡与李白追忆]]是长安知遇与亡友记忆；[[将进酒（李白）]]点名[[岑勋]]、[[元丹丘]]。这些关系分别依据诗题、诗序或史传，不合成李白、高适、杜甫、孟浩然、王维、岑参等人的一次集会。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "哥舒翰": "\n# 哥舒翰\n\n唐代将领（卒于757年），有陇右、河西统军经历。[[高适]]进入其幕府任掌书记，后来又辅佐守潼关。幕府文职、监察官衔与实际统军责任要分开，见[[唐代幕府与谏官]]。\n\n## 由边镇名将到潼关失守\n\n安史之乱后奉命守关。756年在催促出战的政治与军事压力下率军出关失利，潼关失陷，玄宗入蜀；相关史传也记其疾病与指挥困境。不能把失守单归因于一位将领性格，更不能据文学语句核定伤亡人数。\n\n## 作品入口\n\n[[潼关吏]]的“慎勿学哥舒”写于759年前后，是后来对战略失败的警戒。高适在败后向玄宗陈说军中问题，见《旧唐书》卷111；这是诗人与现实军政相接的重要证据。\n\n关联：[[高适封丘任职与入哥舒翰幕府]]、[[潼关失守与玄宗入蜀]]、[[高仙芝]]、[[封常清]]。\n\n## 来源与核查\n\n- [《旧唐书》卷104](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "唐代三朝·继承与时代时间线": "\n# 唐代三朝·继承与时代时间线\n\n## 帝位与年号\n\n| 时间 | 帝位与大事 | 对应人物、事件 |\n|---|---|---|\n| 712 | 玄宗即位，先天时期 | [[唐玄宗李隆基]] |\n| 713—741 | 开元年号 | [[开元政局与文人求仕]]、[[张九龄]] |\n| 742—755 | 天宝前期至乱起 | [[李白翰林供奉与赐金放还]]、[[岑参第二次出塞]] |\n| 755 | 安禄山起兵 | [[安禄山]]、[[安史之乱与岑参东归]] |\n| 756 | 潼关失守、玄宗入蜀；肃宗灵武即位 | [[唐肃宗李亨]]、[[灵武即位与两京收复]] |\n| 757 | 两京收复；永王军事活动失败 | [[郭子仪]]、[[永王事件与高适李白分途]] |\n| 759 | 乾元时期，战争与征役反复 | [[邺城之败与三吏三别]]、[[李白流夜郎与遇赦东还]] |\n| 762 | 玄宗、肃宗去世；代宗继位；李白通行卒年 | [[唐代宗李豫]]、[[李白当涂晚年与诗集编纂]] |\n| 763 | 平乱；同年吐蕃入长安 | [[宝应继位与广德长安危机]] |\n| 764—765 | 杜甫入严武幕，后出蜀 | [[严武]]、[[杜甫出蜀与夔州江湘漂泊]] |\n| 766—770 | 大历前期，诗人蜀中与江湘晚年 | [[岑参入蜀与嘉州岁月]]、[[登岳阳楼]] |\n| 779 | 代宗去世，超出本专题诗人主要生命段 | [[唐代宗李豫]] |\n\n## 年界提醒\n\n一个公元年可以跨皇帝、跨年号：756、762尤其需要具体月份才能细分。“玄宗朝末期”“肃宗朝初期”有政治过程上的重叠，上皇与在位皇帝身份要分开。\n\n[[唐代三朝·作品与创作环境索引]]只按已有系年建立时期导航；精确作年未定的诗不被强行编入一个年份。\n\n## 来源\n\n- [《旧唐书》卷8](https://zh.wikisource.org/wiki/舊唐書/卷8)\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n- [《旧唐书》卷11](https://zh.wikisource.org/wiki/舊唐書/卷11)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "岑佐公": "\n# 岑佐公\n\n岑参之子，在其父遗文保存与集子编纂中扮演关键角色。本页依据[[杜确]]的集序建立档案，生卒和完整官职未核定，不补写履历。\n\n## 可以确认的联系\n\n集序称岑参去世已近三十年，嗣子佐公保存遗文并请杜确编次，最后成八卷。详见[[岑嘉州集的编纂与流传]]。\n\n## 为什么值得记录\n\n诗人作品的传承不只依靠作者本身，也依靠家属保存和编者整理。岑佐公将家庭文献连接到后世阅读，是[[岑参·人生故事]]最后一章中的重要人物。\n\n## 证据边界\n\n序称其有文采，这是编者的评价；本轮不据此推定传世作品数量或具体文学活动。关联：[[岑参·史料来源与阅读方法]]。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n", "唐代幕府与谏官": "\n# 唐代幕府与谏官\n\n## 幕府：为什么诗人会进入军队\n\n这里的幕府是节度使等长官身边的行政与军事辅助机构。掌书记侧重文书，判官承担军政辅助事务，实际职责随机构和任命而变。文人可借幕职获得职业机会，但幕僚不等于统军将领。\n\n[[高仙芝]]与[[封常清]]是岑参出塞时的主帅；[[杜鸿渐]]则连接其晚年蜀地幕职。三段关系对应不同政治时期，不能合成一个没有变化的“参军身份”。\n\n## 谏官：进言的职位\n\n补阙、拾遗属于与规谏、补正相关的官职。岑参的右补阙与[[杜甫]]的左拾遗，可结合[[寄左省杜拾遗]]阅读。左、右与官署相关，不等于现代政治光谱中的左右。\n\n## 理解作品的作用\n\n军幕献赠诗、朝廷寄赠诗各有具体对象和写作处境。知道职位可以帮助读诗，但不能据此推断作者完全认可主帅每项行动，或说作者每句赞语都必为讽刺。\n\n关联：[[岑参进士及第与初授官]]、[[安史之乱与岑参东归]]、[[岑参·年表与争议]]。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《旧唐书》卷104·高仙芝、封常清](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [《寄左省杜拾遗》原文](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n\n\n## 扩展：高适与杜甫的官职阅读\n\n| 职位 | 诗人及阶段 | 阅读入口 | 注意事项 |\n|---|---|---|---|\n| 县尉 | 高适，封丘任内 | [[封丘作]] | 属官，不是县令；基层礼仪与征催压力 |\n| 掌书记 | 高适，哥舒翰幕 | [[高适封丘任职与入哥舒翰幕府]] | 文书幕职不等于统军 |\n| 左拾遗 | 杜甫，757—758年 | [[杜甫谏救房琯与华州任职]]、[[寄左省杜拾遗]] | 两《唐书》“右拾遗”需与元稹墓铭互校 |\n| 州司功参军 | 杜甫，华州任内 | [[邺城之败与三吏三别]] | 诗人有州职，不等于沿途抓丁的县吏 |\n| 节度参谋、检校工部员外郎 | 杜甫，764年入严武幕 | [[杜甫成都草堂与严武幕府]] | 检校官衔不等于在中央工部持续办公 |\n| 刺史、节度使 | 高适，蜀地等地方任职 | [[人日寄杜二拾遗]]、[[徐知道之乱与杜甫流寓梓阆]] | 不把后期军政权力前移到早期送别诗 |\n\n诗题中的旧官称可能继续沿用：“杜二拾遗”不证明761年杜甫仍任拾遗，“二千石”借汉官称刺史也不是唐代实薪。\n\n校勘依据：[元稹《唐故工部员外郎杜君墓系铭》](https://zh.wikisource.org/wiki/唐故工部員外郎杜君墓系銘)，明确记“拜左拾遗”。\n\n\n## 补充：供奉、从事与使者\n\n[[李白翰林供奉与赐金放还]]的文学供奉，[[孟浩然长安求仕与荆州幕府]]的地方从事，[[使至塞上]]的朝廷使行，制度位置不同。诗人名字旁的“李翰林”“王右丞”“孟襄阳”可能分别是供奉称呼、后来的官衔、籍贯别称，不可一律填成作品创作时的实任官职。\n\n[[张九龄]]贬荆州后的幕府与[[哥舒翰]]军幕可对读；[[王维]]任右拾遗与[[杜甫]]任左拾遗也须区分左右机构。\n", "春望": "\n# 春望\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系757年春（至德二载），与困居长安经历相合。 |\n| 地点 | 叛军占领的长安。 |\n| 当时官职 | 尚未赴凤翔受左拾遗之命；曾有低级官职。 |\n| 生活处境 | 城市破败，妻儿远隔，书信难通。 |\n| 交游与写作对象 | 无具名赠答对象；家书连接鄜州妻儿。 |\n| 历史事件 | [[长安陷落与杜甫困居]]，两京尚未完全收复。 |\n\n## 结合处境读诗（整理者解读）\n\n山河与春草依然存在，恰使城中的人事破坏更加显眼。“花溅泪”“鸟惊心”既可解为见花闻鸟引发诗人的伤感，也有拟人读法，应保留解释空间。\n\n“万金”写信息匮乏时家书的心理价值，不是书信市场价格。末联由国家局势收进身体：忧虑使头发愈短，连簪都难支撑。所谓诗史在这里包含被战争改变的日常，不只包含战役名称。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/春望)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "裴迪": "\n# 裴迪\n\n裴迪，唐代诗人，生卒年不详，是[[王维]]辋川唱和的重要诗友。《辋川集》序明记王维与裴迪同游、各赋绝句，两人的同题作品构成可核查的交游证据。\n\n他的作用不是王维传记里的陪衬：同一山居景物进入两位诗人的语言，可以用于比较视角、动静与声色。详见[[王维辋川生活与陷贼受官]]。\n\n[[杜甫]]有寄裴迪、酬裴迪等题名作品。交往存在不等于每次聚会都可定年，更不意味着王维、孟浩然、李白、高适、岑参、杜甫和裴迪曾同席齐聚。\n\n## 来源与核查\n\n- [《辋川集》序与唱和](https://zh.wikisource.org/wiki/輞川集_(王維))\n- [《新唐书》王维传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [杜甫酬裴迪作品](https://zh.wikisource.org/wiki/和裴迪登蜀州東亭送客逢早梅相憶見寄)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n\n唱和对读：[《辋川集》（裴迪）](https://zh.wikisource.org/wiki/輞川集_(裴迪))。\n", "封常清": "\n# 封常清\n\n唐代安西、北庭军政系统中的重要将领。史传记其早年困顿，后来获[[高仙芝]]任用，因军中文书和军事能力逐渐升迁；这种履历表明军幕也需要文才与组织能力。\n\n## 与岑参的关系\n\n754年前后岑参进入他的幕府任判官，见[[岑参第二次出塞]]。岑参的献赠、出征诗中常称他为“封大夫”。[[走马川行奉送封大夫出师西征]]写的是送军出征的诗歌情境，不能逐句当作军事纪要。\n\n## 结局与阅读边界\n\n安史之乱初期，他在洛阳募军抵抗叛军，失利后与高仙芝退守潼关，继而被朝廷处死。史传保存临刑表文，展示其陈述的兵力与训练问题。评价时需要同时考虑军情、指挥与朝廷判断。\n\n关联：[[安史之乱与岑参东归]]、[[岑参·人生故事]]。\n\n## 来源与核查\n\n- [《旧唐书》卷104·高仙芝、封常清](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [香港教育局《白雪歌》教学资料](https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/secondary-edu/lang/chi_chapter/P030.pdf)\n- [《走马川行》原文](https://zh.wikisource.org/wiki/走馬川行奉送封大夫出師西征)\n", "登高（杜甫）": "\n# 登高（杜甫）\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通常系767年秋（大历二年）；常联系重阳，具体节日并非诗题明记。 |\n| 地点 | 夔州，今重庆奉节一带。 |\n| 当时官职 | 无现任实职；曾有检校工部员外郎官称，不能写成此时任当地工部官。 |\n| 生活处境 | 长期流寓，多病、衰老，归乡不得。 |\n| 交游与写作对象 | 无具名赠答对象；“独登台”写登临感受，非妻儿皆亡的证据。 |\n| 历史事件 | [[杜甫出蜀与夔州江湘漂泊]]；安史之乱虽平，秩序与生活尚未完全恢复。 |\n\n## 结合处境读诗（整理者解读）\n\n落木向下，长江奔来，一边是生命凋谢，一边是时间不息。颈联把万里空间、作客岁月、生命长度与多病身体叠在一起，使悲秋超出眼前天气。\n\n“新停浊酒杯”通常联系病中停饮，但诗未明说是哪一种疾病，也不能判定为绝对无钱买酒。与[[望岳（岱宗夫如何）]]对读，两首都有登高视野，却分别立足青年志向和晚年流寓。\n\n## 版本与辨析\n\n简繁转换与标点整理不作为异文；本页不列全部校勘记。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/登高)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐代宗李豫]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "无家别": "\n# 无家别\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n寂寞天宝后，园庐但蒿藜。\n我里百余家，世乱各东西。\n存者无消息，死者为尘泥。\n贱子因阵败，归来寻旧蹊。\n久行见空巷，日瘦气惨凄。\n但对狐与狸，竖毛怒我啼。\n四邻何所有？一二老寡妻。\n宿鸟恋本枝，安辞且穷栖。\n方春独荷锄，日暮还灌畦。\n县吏知我至，召令习鼓鞞。\n虽从本州役，内顾无所携。\n近行止一身，远去终转迷。\n家乡既荡尽，远近理亦齐。\n永痛长病母，五年委沟溪。\n生我不得力，终身两酸嘶。\n人生无家别，何以为蒸黎！\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行系759年（乾元二年）春，洛阳返回华州途中及相关创作；诗中细节的完成时间不能逐首精确到某日。 |\n| 地点 | 败兵归乡的乡村空间，无可确证村名。 |\n| 当时官职 | 华州司功参军，负责相关州务，不是现场主持抓丁的县吏。 |\n| 生活处境 | 朝廷任职受挫后在华州任官，往返河南与关中，目睹战争和征役压力。 |\n| 交游与写作对象 | 返乡士卒的独白，母亲病亡与无家处境不等于作者家庭履历。 |\n| 历史事件 | [[邺城之败与三吏三别]]；[[杜甫谏救房琯与华州任职]]。 |\n\n## 结合处境读诗（整理者解读）\n\n还乡本应重新获得依靠，却只见空巷、狐狸和寡妇。主人公刚想以耕种恢复生活，又被召去训练；“远近理亦齐”不是超然，而是家乡被毁后已无真正可回的地方。\n\n末尾质问“何以为蒸黎”，把无家之痛推向人与社会的关系：人民承担兵役，却失去维持家庭和生产的基础。“五年”是诗中人物叙事，不能单独据此计算整个安史之乱已持续五周年。\n\n## 版本与辨析\n\n三吏三别是后人并称，不是六篇逐日实录；诗中叙述与人物言语经过文学组织。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/无家别)\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐肃宗李亨]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "灵武即位与两京收复": "\n# 灵武即位与两京收复\n\n## 两个时间节点\n\n756年[[唐肃宗李亨]]在灵武即位，[[唐玄宗李隆基]]已进入蜀地。757年唐军收复长安、洛阳；这两个节点不能合写成同一年的平乱结局。\n\n## 为什么重要\n\n皇帝主线在此从玄宗转向肃宗；军事组织、财政与授权也进入战时调整。[[郭子仪]]等将领的作战是收复过程的重要部分，皇帝即位本身不等于自动解决兵力与粮饷问题。\n\n## 人物路线\n\n[[杜甫]]从陷落长安脱身后赴凤翔任职；[[岑参·人生故事]]进入东归与谏官阶段。[[永王李璘]]曾受玄宗授权，其后与肃宗政府冲突，另见[[永王事件与高适李白分途]]。\n\n## 诗歌入口\n\n[[春望]]以陷落长安为背景，不能当作收复庆典诗；[[寄左省杜拾遗]]连接朝廷工作。最终平乱与杜甫闻捷要到[[安史之乱平定与杜甫闻捷]]。\n\n## 来源\n\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n- [《旧唐书》卷107](https://zh.wikisource.org/wiki/舊唐書/卷107)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "安史之乱与岑参东归": "\n# 安史之乱与岑参东归\n\n## 大背景\n\n安史之乱通常指755—763年的叛乱及平定过程。边镇军事力量与中央关系的危机，带来两京失陷、政权组织调整和广泛流离。这里关注其与岑参有关的部分，不作为全战史。\n\n## 岑参周边的变化\n\n[[高仙芝]]、[[封常清]]在平乱初期被朝廷处死，见《旧唐书》卷104。岑参后来东归，进入补阙等职位；[[杜甫]]参与荐举的说法见后世传记，作品则能证实两人朝廷交往。\n\n## 为什么影响他的故事\n\n军幕的边塞生活不再能独立于中原危机。[[寄左省杜拾遗]]把阅读场景转到中央朝廷，而不是继续停在壮阔的风雪中。\n\n## 时间与证据限制\n\n东归路线、收到主帅死讯的时间和即时心理，本轮不作具体化。使用[[岑参·年表与争议]]区分通行编年与直接记载。\n\n关联：[[唐代幕府与谏官]]、[[岑参入蜀与嘉州岁月]]。\n\n## 来源与核查\n\n- [《旧唐书》卷104·高仙芝、封常清](https://zh.wikisource.org/wiki/舊唐書/卷104)\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [《唐才子传》卷3·岑参](https://zh.wikisource.org/wiki/唐才子傳/卷3)\n- [《寄左省杜拾遗》原文](https://zh.wikisource.org/wiki/寄左省杜拾遺)\n\n\n## 扩展：诗友在战乱中的不同位置\n\n[[潼关失守与玄宗入蜀]]连接高适辅佐哥舒翰、岑参幕主网络变化与杜甫家庭离散。杜甫线可沿[[长安陷落与杜甫困居]] → [[杜甫谏救房琯与华州任职]] → [[邺城之败与三吏三别]] → [[安史之乱平定与杜甫闻捷]]阅读。\n\n[[永王事件与高适李白分途]]说明朋友在战时可能进入不同政治网络。[[徐知道之乱与杜甫流寓梓阆]]则展示蜀地另有地方动乱，不能将全国叛乱结束等同所有地方立即安定。\n\n\n## 皇帝主线阅读\n\n[[唐代皇帝主线·人物事件与诗歌知识地图]]以[[唐玄宗李隆基]] → [[唐肃宗李亨]] → [[唐代宗李豫]]连接既有人物、事件与完整作品。跨朝经历仍需按本页具体节点区分；年号转换见[[唐代三朝·继承与时代时间线]]。\n", "岑参进士及第与初授官": "\n# 岑参进士及第与初授官\n\n## 时间与过程\n\n唐玄宗天宝年间，岑参由读书求仕进入官僚体系。杜确序记天宝三载（744）进士高第；现代辞典有改系五载（746）的考订。此后任率府兵曹参军等职，及第和授官是不同节点。\n\n## 人生意义\n\n文章从个人才能转为任职资格，但微官未必立即消除生活压力。《初授官题高冠草堂》写任职与山林生活的牵扯，可在《全唐诗》卷200查读。不能据诗中的年龄直接消除全部生年争议。\n\n## 关联\n\n[[岑文本]]提供家世背景；[[唐代幕府与谏官]]说明此后不同官职的工作；[[岑参第一次出塞]]是职业方向的重要变化。阅读年表见[[岑参·年表与争议]]。\n\n## 来源与核查\n\n- [杜确《岑嘉州集序》，《全唐文》卷459](https://ctext.org/wiki.pl?chapter=870020&if=gb)\n- [搜韵收录的人名辞典与《唐诗大辞典》条目](https://hhl.cnkgraph.com/People/14000)\n- [《全唐诗》卷198](https://zh.wikisource.org/wiki/全唐詩/卷198)\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "唐代三朝·作品与创作环境索引": "\n# 唐代三朝·作品与创作环境索引\n\n先按皇帝时期找到作品，再进入原页的“完整原文”“创作坐标”“结合处境解读”。以下按现有通行系年分组；含争议的篇目不会由此获得确定作年。\n\n## [[唐玄宗李隆基]]\n\n- [[行路难三首（李白）]]：完整内容与背景见原作品页。\n- [[蜀道难（李白）]]：完整内容与背景见原作品页。\n- [[将进酒（李白）]]：完整内容与背景见原作品页。\n- [[黄鹤楼送孟浩然之广陵]]：完整内容与背景见原作品页。\n- [[赠孟浩然]]：完整内容与背景见原作品页。\n- [[对酒忆贺监二首]]：完整内容与背景见原作品页。\n- [[闻王昌龄左迁龙标遥有此寄]]：完整内容与背景见原作品页。\n- [[燕歌行]]：完整内容与背景见原作品页。\n- [[别董大二首]]：完整内容与背景见原作品页。\n- [[封丘作]]：完整内容与背景见原作品页。\n- [[同诸公登慈恩寺浮图（高适）]]：完整内容与背景见原作品页。\n- [[同诸公登慈恩寺塔（杜甫）]]：完整内容与背景见原作品页。\n- [[望岳（岱宗夫如何）]]：完整内容与背景见原作品页。\n- [[春日忆李白]]：完整内容与背景见原作品页。\n- [[兵车行]]：完整内容与背景见原作品页。\n- [[白雪歌送武判官归京]]：完整内容与背景见原作品页。\n- [[逢入京使]]：完整内容与背景见原作品页。\n- [[走马川行奉送封大夫出师西征]]：完整内容与背景见原作品页。\n\n## [[唐肃宗李亨]]\n\n- [[早发白帝城]]：完整内容与背景见原作品页。\n- [[月夜（杜甫）]]：完整内容与背景见原作品页。\n- [[春望]]：完整内容与背景见原作品页。\n- [[新安吏]]：完整内容与背景见原作品页。\n- [[潼关吏]]：完整内容与背景见原作品页。\n- [[石壕吏]]：完整内容与背景见原作品页。\n- [[新婚别]]：完整内容与背景见原作品页。\n- [[垂老别]]：完整内容与背景见原作品页。\n- [[无家别]]：完整内容与背景见原作品页。\n- [[蜀相]]：完整内容与背景见原作品页。\n- [[春夜喜雨]]：完整内容与背景见原作品页。\n- [[茅屋为秋风所破歌]]：完整内容与背景见原作品页。\n- [[人日寄杜二拾遗]]：完整内容与背景见原作品页。\n- [[寄左省杜拾遗]]：完整内容与背景见原作品页。\n\n## [[唐代宗李豫]]\n\n- [[闻官军收河南河北]]：完整内容与背景见原作品页。\n- [[旅夜书怀]]：完整内容与背景见原作品页。\n- [[秋兴八首]]：完整内容与背景见原作品页。\n- [[登高（杜甫）]]：完整内容与背景见原作品页。\n- [[登岳阳楼]]：完整内容与背景见原作品页。\n- [[追酬故高蜀州人日见寄]]：完整内容与背景见原作品页。\n\n## 边界与跨朝\n\n- 《早发白帝城》按759遇赦说置于肃宗朝；另一早年作说仍在原页。\n- 《蜀道难》《将进酒》具体作年、场景或对象有讨论，玄宗朝分组只给时代坐标。\n- 李白当涂晚年接近762年继位年；原笔记讨论生平与编集，并不证明代宗任用李白。\n- [[杜甫成都草堂与严武幕府]]跨肃宗、代宗：草堂早期诗与764幕府诗分开。\n- [[高适杜甫蜀中交游与人日唱和]]连接寄诗与多年后追酬，不能按同一首诗的年份给整个事件定朝。\n\n全文保留在原作品页。皇帝、事件、作品三层可相互跳转，而原文并不会被政治背景摘要替代。\n\n## 来源\n\n- [《旧唐书》卷8](https://zh.wikisource.org/wiki/舊唐書/卷8)\n- [《旧唐书》卷9](https://zh.wikisource.org/wiki/舊唐書/卷9)\n- [《旧唐书》卷10](https://zh.wikisource.org/wiki/舊唐書/卷10)\n- [《旧唐书》卷11](https://zh.wikisource.org/wiki/舊唐書/卷11)\n\n核查日期：2026-10-02。线上古籍为阅读入口；作品系年与史传叙述的差别另行标明。\n", "王维辋川生活与陷贼受官": "\n# 王维辋川生活与陷贼受官\n\n## 辋川别业与裴迪唱和\n\n辋川位于蓝田京畿，[[王维]]拥有别业，与[[裴迪]]同游、同题赋绝句。《辋川集》序与二十处景物题名可支持唱和，不能据此编造每次夜谈的言辞。别业与在朝任官可以重叠；“半官半隐”是概括生活方式，非一个正式官职。\n\n## 756—757年的两京危局\n\n756年长安陷落，王维被获，叛军将其置于洛阳并迫受给事中等职。史传记服药、佯喑逃避以及凝碧池诗；757年两京收复后，王维被追究受伪职问题，因悲悼诗和弟王缙求情等从轻处理。由此可与[[长安陷落与杜甫困居]]对照不同文人的被困、脱身与审查路径。\n\n## 凝碧池诗原文\n\n万户伤心生野烟，百僚何日更朝天。\n秋槐叶落空宫里，凝碧池头奏管弦。\n\n据《全唐诗》王维卷，题为《菩提寺禁裴迪来相看说逆贼等凝碧池上作音乐供奉人等举声便一时泪下私成口号诵示裴迪》。此处四句全录；题目交代的是裴迪转告音乐场景，不能改写成王维本人在池旁亲见、当众作诗。“生／起野烟”“百僚／百官”“更／再朝天”有异文，本页依《全唐诗》卷128录“百僚何日更朝天”。\n\n## 后来的职位与信仰\n\n王维后来官至尚书右丞。信佛与山水艺术不能抹去仕途和战乱经历；“诗佛”是后世概括。与[[孟浩然]]并称王孟，也不意味着两人都没有现实求仕压力。\n\n## 来源与核查\n\n- [《旧唐书》王维传](https://zh.wikisource.org/wiki/舊唐書/卷190下)\n- [《新唐书》王维传](https://zh.wikisource.org/zh-hant/新唐書/卷202)\n- [《辋川集》](https://zh.wikisource.org/wiki/輞川集_(王維))\n- [凝碧池诗，《全唐诗》卷128](https://zh.wikisource.org/wiki/全唐詩/卷128)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传记载、通行编年、整理者解读分开表述。作年不确定时不补精确日期。\n", "除夜作（高适）": "\n# 除夜作（高适）\n\n作者：[[高适]]。年表：[[高适·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n旅馆寒灯独不眠，客心何事转凄然。\n故乡今夜思千里，霜鬓明朝又一年。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 未定；有年谱推测系于750年，不能作为公认定年。 |\n| 地点 | 客舍明确，具体城址未定；蓟北等定位需依赖系年假说。 |\n| 当时官职 | 不确定；若取750年说，可联系封丘尉任内行役，但不能据诗直接确认。 |\n| 生活处境 | 除夕羁旅失眠，年龄增长使乡思更迫切。 |\n| 交游与写作对象 | 写故乡亲人，没有具名赠答对象。 |\n| 历史事件 | 不能确定对应某次战事；以行役与年节背景阅读。 |\n\n## 结合处境读诗（整理者解读）\n\n前两句从寒灯和“不眠”写出旅馆的孤独。第三句通常解为悬想故乡亲人正在想念远在千里之外的自己，视点从客舍转回家中；也须知道“思”的主语属于解释问题。末句让除夕的喜庆变成又老一年的提醒。\n\n可与[[月夜（杜甫）]]对读，两者都通过想象亲人的视角写相思；杜诗处于两地隔绝的战乱中，本诗具体事件未定，不能强行赋予相同背景。\n\n## 版本与辨析\n\n《全唐诗》录文以“愁鬓”为正文并注一作“霜鬓”；《高常侍集》四部丛刊本卷八及通行选本常用“霜鬓”，本页采用此读法。750年说仅据转述提示，未读所引年谱全文。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/除夜作_(高適))\n- [生平核对：《旧唐书》卷111](https://zh.wikisource.org/wiki/舊唐書/卷111)\n- [系年推测的二手转述](https://culture.pkstate.com/gushiwen/2188.html)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n", "望岳（岱宗夫如何）": "\n# 望岳（岱宗夫如何）\n\n作者：[[杜甫]]。年表：[[杜甫·年表与争议]]。专题：[[高适与杜甫·作品与时代知识地图]]。\n\n## 完整原文\n\n岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。\n\n## 创作坐标\n\n| 项目 | 说明 |\n|---|---|\n| 作年与确定程度 | 通行约736年；也可稳妥标为开元年间齐赵壮游期，具体年并无诗题年款。 |\n| 地点 | 泰山周边，写“望岳”，不能据末联认定已经登顶。 |\n| 当时官职 | 未仕。 |\n| 生活处境 | 青年游历阶段，尚未经历长安求仕十年与安史之乱。 |\n| 交游与写作对象 | 无明确赠答对象；不能将后来744年的李杜相会前移。 |\n| 历史事件 | 壮游背景；与晚年[[登高（杜甫）]]形成生命阶段对读。 |\n\n## 结合处境读诗（整理者解读）\n\n“齐鲁青未了”以横跨齐鲁的山色显出泰山之大，“割昏晓”让山的高峻成为明暗分界。视线由远望转入云气、归鸟，最后写将来登顶的志愿。\n\n青年人的昂扬是这首诗的具体面貌。与[[登高（杜甫）]]对读时，应看到年龄、健康和流寓处境的变化，不要说他年轻时就已经以同样方式预见所有晚年苦难。\n\n## 版本与辨析\n\n杜甫另有咏华山、衡山的《望岳》，本页用首句消歧。“曾云”读作层云，保留常见古字。\n\n## 来源与核查\n\n- [古籍原文／线上录文](https://zh.wikisource.org/wiki/望嶽_(岱宗夫如何))\n- [生平互校：《新唐书》卷201](https://zh.wikisource.org/wiki/新唐書/卷201)\n\n核查日期：2026-10-01。古诗正文用简体字与现代标点；释读为整理者解读，系年不是原文自带日期时另作说明。\n\n\n## 皇帝主线关联\n\n时代入口：[[唐玄宗李隆基]]。此链接按本页通行编年或事件背景建立；作年有争议时仍以本页说明为准，不能据分组推定与皇帝直接会面。\n\n总览：[[唐代皇帝主线·人物事件与诗歌知识地图]]；对读：[[唐代三朝·作品与创作环境索引]]。\n", "过故人庄": "\n# 过故人庄\n\n作者：[[孟浩然]]。\n\n## 完整原文\n\n故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开筵面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。\n\n## 创作坐标\n\n| 项目 | 可确认或通行理解 |\n|---|---|\n| 作年 | 未定，不凭田园题材锁定青年年岁 |\n| 地点 | 田家村庄，常联系襄阳乡居；确切村庄不确证 |\n| 官职 | 无据认定创作时在荆州任从事 |\n| 生活处境 | 受友人邀请的乡居社交 |\n| 交游 | 故人未具姓名，不配成张九龄或李白 |\n| 历史事件 | [[孟浩然]]的家园生活；不套安史之乱 |\n\n## 结合处境解读\n\n鸡黍、场圃、桑麻让友情进入日常劳动的空间。最后约定再来，使田园不是无人之境，而是可以返回的人际关系。\n\n这种轻松并不证明诗人一生没有失意，也不证明故人富裕或贫困到某个程度。乡居的秩序与[[岁暮归南山]]的失意、[[宿建德江]]的客愁可以并读。\n\n## 系年、异文与证据边界\n\n“过”是过访；“就菊花”常联系重阳赏菊饮酒，不补当天细节。作年、故人姓名、庄址均未定。\n\n## 来源与核查\n\n- [古诗原文与版本](https://zh.wikisource.org/wiki/過故人莊)\n- [人物史传互校](https://zh.wikisource.org/zh-hant/新唐書/卷203)\n\n核查日期：2026-10-01。古诗用简体字与现代标点；正文、史传
